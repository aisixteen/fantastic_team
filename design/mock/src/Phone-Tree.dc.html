<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team on a phone: the team</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
[data-theme]{--sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
[data-theme="light"]{--bg:#EDEDED;--page:radial-gradient(circle at 1px 1px,rgb(0 0 0/.14) 1px,transparent 1.6px) 0 0/22px 22px,radial-gradient(70% 55% at 12% -5%,#fff 0,transparent 70%),radial-gradient(55% 60% at 105% 105%,rgb(0 0 0/.16) 0,transparent 70%),#EDEDED;--panel:rgb(255 255 255/.58);--panel-flat:rgb(255 255 255/.72);--side:rgb(0 0 0/.03);--surface:rgb(255 255 255/.72);--sunken:rgb(0 0 0/.06);--hover:rgb(0 0 0/.09);--line:rgb(0 0 0/.10);--line2:rgb(0 0 0/.18);--text:#0B0B0B;--text2:#454545;--text3:#6B6B6B;--accent:#111111;--accent-weak:rgb(0 0 0/.08);--accent-line:rgb(0 0 0/.30);--on-accent:#FFFFFF;--ok:#1B7446;--warn:#8F5200;--bad:#B3261E;--knock:#F8F8F8;--head:rgb(0 0 0/.70);--chip:rgb(0 0 0/.05);--chip-line:rgb(0 0 0/.06);--ext:rgb(0 0 0/.12);--ext-line:rgb(0 0 0/.40);--bubble:rgb(255 255 255/.60);--bubble-user:rgb(0 0 0/.10);--code:rgb(0 0 0/.045);--well:rgb(0 0 0/.06);--input:rgb(0 0 0/.06);--shadow-bezel:0 10px 30px rgb(0 0 0/.10),0 1px 2px rgb(0 0 0/.06);--shadow-bubble:inset 0 0 0 1px rgb(0 0 0/.07)}
[data-theme="dark"]{--bg:#050505;--page:radial-gradient(circle at 1px 1px,rgb(255 255 255/.14) 1px,transparent 1.6px) 0 0/22px 22px,radial-gradient(70% 55% at 12% -5%,rgb(255 255 255/.20) 0,transparent 70%),radial-gradient(55% 60% at 105% 105%,rgb(255 255 255/.10) 0,transparent 70%),#050505;--panel:rgb(20 20 20/.58);--panel-flat:rgb(20 20 20/.74);--side:rgb(255 255 255/.03);--surface:rgb(255 255 255/.07);--sunken:rgb(255 255 255/.07);--hover:rgb(255 255 255/.10);--line:rgb(255 255 255/.10);--line2:rgb(255 255 255/.18);--text:#F2F2F2;--text2:#B8B8B8;--text3:#8E8E8E;--accent:#F5F5F5;--accent-weak:rgb(255 255 255/.10);--accent-line:rgb(255 255 255/.32);--on-accent:#0B0B0B;--ok:#72D6A2;--warn:#F0B75A;--bad:#FF9288;--knock:#0E0E0E;--head:rgb(255 255 255/.70);--chip:rgb(255 255 255/.05);--chip-line:rgb(255 255 255/.06);--ext:rgb(255 255 255/.14);--ext-line:rgb(255 255 255/.42);--bubble:rgb(255 255 255/.07);--bubble-user:rgb(255 255 255/.16);--code:rgb(0 0 0/.35);--well:rgb(0 0 0/.38);--input:rgb(255 255 255/.06);--shadow-bezel:0 10px 30px rgb(0 0 0/.45),0 1px 2px rgb(0 0 0/.30);--shadow-bubble:inset 0 1px 0 rgb(255 255 255/.10)}
[data-theme]{--ok-weak:color-mix(in srgb,var(--ok) 12%,transparent);--warn-weak:color-mix(in srgb,var(--warn) 12%,transparent);--warn-line:color-mix(in srgb,var(--warn) 45%,transparent);--bad-weak:color-mix(in srgb,var(--bad) 12%,transparent);--bad-line:color-mix(in srgb,var(--bad) 45%,transparent)}
.hov:active{background:var(--hover) !important}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spin{animation:spin 1.1s linear infinite}
.ns{flex:none;display:inline-flex;align-items:center;gap:4px;padding:0 6px;border:1px dashed var(--ext-line);border-radius:6px;font:500 10px/16px var(--mono);color:var(--text2);white-space:nowrap}
.ns b{font-weight:700;color:var(--text)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</helmet>
<div data-theme="{{theme}}" style="display: flex; flex-direction: column; gap: 12px; height: 844px; overflow: hidden; padding: 44px 12px 0; background: linear-gradient(var(--panel-flat), var(--panel-flat)), var(--page); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.4">

<div style="display: flex; align-items: center; gap: 10px; padding: 0 4px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
<div style="max-width: 100%; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Launch week</div>
<span class="ns" style="max-width: 100%; overflow: hidden; text-overflow: ellipsis"><b>needs source:</b> other kernels, what waits there</span>
</div>
<button type="button" class="hov" aria-label="Switch kernel. Now: Launch week. One other kernel needs you" style="position: relative; flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px 0 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface)">
<span style="display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; font: 600 11px/1 var(--mono); color: var(--on-accent); background: var(--accent)">LW</span>
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text3)"><path d="M2 3.5l3 3 3-3"></path></svg>
<span style="position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--knock)"></span>
</button>
</div>

<section aria-label="Waiting for you" style="display: flex; flex-direction: column; gap: 2px; padding: 8px 4px 4px; border: 1px solid var(--warn-line); border-radius: 12px; background: var(--warn-weak)">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 8px 4px">
<h2 style="margin: 0; font: 600 11px/1.4 var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--warn)">Waiting for you</h2>
<span style="display: grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; font: 700 11px/1 var(--sans); color: var(--knock); background: var(--warn)">2</span>
</div>
<sc-for list="{{waiting}}" as="w" hint-placeholder-count="3">
<button type="button" class="hov" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--surface); color: var(--text2)">
<sc-if value="{{w.ai}}" hint-placeholder-val="{{true}}"><img src="/_blob/4391040ca996853236d2105e3388d1f7" alt="" style="width: 18px; height: auto"></sc-if>
<sc-if value="{{w.tool}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{w.d}}"></path></svg></sc-if>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.who}}</span>
<span style="font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{w.text}}</span>
</span>
<span style="flex: none; font: 500 11px/1 var(--mono); color: var(--warn)">{{w.age}}</span>
</button>
</sc-for>
</section>

<div style="flex: 1; min-height: 0; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="12">
<sc-if value="{{row.agent}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; padding-left: {{row.pad}}">
<button type="button" class="hov" aria-label="{{row.fold}}" style="visibility: {{row.tw}}; flex: none; display: grid; place-items: center; width: 22px; height: 44px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--text3)"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform: {{row.rot}}"><path d="M2 3.5l3 3 3-3"></path></svg></button>
<button type="button" class="hov" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 3px 8px 3px 4px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="position: relative; flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: {{row.tile}}">
<img src="/_blob/4391040ca996853236d2105e3388d1f7" alt="" style="width: 19px; height: auto; filter: {{row.filter}}">
<span class="{{row.bcls}}" style="position: absolute; right: -4px; bottom: -4px; display: {{row.bdisp}}; place-items: center; width: 14px; height: 14px; border-radius: 50%; font: 700 9px/1 var(--sans); color: {{row.bfg}}; background: {{row.bbg}}; border: {{row.bbd}}; border-top-color: {{row.btop}}; box-shadow: {{row.bsh}}">{{row.btxt}}</span>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
<span style="font-weight: {{row.w}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="flex: none; font-size: 13px; color: {{row.sc}}; white-space: nowrap">{{row.status}}</span><sc-if value="{{row.ns}}" hint-placeholder-val="{{false}}"><span class="ns" style="flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis"><b>needs source:</b> {{row.ns}}</span></sc-if></span>
</span>
<span style="flex: none; font: 500 11px/1 var(--mono); color: {{row.agec}}">{{row.age}}</span>
</button>
</div>
</sc-if>
<sc-if value="{{row.file}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; padding-left: {{row.pad}}; background: {{row.guide}}">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 22px; height: 34px; color: var(--text3); visibility: {{row.tw}}"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform: {{row.rot}}"><path d="M2 3.5l3 3 3-3"></path></svg></span>
<button type="button" class="hov" aria-expanded="{{row.exp}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; min-height: 34px; padding: 2px 8px 2px 4px; border: 0; border-radius: 6px; background: transparent; text-align: left">
<span style="flex: none; display: grid; place-items: center; width: {{row.tsz}}; height: {{row.tsz}}; border-radius: 6px; background: {{row.tbg}}; color: var(--text3)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{row.d}}"></path></svg></span>
<span style="flex: 0 1 auto; min-width: 0; font: {{row.w}} 13px/1.3 var(--mono); color: {{row.fg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.name}}</span>
<span style="flex: none; display: {{row.tagd}}; font: 10px/16px var(--mono); padding: 0 5px; border-radius: 4px; color: var(--text2); background: var(--sunken)">{{row.tag}}</span>
</button>
</div>
</sc-if>
</sc-for>
</div>
</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 1px; margin: 0 -12px; padding: 6px 12px 0; border-top: 1px solid var(--line)">
<sc-for list="{{pins}}" as="row" hint-placeholder-count="2">
<div style="display: flex; align-items: center; padding-left: {{row.pad}}; background: {{row.guide}}">
<span aria-hidden="true" style="flex: none; display: grid; place-items: center; width: 22px; height: 34px; color: var(--text3); visibility: {{row.tw}}"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform: {{row.rot}}"><path d="M2 3.5l3 3 3-3"></path></svg></span>
<button type="button" class="hov" aria-expanded="{{row.exp}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; min-height: 34px; padding: 2px 8px 2px 4px; border: 0; border-radius: 6px; background: transparent; text-align: left">
<span style="flex: none; display: grid; place-items: center; width: {{row.tsz}}; height: {{row.tsz}}; border-radius: 6px; background: {{row.tbg}}; color: var(--text3)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{row.d}}"></path></svg></span>
<span style="flex: 0 1 auto; min-width: 0; font: {{row.w}} 13px/1.3 var(--mono); color: {{row.fg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.name}}</span>
<span style="flex: none; display: {{row.tagd}}; font: 10px/16px var(--mono); padding: 0 5px; border-radius: 4px; color: var(--text2); background: var(--sunken)">{{row.tag}}</span>
</button>
</div>
</sc-for>

<button type="button" class="hov" aria-expanded="false" style="flex: none; display: flex; align-items: center; gap: 11px; min-height: 44px; margin-left: 14px; padding: 3px 8px 3px 0; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="flex: none; display: grid; place-items: center; width: 22px; height: 30px; color: var(--text3)"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(-90deg)"><path d="M2 3.5l3 3 3-3"></path></svg></span>
<span style="flex: none; display: flex">
<sc-for list="{{toolIcons}}" as="t" hint-placeholder-count="3">
<span style="display: grid; place-items: center; width: 26px; height: 26px; margin-left: {{t.ml}}; border-radius: 8px; background: var(--sunken); color: var(--text2); box-shadow: 0 0 0 2px var(--knock)"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg></span>
</sc-for>
</span>
<span style="flex: 1; min-width: 0; font-weight: 500; color: var(--text2)">5 tools</span>
</button>
</div>

<div style="display: flex; align-items: center; justify-content: center; min-height: 34px; margin: 0 -12px; padding: 4px 12px 14px; border-top: 1px solid var(--line); background: var(--side)">
<span role="img" aria-label="Panel 1 of 2: the team" style="flex: none; display: flex; gap: 6px">
<span style="width: 16px; height: 6px; border-radius: 3px; background: var(--accent)"></span>
<span style="width: 6px; height: 6px; border-radius: 3px; background: var(--line2)"></span>
</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const GLYPH = {
      tasks: 'M3 4.5l1.2 1.2L6.2 3.5M3 9.5l1.2 1.2l2-2.2M8.5 4.5h5M8.5 9.5h5M8.5 13h5',
      github: 'M5.6 4a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM5.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM13.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM4 5.6v4.8M12 10.4V7a2 2 0 0 0-2-2H8.5M9.8 3.4L8.2 5l1.6 1.6',
      cadencer: 'M13.6 8a5.6 5.6 0 1 1-11.2 0a5.6 5.6 0 0 1 11.2 0zM8 4.8V8l2.2 1.6',
    };
    const ring = 'var(--side)';
    const mark = (state) => {
      const solid = (bg, txt) => ({ bcls: '', btxt: txt, bdisp: 'grid', bbg: bg, bfg: 'var(--knock)', bbd: '0 solid transparent', btop: 'transparent', bsh: '0 0 0 2px ' + ring });
      if (state === 'active') return { bcls: 'spin', btxt: '', bdisp: 'grid', bbg: ring, bfg: 'transparent', bbd: '2px solid var(--accent)', btop: 'transparent', bsh: '0 0 0 1.5px ' + ring };
      if (state === 'asks') return solid('var(--warn)', '?');
      if (state === 'stalled') return solid('var(--warn)', '!');
      if (state === 'failed') return solid('var(--bad)', '×');
      if (state === 'done') return solid('var(--ok)', '✓');
      return solid('var(--text3)', 'II');
    };
    const FOLDER = 'M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z';
    const FILE = 'M4.5 2.5h4.5l3 3V13a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5zM9 2.5v3h3';
    // An agent row: [name, phase word, state, depth, kids, open, tail, needs-source note]
    const A = (name, status, state, depth, kids, open, age, ns = '') => {
      const warn = state === 'asks' || state === 'stalled';
      return Object.assign({
        agent: true, file: false,
        name, status, ns, age,
        agec: warn || /asks/.test(age) ? 'var(--warn)' : 'var(--text3)',
        pad: (depth * 14) + 'px',
        tw: kids ? 'visible' : 'hidden',
        fold: (open ? 'Fold ' : 'Unfold ') + name,
        rot: open ? 'rotate(0deg)' : 'rotate(-90deg)',
        w: depth === 0 ? 600 : 500,
        tile: 'var(--accent-weak)',
        filter: state === 'paused' ? 'grayscale(1) opacity(0.6)' : 'none',
        sc: warn ? 'var(--warn)' : 'var(--text3)',
      }, mark(state));
    };
    // A row under the agent at `depth`. With a `tag` it is an agent itself (a folder view or the files tool); without one it is plain disk.
    const P = (name, dir, depth, level, open, tag = '') => ({
      agent: false, file: true,
      name, tag,
      pad: (depth * 14 + 26 + level * 14) + 'px',
      guide: level > 0 ? 'linear-gradient(var(--line), var(--line)) no-repeat ' + (depth * 14 + 37) + 'px 0 / 1px 100%' : 'none',
      tw: dir ? 'visible' : 'hidden',
      exp: dir ? String(open) : 'false',
      rot: open ? 'rotate(0deg)' : 'rotate(-90deg)',
      d: dir ? FOLDER : FILE,
      fg: dir ? 'var(--text)' : 'var(--text2)',
      w: dir ? 500 : 400,
      tagd: tag ? 'block' : 'none',
      tsz: tag ? '24px' : '15px', tbg: tag ? 'var(--sunken)' : 'transparent',
    });
    const rows = [
      A('Lead', 'thinking', 'active', 0, true, true, ''),
      A('design', 'writing', 'active', 1, true, false, ''),
      A('cluster ops', 'using tools', 'active', 1, true, true, ''),
      A('k-rollout', 'asks you', 'asks', 2, true, true, '12m'),
      P('deploy/api', true, 2, 0, true, 'view'),
      P('api.yaml', false, 2, 1, false),
      P('rollout.log', false, 2, 1, false),
      A('k-scale', 'stalled', 'stalled', 2, false, true, '', 'stalled'),
      A('marketing', 'writing', 'active', 1, true, false, '1 asks'),
    ];
    const waiting = [
      { who: 'k-rollout', text: "Pod 3 can't pull api:2.4.0 in eu", age: '12m', ai: true, tool: false, d: '' },
      { who: 'm-ads', text: 'Budget is over the cap: raise it or pause?', age: '31m', ai: true, tool: false, d: '' },
    ];
    const toolIcons = [
      { d: GLYPH.tasks, ml: '0' },
      { d: GLYPH.github, ml: '-6px' },
      { d: GLYPH.cadencer, ml: '-6px' },
    ];
    // The files tool is always open, pinned under the tree; the whole project sits under it, folded.
    const pins = [
      P('files', true, 0, 0, true, 'tool'),
      P('launch-week', true, 0, 1, false, 'view'),
    ];
    return { theme, rows, pins, waiting, toolIcons };
  }
}
</script>
</body>
</html>
