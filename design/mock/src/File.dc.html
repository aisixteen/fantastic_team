<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"rail":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const rail = this.props.rail ?? true;
    const selected = 'deploy/api/api.yaml';
    const GLYPH = {
      tasks: 'M3 4.5l1.2 1.2L6.2 3.5M3 9.5l1.2 1.2l2-2.2M8.5 4.5h5M8.5 9.5h5M8.5 13h5',
      github: 'M5.6 4a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM5.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM13.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM4 5.6v4.8M12 10.4V7a2 2 0 0 0-2-2H8.5M9.8 3.4L8.2 5l1.6 1.6',
      cadencer: 'M13.6 8a5.6 5.6 0 1 1-11.2 0a5.6 5.6 0 0 1 11.2 0zM8 4.8V8l2.2 1.6',
    };
    // the outline round the agent's tile, one per state; Working's is a ray running round it
    const outline = (state) => {
      const c = { active: 'var(--accent)', asks: 'var(--warn)', stalled: 'var(--stall)', failed: 'var(--bad)', paused: 'var(--text3)', done: 'var(--ok)' }[state];
      if (!c) return { ocls: '', olc: 'transparent' };
      return { ocls: state === 'active' ? 'ol ray' : state === 'stalled' ? 'ol dash' : 'ol', olc: c };
    };
    const mark = (state, ring) => {
      const solid = (bg, txt) => ({ bcls: '', btxt: txt, bdisp: 'grid', bbg: bg, bfg: 'var(--knock)', bbd: '0 solid transparent', btop: 'transparent', bsh: '0 0 0 2px ' + ring });
      if (state === 'active') return { bcls: 'spin', btxt: '', bdisp: 'grid', bbg: ring, bfg: 'transparent', bbd: '2px solid var(--accent)', btop: 'transparent', bsh: '0 0 0 1.5px ' + ring };
      if (state === 'asks') return solid('var(--warn)', '?');
      if (state === 'stalled') return solid('var(--stall)', '!');
      if (state === 'failed') return solid('var(--bad)', '×');
      if (state === 'done') return solid('var(--ok)', '✓');
      if (state === 'paused') return solid('var(--text3)', 'II');
      return { bcls: '', btxt: '', bdisp: 'none', bbg: 'transparent', bfg: 'transparent', bbd: '0 solid transparent', btop: 'transparent', bsh: 'none' };
    };
    const FOLDER = 'M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z';
    const FILE = 'M4.5 2.5h4.5l3 3V13a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5zM9 2.5v3h3';
    // An agent row: [id, name, phase word, state, depth, kids, open, tail, tail is a warning, needs-source note]
    const A = (id, name, status, state, depth, kids, open, tail, hot, ns = '') => {
      const on = id === selected;
      const ring = 'var(--knock)';
      const warn = state === 'asks' || state === 'stalled';
      return Object.assign({
        agent: true, file: false,
        name, status, ns, age: tail,
        agec: hot ? 'var(--warn)' : 'var(--text3)',
        pad: (depth * 14) + 'px',
        bg: on ? 'var(--accent-weak)' : 'transparent',
        sel: on ? 'inset 0 0 0 1px var(--accent-line)' : 'none',
        tw: kids ? 'visible' : 'hidden',
        fold: (open ? 'Fold ' : 'Unfold ') + name,
        rot: open ? 'rotate(0deg)' : 'rotate(-90deg)',
        h: '40px',
        w: depth === 0 ? 600 : 500,
        tile: 'var(--accent-weak)',
        filter: state === 'paused' ? 'grayscale(1) opacity(0.6)' : 'none',
        sc: state === 'failed' ? 'var(--bad)' : state === 'stalled' ? 'var(--stall)' : warn ? 'var(--warn)' : 'var(--text3)',
      }, mark(state, ring), outline(state));
    };
    // A row under the agent at `depth`. With a `tag` it is an agent itself (a folder or file view, or the files tool) and gets the tool look; without one it is plain disk.
    const P = (path, name, dir, depth, level, open, tag = '') => {
      const on = path === selected;
      const pad = depth * 14 + 22 + level * 14;
      const line = depth * 14 + 31;
      return {
        agent: false, file: true,
        name, title: path,
        pad: pad + 'px',
        guide: level > 0 ? 'linear-gradient(var(--line), var(--line)) no-repeat ' + line + 'px 0 / 1px 100%' : 'none',
        tw: dir ? 'visible' : 'hidden',
        exp: dir ? String(open) : 'false',
        rot: open ? 'rotate(0deg)' : 'rotate(-90deg)',
        d: dir ? FOLDER : FILE,
        ic: on ? 'var(--accent)' : 'var(--text3)',
        fg: on ? 'var(--text)' : dir ? 'var(--text)' : 'var(--text2)',
        w: dir || on ? 500 : 400,
        tag, tagd: tag ? 'block' : 'none',
        tsz: tag ? '22px' : '14px', tbg: tag && !on ? 'var(--sunken)' : 'transparent',
        bg: on ? 'var(--accent-weak)' : 'transparent',
        sel: on ? 'inset 0 0 0 1px var(--accent-line)' : 'none',
      };
    };
    const FILE_OPEN = 'deploy/api/api.yaml';
    const opsOpen = selected !== 'tasks';
    const rows = [
      A('lead', 'Lead', 'thinking', 'active', 0, true, true, '', false),
      A('design', 'design', 'writing', 'active', 1, true, false, '', false),
      A('ops', 'cluster ops', 'using tools', 'active', 1, true, opsOpen, opsOpen ? '' : '1 asks', !opsOpen),
      ...(opsOpen ? [
      A('k-rollout', 'k-rollout', 'asks you', 'asks', 2, true, true, '12m', true),
      P('deploy/api', 'deploy/api', true, 2, 0, true, 'view'),
      // A file is a plain disk row until it is opened; then it is a file view, an agent.
      P(FILE_OPEN, 'api.yaml', false, 2, 1, false, selected === FILE_OPEN ? 'view' : ''),
      P('deploy/api/hpa.yaml', 'hpa.yaml', false, 2, 1, false),
      P('deploy/api/rollout.log', 'rollout.log', false, 2, 1, false),
      P('deploy/api/values-eu.yaml', 'values-eu.yaml', false, 2, 1, false),
      A('k-scale', 'k-scale', 'stalled', 'stalled', 2, true, false, '', false, 'stalled'),
      P('infra', 'infra', true, 1, 0, false, 'view'),
      ] : []),
      A('mkt', 'marketing', 'writing', 'active', 1, true, false, '1 asks', true),
    ];
    // The files tool is always open, pinned under the tree; the whole project sits under it, folded.
    const pins = [
      P('@files', 'files', true, 0, 0, true, 'tool'),
      P('.', 'launch-week', true, 0, 1, false, 'view'),
    ];
    const lines = ["apiVersion: apps/v1", "kind: Deployment", "metadata:", "  name: api", "  namespace: prod-eu", "  labels:", "    app: api", "spec:", "  replicas: 3", "  strategy:", "    type: RollingUpdate", "    rollingUpdate:", "      maxUnavailable: 0", "      maxSurge: 1", "  selector:", "    matchLabels:", "      app: api", "  template:", "    metadata:", "      labels:", "        app: api", "    spec:", "      containers:", "        - name: api", "          image: images.eu/api:2.4.0", "          ports:", "            - containerPort: 8080", "          readinessProbe:", "            httpGet:", "              path: /healthz", "              port: 8080", "            periodSeconds: 5"].map((t, i) => {
      const m = /^(\s*(?:- )?[A-Za-z]+:)(.*)$/.exec(t);
      return { n: i + 1, k: m ? m[1] : '', v: m ? m[2] : t, bg: 'transparent' };
    });
    const kernels = [
      ['LW', 'Launch', true, '3'],
      ['FD', 'fantastic', false, '!'],
      ['30', '3090 box', false, ''],
      ['H', 'Home', false, ''],
      ['R', 'Research', false, ''],
    ].map(([m, name, cur, badge]) => ({
      mark: m, name, badge,
      bdisp: badge ? 'grid' : 'none',
      fg: cur ? 'var(--on-accent)' : 'var(--text2)',
      bg: cur ? 'var(--accent)' : 'var(--sunken)',
      lab: cur ? 'var(--text)' : 'var(--text3)',
      w: cur ? 600 : 400,
    }));
    const waiting = [
      { who: 'k-rollout', text: "Pod 3 can't pull api:2.4.0 in eu", age: '12m', ai: true, tool: false, d: '', bg: 'var(--surface)' },
      { who: 'm-ads', text: 'Budget is over the cap: raise it or pause?', age: '31m', ai: true, tool: false, d: '', bg: 'transparent' },
    ];
    const toolIcons = [
      { d: GLYPH.tasks, ml: '0' },
      { d: GLYPH.github, ml: '-6px' },
      { d: GLYPH.cadencer, ml: '-6px' },
    ];
    return { theme, rail, rows, pins, kernels, waiting, toolIcons, lines, fileGlyph: FILE };
  }
}
</script>
