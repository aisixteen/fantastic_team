<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team: states and parts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
[data-theme]{--sans:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
[data-theme="light"]{--bg:#EDEDED;--page:radial-gradient(circle at 1px 1px,rgb(0 0 0/.14) 1px,transparent 1.6px) 0 0/22px 22px,radial-gradient(70% 55% at 12% -5%,#fff 0,transparent 70%),radial-gradient(55% 60% at 105% 105%,rgb(0 0 0/.16) 0,transparent 70%),#EDEDED;--panel:rgb(255 255 255/.58);--panel-flat:rgb(255 255 255/.72);--side:rgb(0 0 0/.03);--surface:rgb(255 255 255/.72);--sunken:rgb(0 0 0/.06);--hover:rgb(0 0 0/.09);--line:rgb(0 0 0/.10);--line2:rgb(0 0 0/.18);--text:#0B0B0B;--text2:#454545;--text3:#6B6B6B;--accent:#111111;--accent-weak:rgb(0 0 0/.08);--accent-line:rgb(0 0 0/.30);--on-accent:#FFFFFF;--ok:#1B7446;--warn:#8F5200;--bad:#B3261E;--knock:#F8F8F8;--head:rgb(0 0 0/.70);--chip:rgb(0 0 0/.05);--chip-line:rgb(0 0 0/.06);--ext:rgb(0 0 0/.12);--ext-line:rgb(0 0 0/.40);--bubble:rgb(255 255 255/.60);--bubble-user:rgb(0 0 0/.10);--code:rgb(0 0 0/.045);--well:rgb(0 0 0/.06);--input:rgb(0 0 0/.06);--shadow-bezel:0 10px 30px rgb(0 0 0/.10),0 1px 2px rgb(0 0 0/.06);--shadow-bubble:inset 0 0 0 1px rgb(0 0 0/.07)}
[data-theme="dark"]{--bg:#050505;--page:radial-gradient(circle at 1px 1px,rgb(255 255 255/.14) 1px,transparent 1.6px) 0 0/22px 22px,radial-gradient(70% 55% at 12% -5%,rgb(255 255 255/.20) 0,transparent 70%),radial-gradient(55% 60% at 105% 105%,rgb(255 255 255/.10) 0,transparent 70%),#050505;--panel:rgb(20 20 20/.58);--panel-flat:rgb(20 20 20/.74);--side:rgb(255 255 255/.03);--surface:rgb(255 255 255/.07);--sunken:rgb(255 255 255/.07);--hover:rgb(255 255 255/.10);--line:rgb(255 255 255/.10);--line2:rgb(255 255 255/.18);--text:#F2F2F2;--text2:#B8B8B8;--text3:#8E8E8E;--accent:#F5F5F5;--accent-weak:rgb(255 255 255/.10);--accent-line:rgb(255 255 255/.32);--on-accent:#0B0B0B;--ok:#72D6A2;--warn:#F0B75A;--bad:#FF9288;--knock:#0E0E0E;--head:rgb(255 255 255/.70);--chip:rgb(255 255 255/.05);--chip-line:rgb(255 255 255/.06);--ext:rgb(255 255 255/.14);--ext-line:rgb(255 255 255/.42);--bubble:rgb(255 255 255/.07);--bubble-user:rgb(255 255 255/.16);--code:rgb(0 0 0/.35);--well:rgb(0 0 0/.38);--input:rgb(255 255 255/.06);--shadow-bezel:0 10px 30px rgb(0 0 0/.45),0 1px 2px rgb(0 0 0/.30);--shadow-bubble:inset 0 1px 0 rgb(255 255 255/.10)}
[data-theme]{--ok-weak:color-mix(in srgb,var(--ok) 12%,transparent);--warn-weak:color-mix(in srgb,var(--warn) 12%,transparent);--warn-line:color-mix(in srgb,var(--warn) 45%,transparent);--bad-weak:color-mix(in srgb,var(--bad) 12%,transparent);--bad-line:color-mix(in srgb,var(--bad) 45%,transparent)}
.hov:hover{background:var(--hover) !important}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spin{animation:spin 1.1s linear infinite}
.ns{flex:none;display:inline-flex;align-items:center;gap:4px;padding:0 6px;border:1px dashed var(--ext-line);border-radius:6px;font:500 10px/16px var(--mono);color:var(--text2);white-space:nowrap}
.ns b{font-weight:700;color:var(--text)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</helmet>
<div data-theme="light" style="display: flex; flex-direction: column; gap: 26px; min-height: 844px; padding: 36px; background: var(--page); color: var(--text); font-family: var(--sans); font-size: 13px; line-height: 1.45">

<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font: 600 11px/1.4 var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--text3)">Agent state</h2>
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div data-theme="{{th.name}}" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(var(--panel), var(--panel)), var(--page); box-shadow: var(--shadow-bezel); color: var(--text)">
<sc-for list="{{states}}" as="s" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--accent-weak)">
<img src="/_blob/4391040ca996853236d2105e3388d1f7" alt="" style="width: 28px; height: auto; filter: {{s.filter}}">
<span class="{{s.bcls}}" style="position: absolute; right: -5px; bottom: -5px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font: 700 11px/1 var(--sans); color: {{s.bfg}}; background: {{s.bbg}}; border: {{s.bbd}}; border-top-color: transparent; box-shadow: 0 0 0 2px var(--knock)">{{s.btxt}}</span>
</span>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-weight: 600; color: {{s.lc}}">{{s.label}}</span>
<span style="font-size: 12px; color: var(--text2)">{{s.means}}</span>
</div>
<sc-if value="{{s.ns}}" hint-placeholder-val="{{false}}"><span class="ns" style="align-self: flex-start; padding: 2px 6px; white-space: normal; line-height: 1.35"><span><b>needs source:</b> {{s.ns}}</span></span></sc-if>
</div>
</sc-for>
</div>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 24px">

<section style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font: 600 11px/1.4 var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--text3)">Tree rows</h2>
<div style="display: flex; flex-direction: column; gap: 1px; padding: 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow-bezel)">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<div style="display: flex; align-items: center; padding-left: {{row.pad}}; border-radius: 8px; background: {{row.bg}}; box-shadow: {{row.sel}}">
<button type="button" class="hov" aria-label="{{row.fold}}" style="visibility: {{row.tw}}; flex: none; display: grid; place-items: center; width: 18px; height: 28px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--text3)"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="transform: {{row.rot}}"><path d="M2 3.5l3 3 3-3"></path></svg></button>
<button type="button" class="hov" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 8px 4px 4px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="position: relative; flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: {{row.tile}}">
<img src="/_blob/4391040ca996853236d2105e3388d1f7" alt="" style="width: 18px; height: auto; filter: {{row.filter}}">
<span class="{{row.bcls}}" style="position: absolute; right: -4px; bottom: -4px; display: grid; place-items: center; width: 13px; height: 13px; border-radius: 50%; font: 700 9px/1 var(--sans); color: {{row.bfg}}; background: {{row.bbg}}; border: {{row.bbd}}; border-top-color: transparent; box-shadow: 0 0 0 2px {{row.ring}}">{{row.btxt}}</span>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: {{row.w}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.name}}</span>
<span style="font-size: 12px; color: {{row.sc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{row.status}}</span>
</span>
<span style="flex: none; font: 500 11px/1 var(--mono); color: var(--warn)">{{row.age}}</span>
</button>
</div>
</sc-for>
<div style="display: flex; align-items: center; margin-left: 14px; border-radius: 8px">
<button type="button" class="hov" aria-label="Open view: cadencer" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 3px 8px 3px 6px; border: 0; border-radius: 8px; background: transparent; text-align: left">
<span style="flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--sunken); color: var(--text2)"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.6"></circle><path d="M8 4.8V8l2.2 1.6"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px"><span style="font-weight: 500">cadencer</span><span style="font: 10px/14px var(--mono); padding: 0 5px; border-radius: 4px; color: var(--text3); background: var(--sunken)">tool</span></span>
</button>
</div>
</div>
</section>

<section style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font: 600 11px/1.4 var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--text3)">Who is who</h2>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow-bezel)">
<div style="display: flex; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--accent-weak)"><img src="/_blob/4391040ca996853236d2105e3388d1f7" alt="" style="width: 28px; height: auto"></span>
<span style="font: 11px/1.3 var(--mono); color: var(--text2)">AI agent</span>
</div>
</div>
<div style="height: 1px; background: var(--line)"></div>
<div style="display: flex; gap: 12px">
<sc-for list="{{glyphs}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--sunken); color: var(--text2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.d}}"></path></svg></span>
<span style="font: 11px/1.3 var(--mono); color: var(--text2)">{{g.label}}</span>
</div>
</sc-for>
</div>
</div>
</section>

<section style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font: 600 11px/1.4 var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--text3)">An agent with no view: the name card</h2>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow-bezel)">
<div style="display: flex; align-items: center; gap: 14px">
<span style="flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--sunken); color: var(--text2)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5.6 4a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM5.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM13.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM4 5.6v4.8M12 10.4V7a2 2 0 0 0-2-2H8.5M9.8 3.4L8.2 5l1.6 1.6"></path></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<div style="font: 11px/1.4 var(--mono); color: var(--text3)">Lead</div>
<div style="display: flex; align-items: center; gap: 8px">
<h3 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">github</h3>
<span style="font: 11px/18px var(--mono); padding: 0 7px; border-radius: 6px; color: var(--text2); background: var(--sunken)">tool</span>
</div>
</div>
</div>
<div style="height: 1px; background: var(--line)"></div>
<p style="margin: 0; font-size: 12px; color: var(--text3)">This agent has no view of its own.</p>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const badge = (state) => {
      const solid = (bg, txt) => ({ bcls: '', btxt: txt, bbg: bg, bfg: 'var(--knock)', bbd: '0 solid transparent' });
      if (state === 'active') return { bcls: 'spin', btxt: '', bbg: 'var(--knock)', bfg: 'transparent', bbd: '2px solid var(--accent)' };
      if (state === 'asks') return solid('var(--warn)', '?');
      if (state === 'stalled') return solid('var(--warn)', '!');
      if (state === 'failed') return solid('var(--bad)', '×');
      if (state === 'done') return solid('var(--ok)', '✓');
      return solid('var(--text3)', 'II');
    };
    const states = [
      ['active', 'Working', 'A turn is running.', 'var(--text)', ''],
      ['asks', 'Asks you', 'Its last message is a question for you.', 'var(--warn)', ''],
      ['stalled', 'Stalled', 'No progress. It needs a look.', 'var(--warn)', 'a stalled flag per agent'],
      ['failed', 'Failed', 'The last turn ended in an error.', 'var(--bad)', 'the last outcome in status'],
      ['paused', 'Paused', 'A person paused it.', 'var(--text2)', 'paused in status'],
      ['done', 'Done', 'The last turn finished.', 'var(--ok)', 'the last outcome in status'],
    ].map(([state, label, means, lc, ns]) => Object.assign({
      label, means, lc, ns,
      filter: state === 'paused' ? 'grayscale(1) opacity(0.6)' : 'none',
    }, badge(state)));
    const themes = [{ name: 'light' }, { name: 'dark' }];
    const rows = [
      ['cluster ops', 'using tools', 'active', 0, true, true, '', false],
      ['k-rollout', 'asks you', 'asks', 1, false, true, '12m', true],
      ['marketing', 'writing', 'active', 0, true, false, '1 asks', false],
    ].map(([name, status, state, depth, kids, open, age, on]) => {
      const ring = 'var(--knock)';
      const b = badge(state);
      if (state === 'active') b.bbg = ring;
      return Object.assign({
        name, status, age, ring,
        pad: (depth * 14) + 'px',
        bg: on ? 'var(--accent-weak)' : 'transparent',
        sel: on ? 'inset 0 0 0 1px var(--accent-line)' : 'none',
        tw: kids ? 'visible' : 'hidden',
        fold: (open ? 'Fold ' : 'Unfold ') + name,
        rot: open ? 'rotate(0deg)' : 'rotate(-90deg)',
        w: depth === 0 ? 600 : 500,
        tile: 'var(--accent-weak)',
        filter: 'none',
        sc: state === 'asks' ? 'var(--warn)' : 'var(--text3)',
      }, b);
    });
    const glyphs = [
      { label: 'tasks', d: 'M3 4.5l1.2 1.2L6.2 3.5M3 9.5l1.2 1.2l2-2.2M8.5 4.5h5M8.5 9.5h5M8.5 13h5' },
      { label: 'github', d: 'M5.6 4a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM5.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM13.6 12a1.6 1.6 0 1 1-3.2 0a1.6 1.6 0 0 1 3.2 0zM4 5.6v4.8M12 10.4V7a2 2 0 0 0-2-2H8.5M9.8 3.4L8.2 5l1.6 1.6' },
      { label: 'cadencer', d: 'M13.6 8a5.6 5.6 0 1 1-11.2 0a5.6 5.6 0 0 1 11.2 0zM8 4.8V8l2.2 1.6' },
      { label: 'provider', d: 'M6 2.5v3M10 2.5v3M4.5 5.5h7v2.5a3.5 3.5 0 0 1-7 0zM8 11.5v2' },
    ];
    return { states, themes, rows, glyphs };
  }
}
</script>
</body>
</html>
