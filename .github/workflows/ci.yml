# CI, run by hand (#46): `gh workflow run ci.yml --ref <branch>`, or the Actions tab.
# Units by default (lint, test and tauri run in parallel); `-f os=all|linux|macos|windows` picks the OS set of every job of the run (default all); `-f e2e=true` adds release
# builds and the model-free e2e after every unit leg passed; `-f cleanup=true` also saves the
# build caches; run that on main after a Cargo.lock or toolchain change so branch runs restore warm
# caches from main. No automatic runs. No secrets: the tests use fake models and a fake forge.
# Cache keys: <OS>-<job>-<hash of Cargo.lock>, one per job (lint/test/tauri/release) so parallel jobs never race on one key; PR/branch runs only restore.
name: ci
run-name: ci · ${{ inputs.e2e && 'full' || 'units' }}

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Full run: release builds, the reproducible-build check and the model-free e2e (a finished milestone or a release)"
        type: boolean
        default: false
      strict:
        description: "With e2e: fail the repro job when the two builds differ (on by default; -f strict=false only warns)"
        type: boolean
        default: true
      os:
        description: "The OS set of every job of this run, units and (with e2e) builds, repro and e2e. all: Linux, macOS and Windows."
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
        default: all
      cleanup:
        description: "Save the build caches at the end of each job (cleanup work; off by default, runners are thrown away). Run it on main to refresh the caches."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Units, two parallel legs per OS (lint, test); every leg must pass before build/repro.
  lint:
    name: units · fmt+clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # the OS set of the whole run comes from the `os` input (a missing input counts as all)
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      # the toolchain is the pin in rust-toolchain.toml; rustup installs it (#137)
      - name: toolchain (rust-toolchain.toml)
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "pinned: $pin"
          rustup show
          # guard: the runner's rustc must be the pin (rustup reads rust-toolchain.toml)
          case "$(rustc -V)" in
            "rustc $pin "*) ;;
            *) echo "::error::rustc is $(rustc -V), not the pin $pin"; exit 1 ;;
          esac
      - uses: mozilla-actions/sccache-action@v0.0.9
      # fantastic's canvas page builds esbuild from pinned source with Go, and packs with zip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.4"
          cache: false
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # cleanup: save the finished cache (a restore-only run leaves it alone)
      - uses: actions/cache/save@v4
        if: inputs.cleanup == true && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}

  test:
    name: units · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # the OS set of the whole run comes from the `os` input (a missing input counts as all)
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      # the toolchain is the pin in rust-toolchain.toml; rustup installs it (#137)
      - name: toolchain (rust-toolchain.toml)
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "pinned: $pin"
          rustup show
          # guard: the runner's rustc must be the pin (rustup reads rust-toolchain.toml)
          case "$(rustc -V)" in
            "rustc $pin "*) ;;
            *) echo "::error::rustc is $(rustc -V), not the pin $pin"; exit 1 ;;
          esac
      - uses: mozilla-actions/sccache-action@v0.0.9
      # fantastic's canvas page builds esbuild from pinned source with Go, and packs with zip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.4"
          cache: false
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
      - name: test
        run: cargo test --workspace
      - name: shell tests
        if: runner.os != 'Windows'
        run: |
          sh tests/new_task.sh
          sh tests/repro_scripts.sh
      # cleanup: save the finished cache (a restore-only run leaves it alone)
      - uses: actions/cache/save@v4
        if: inputs.cleanup == true && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}

  # The Tauri window crate builds with its off-by-default feature (#37). No secrets, no signing.
  tauri:
    name: tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "pinned: $pin"
          rustup show
          # guard: the runner's rustc must be the pin (rustup reads rust-toolchain.toml)
          case "$(rustc -V)" in
            "rustc $pin "*) ;;
            *) echo "::error::rustc is $(rustc -V), not the pin $pin"; exit 1 ;;
          esac
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.4"
          cache: false
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - name: webview libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev build-essential
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tauri-${{ hashFiles('**/Cargo.lock') }}
      - name: build the app with the Tauri window
        run: cargo build -p fantastic-team-app --features tauri
      # cleanup: save the finished cache (a restore-only run leaves it alone)
      - uses: actions/cache/save@v4
        if: inputs.cleanup == true && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tauri-${{ hashFiles('**/Cargo.lock') }}

  build:
    name: build (${{ matrix.os }})
    if: inputs.e2e == true
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "pinned: $pin"
          rustup show
          # guard: the runner's rustc must be the pin (rustup reads rust-toolchain.toml)
          case "$(rustc -V)" in
            "rustc $pin "*) ;;
            *) echo "::error::rustc is $(rustc -V), not the pin $pin"; exit 1 ;;
          esac
      - uses: mozilla-actions/sccache-action@v0.0.9
      # fantastic's canvas page builds esbuild from pinned source with Go, and packs with zip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.4"
          cache: false
      - name: zip (the canvas packer's; not on the Windows image)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
      - name: release build (general)
        run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fantastic_team-${{ matrix.os }}
          path: target/release/fantastic_team${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

      # cleanup: save the finished cache (a restore-only run leaves it alone)
      - uses: actions/cache/save@v4
        if: inputs.cleanup == true && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

  # Reproducible builds (#137): two builds of the same commit, in two folders and two target
  # dirs, must give the same SHA256SUMS. Runs with e2e. The canvas zip is now deterministic
  # (fantastic #409), so a difference fails the job unless strict=false.
  repro:
    name: repro (${{ matrix.os }})
    if: inputs.e2e == true && inputs.os != 'windows'
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # repro has no Windows leg: os=windows skips the job (the matrix then only needs to be non-empty)
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || inputs.os == 'windows' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    env:
      STRICT: ${{ inputs.strict }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (rust-toolchain.toml)
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "pinned: $pin"
          rustup show
          # guard: the runner's rustc must be the pin (rustup reads rust-toolchain.toml)
          case "$(rustc -V)" in
            "rustc $pin "*) ;;
            *) echo "::error::rustc is $(rustc -V), not the pin $pin"; exit 1 ;;
          esac
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.4"
          cache: false
      - name: two trees at the same commit, made at different times
        run: |
          set -eu
          HEAD_SHA=$(git rev-parse HEAD)
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          git worktree add --detach "$RUNNER_TEMP/a/src" "$HEAD_SHA"
          sleep 2
          git worktree add --detach "$RUNNER_TEMP/b/src" "$HEAD_SHA"
      - name: build twice (two target dirs)
        run: |
          set -eu
          for side in a b; do
            cd "$RUNNER_TEMP/$side/src"
            CARGO_TARGET_DIR="$RUNNER_TEMP/$side/target" sh scripts/build.sh | tee "$RUNNER_TEMP/$side/build.log"
          done
      - name: checksum both sets and compare
        run: |
          set -eu
          for side in a b; do
            OUT="$RUNNER_TEMP/out-$side"
            mkdir -p "$OUT"
            sed -n 's/^built: //p' "$RUNNER_TEMP/$side/build.log" | while IFS= read -r built; do
              cp "$built" "$OUT/"
            done
            (cd "$RUNNER_TEMP/$side/src" && sh scripts/checksums.sh "$OUT")
          done
          if diff -u "$RUNNER_TEMP/out-a/SHA256SUMS" "$RUNNER_TEMP/out-b/SHA256SUMS"; then
            echo "reproducible: both builds give the same SHA256SUMS"
          elif [ "$STRICT" = "true" ]; then
            echo "::error::the two builds differ (strict is on)"
            exit 1
          else
            echo "::warning::the two builds differ; strict is off, so the job passes (docs/install.md, Reproducible builds)"
          fi
      - name: upload the checksums (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: repro-checksums-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/out-a/SHA256SUMS
            ${{ runner.temp }}/out-a/MD5SUMS
            ${{ runner.temp }}/out-a/RELEASE-INFO.txt
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.os }})
    if: inputs.e2e == true
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || inputs.os == 'macos' && '["macos-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fantastic_team-${{ matrix.os }}
          path: bin
      - name: scripted e2e tests
        if: runner.os != 'Windows'
        run: |
          chmod +x bin/fantastic_team
          python3 e2e/run.py --only-free --bin bin/fantastic_team
