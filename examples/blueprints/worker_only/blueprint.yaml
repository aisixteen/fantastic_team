# One AI worker, as a fantastic blueprint folder. Import it under the home's `user` agent:
#
#   fantastic_team --headless &
#   fantastic_team import examples/blueprints/worker_only --parent user \
#     --bind @memory=memory --bind @credentials=credentials --approve
#
# then give it work with `fantastic_team send` (`{"target": "<id>", "payload":
# {"type": "send", "text": "..."}}`; the reply of the import names the fresh id). The model,
# endpoint, prices and grants are the record's own fields: edit them with `update_agent`.
ports:
  "@memory":
    kind: memory
  "@credentials":
    kind: credentials
agents:
  - id: w1
    handler_module: anthropic_backend.tools
    model: example-model
    endpoint: https://api.example.com/v1/messages
    credentials:
      store: "@credentials"
      ref: EXAMPLE_KEY
    price_input_per_mtok: 1.0
    price_output_per_mtok: 5.0
    memory_store_id: "@memory"
    can_call:
      "$self": "*"
      "@memory": "*"
    callable_by:
      "$self": "*"
      "$parent": "*"
