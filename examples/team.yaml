# A team's setup as one preset (docs/team-yaml.md): copy it to `team.yaml` in a NEW team folder.
# Seeding a fresh team folder writes these records; a folder that was started
# before keeps the records it has. The same two-repo setup the battle runs use.
#
# Keys are never written here: a credential names the environment variables the credential store
# reads (`backend: env`). Export FANT_AK, FANT_GH_APP_ID and FANT_GH_APP_KEY (the PEM text) in the
# team's environment.
credentials:
  anthropic/api.anthropic.com:
    host: api.anthropic.com
    env: {api_key: FANT_AK}
  github/app:
    host: api.github.com
    env: {app_id: FANT_GH_APP_ID, private_key: FANT_GH_APP_KEY}

provider:                      # the anthropic_backend agent, under the lead
  endpoint: https://api.anthropic.com/v1/messages
  caching: provider_cache      # the only mode a preset accepts
  models: [claude-sonnet-5-5, claude-haiku-5-5]
  context_window: 200000
  credentials: anthropic/api.anthropic.com

connectors:                    # a git and a github agent per repo; the first are `git` and `github`
  - repo: aisixteen/fantastic
    clone: repos/fantastic     # the local clone: a folder inside the team folder
    app: github/app
    author: {name: "aisixteen-fantastic-team[bot]", email: "346380847+aisixteen-fantastic-team[bot]@users.noreply.github.com"}
  - repo: aisixteen/fantastic_team   # ids git_fantastic_team and github_fantastic_team
    clone: repos/fantastic_team
    app: github/app
    author: {name: "aisixteen-fantastic-team[bot]", email: "346380847+aisixteen-fantastic-team[bot]@users.noreply.github.com"}
    # directive: ...           # optional; the default pushes a work branch and opens a draft PR only

worktrees: wt                  # the worktree root, inside the team folder; the workers' files and exec are rooted here

roles:
  limits: {total: 10, per_role: {lead: 2, worker: 8}}

lead:
  model: claude-sonnet-5-5     # on the provider above
