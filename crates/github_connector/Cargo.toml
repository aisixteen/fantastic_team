[package]
name = "shift-github-connector"
description = "The github connector agent: a GitHub App bound by configuration — push via the git connector, draft pull requests, issues, comments, labels, PR status."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "shift_github_connector"
path = "src/lib.rs"

[dependencies]
fantastic-kernel.workspace = true
fantastic-ai-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
shift-git-connector = { path = "../git_connector" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "=9.3.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
fantastic-credential-store.workspace = true
fantastic-ram-store.workspace = true
tempfile.workspace = true
base64.workspace = true
wiremock = "=0.6.5"
rsa = "0.9.10"
rand = "0.8.5"
