# THE TEAM'S FIXED AGENTS, with the ids the bundle cards and the page name, their config and
# their grants. Compiled into the binary (like fantastic's own `src/tui/blueprint.yaml`) and
# written ONCE, at the first run: `fantastic_tui::seed_dir_with` writes it after fantastic's
# stock tree, ids as written. Disk position is the parent (nesting under `agents:`); no
# entry carries `parent_id`. `user` is a PARENT entry (only `id` and `agents`): the stock
# blueprint wrote it, so the team goes beneath it. `@root` in a grant names the kernel's
# root. Every later run rehydrates from disk (the fs loader is the root loader) and never
# reads this file again, exactly as for fantastic's own: editing it does not touch a folder
# that already has its `.fantastic`. Nothing in the team's code creates, updates or grants
# these agents at a boot.
#
# ONE PLACEHOLDER is filled by the first run: `@work` is the team folder's work dir (an
# absolute path, not the same on every machine). The worker's exec record (`cwd`,
# `inherit_env`, `env`) is added from `worker_exec_record` for the same reason (its HOME is
# an absolute path); `allowed` is the entry's own value, any command, as in fantastic's
# blueprint, and the user can change it. `web`
# carries no `port`: the port is the run's (`--port`, the recorded one) and is set on the
# host by fantastic's boot (`--headless --port N`).
#
#   <root>
#   +-- user                 (stock; parent entry)
#   |   +-- lead             the main lead (the `lead` bundle), the agent the person chats with
#   |       +-- github         the GitHub connector
#   |       +-- github_credentials  the connector's GitHub credential (GH_TOKEN, env ref)
#   |       +-- bundles          the bundles registry
#   |       +-- worker_exec    the worker's restricted exec
#   |       +-- worker_files   the worker's file bridge on the work folder
#   +-- web                  the web host
#       +-- team_page          the team page
#       +-- team_ws            the page's socket leg
#
# The other end of the lead's edges on the stock agents the team reaches (`memory`, `files`,
# `credentials`, the root) is written by fantastic's own boot: `reach::grant_all` (fantastic
# `src/tui/src/kern/reach.rs`) names every AI agent (a record that names a `memory_store_id`:
# the lead and every spawned worker) in each agent's `callable_by`. The other end of the edges
# of the team's non-AI agents on a stock agent is declared by a PARENT entry at the end of
# this file (fantastic#500: `callable_by` / `can_call` on an entry that names a stock agent,
# unioned into its record; `@root` for the root; the credential store, which fantastic makes
# only when a key mode is chosen, takes the grant when it is made).
#
agents:
- id: user
  callable_by:
    team_ws:
    - inquiries
    - answer_inquiry
  agents:
  - id: lead
    # the lead is an AI chat (the `lead` bundle, base `ai_chat.tools`). It names no provider: the
    # binary knows none. The user adds a provider agent (its record in the team's yaml, or
    # `create_agent`) and sets the lead's `provider_id` (and `model`, or the provider's
    # default); until then a turn is refused naming `provider_id`. Every chat the lead spawns
    # takes its provider unless the spawn names another, on the model the spawn names.
    handler_module: lead
    caching: provider_cache
    context_window: 1000000
    memory_store_id: memory
    file_bridge_id: files
    can_call:
      $self: '*'
      $subtree: '*'
      memory: '*'
      credentials: '*'
      files:
      - read
      - read_stream
      - watch_path
      - unwatch_path
      - watch
      '@root':
      - await_set
      - await_cancel
      - create_agent
      - delete_agent
      bundles:
      - bundles
      - bundle
      - spawn
      - get_count
      - fleet
      canvas_page:
      - new_canvas
    callable_by:
      $self: '*'
      $parent: '*'
      $subtree:
      - send
    agents:
    - id: github
      handler_module: team_github.tools
      app:
        credentials:
          store: github_credentials
          ref: github
      repos:
      - owner/name
      directive: Push a work branch and open a draft pull request. Never the default branch, never a force,
        never a merge.
      can_call:
        $self: '*'
        credentials: '*'
        github_credentials:
        - get
      callable_by:
        $self: '*'
        $parent: '*'
    - id: github_credentials
      # the github connector's credential by env ref (#303): a personal token read from GH_TOKEN
      # at each call, no value at rest. GH_TOKEN unset = the connector works local only. An
      # own GitHub App is set on this record (env: {app_id: VAR, private_key: VAR}).
      handler_module: credential_store.tools
      backend: env
      refs:
        github:
          host: api.github.com
          env:
            token: GH_TOKEN
      callable_by:
        $self: '*'
        github:
        - get
    - id: bundles
      handler_module: agentic_resources.tools
      can_call:
        $self: '*'
        memory: '*'
      callable_by:
        $self: '*'
        $parent: '*'
        lead:
        - bundles
        - bundle
        - spawn
        - get_count
        - fleet
    - id: worker_exec
      handler_module: exec_bridge.tools
      allowed: [".*"]
      ingress_rule: allow_all_ingress
      callable_by:
        $self: '*'
        $parent: '*'
    - id: worker_files
      handler_module: file_bridge.tools
      root: '@work'
      allow:
      - .
      ingress_rule: allow_all_ingress
      callable_by:
        $self: '*'
        $parent: '*'
# THE WEB HOST. `web` mounts the leg by asking it for its routes, and serves the page by
# reading `read_stream` as itself: both ends of both edges. The leg is the page's one
# principal: it may call the dispatcher's page verbs, and the verbs the page sends to the
# other tool agents (the cadencer toggle, the user's inquiry panel) of
# the agents that the person or the cards make; the other end of each of those is on the
# agent it names (its own `callable_by`, written where it is made).
- id: web
  handler_module: web.tools
  can_call:
    $self: '*'
    team_page:
    - read_stream
    team_ws:
    - get_routes
  agents:
  - id: team_page
    handler_module: team_page.tools
    verbs:
      read_stream: '@read_stream'
    callable_by:
      $self: '*'
      web:
      - read_stream
  - id: team_ws
    handler_module: web_ws.tools
    ingress_rule: allow_all_ingress
    can_call:
      $self: '*'
      dispatcher:
      - sidebar
      - tree
      - open
      - control
      cadencer:
      - status
      - set
      user:
      - inquiries
      - answer_inquiry
    callable_by:
      $self: '*'
      web:
      - get_routes
# THE CALLEE END of the edges the team's agents hold on fantastic's stock agents (the caller's
# end is each agent's `can_call` above; the page leg's end on `user` is on the `user` entry at the
# top, which also carries `agents:`). Parent entries (`id` and grants only): the stock
# grants stay, these are unioned in.
- id: memory
  callable_by:
    bundles: '*'
- id: credentials
  callable_by:
    github: '*'
