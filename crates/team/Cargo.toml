[package]
name = "fantastic-team"
description = "AISixteen Fantastic Team: unattended team work on fantastic — the program."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fantastic_team"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
fantastic-tui.workspace = true
fantastic-kernel.workspace = true
fantastic-ai-core.workspace = true
team-agentic-resources = { path = "../agentic_resources" }
team-task-registry = { path = "../task_registry" }
fantastic-exec-bridge.workspace = true
fantastic-web.workspace = true
fantastic-web-ws.workspace = true
team-git-connector = { path = "../git_connector" }
team-github-connector = { path = "../github_connector" }
tokio.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
wiremock = "=0.6.5"
