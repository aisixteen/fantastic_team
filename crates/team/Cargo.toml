[package]
name = "fantastic-team"
description = "AISixteen Fantastic Team: unattended team work on fantastic — the program."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fantastic_team"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
fantastic-kernel.workspace = true
fantastic-host.workspace = true
fantastic-bundle.workspace = true
team-git-connector = { path = "../git_connector" }
