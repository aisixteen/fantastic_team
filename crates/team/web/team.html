<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg">
<title>Team</title>
<style>
  /* No colour, font or radius is written here: the base's view skins (--fc-color-*, --fc-font-family-*,
     --fc-radius-*, --fc-shadow-*), light and dark by the viewer's colour scheme, are served ahead of this
     sheet as page.css; the views this page mounts get the same skin from it (fantastic issue 698). */
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--fc-color-page-bg); }
  body { margin: 0; min-height: 100vh; background: transparent; color: var(--fc-color-text-primary); font: 13px/1.45 var(--fc-font-family-sans); -webkit-font-smoothing: antialiased; }

  /* Two cells side by side; when they no longer fit (a phone) they stack into one column. */
  #layout { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; padding: 12px; min-height: 100vh; }
  .cell { min-width: 0; min-height: calc(100vh - 24px); display: flex; flex-direction: column; padding: 0 6px 6px; border: 1px solid var(--fc-color-line-button); border-radius: 16px; background: var(--fc-color-surface-raised); box-shadow: var(--fc-shadow-bubble); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #col-left { flex: 1 1 376px; }
  #col-right { flex: 999 1 560px; }
  /* the tree hidden (the title bar's button): the right cell takes the page; its title bar shows the tree again */
  #layout[data-tree="hidden"] #col-left { display: none; }
  .tb { flex: none; display: grid; place-items: center; width: 20px; height: 20px; margin-left: 6px; padding: 0; border: 0; border-radius: var(--fc-radius-chip); background: var(--fc-color-surface-button); box-shadow: inset 0 0 0 1px var(--fc-color-line-faint); color: var(--fc-color-text-muted); cursor: pointer; }
  .tb:hover { background: var(--fc-color-surface-hover); }
  .tb:focus-visible { outline: 2px solid var(--fc-color-accent-base); outline-offset: 2px; }
  #show { display: none; margin: 0 8px 0 0; }
  #layout[data-tree="hidden"] #show { display: grid; }
  .head { flex: none; display: flex; align-items: center; height: 32px; padding: 0 6px; font: 600 11px/1 var(--fc-font-family-mono); letter-spacing: .5px; text-transform: uppercase; color: var(--fc-color-text-muted); }
  .body { flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; }
  /* The base sidebar view fills the left cell; the opened agent's view fills the right one. */
  .body { position: relative; }
  .body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  .opened { padding: 12px; font: 13px/1.45 var(--fc-font-family-sans); }
  /* the name card of an agent with no view: its glyph, its parent's name over its own, the tool tag, a note */
  .card { display: grid; grid-template-columns: 44px auto 1fr; grid-template-areas: "gl up up" "gl name tag" "note note note"; align-items: center; gap: 0 10px; max-width: 420px; margin: 16px; padding: 18px 20px; border: 1px solid var(--fc-color-line-button); border-radius: 12px; background: var(--fc-color-surface-raised); }
  .card .gl { grid-area: gl; display: grid; place-items: center; width: 44px; height: 44px; margin-right: 4px; border-radius: var(--fc-radius-panel); background: var(--fc-color-surface-well); color: var(--fc-color-text-muted); }
  .card .up { grid-area: up; align-self: end; font-size: 12px; color: var(--fc-color-text-muted); }
  .card .name { grid-area: name; font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--fc-color-text-primary); overflow-wrap: anywhere; }
  .card .tag { grid-area: tag; justify-self: start; padding: 0 7px; border-radius: var(--fc-radius-chip); background: var(--fc-color-surface-button); box-shadow: inset 0 0 0 1px var(--fc-color-line-faint); font: 11px/18px var(--fc-font-family-mono); color: var(--fc-color-text-muted); }
  .card .note { grid-area: note; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--fc-color-line-button); color: var(--fc-color-text-muted); }
  .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title .sep { opacity: .55; }
  .title .dim { opacity: .55; }
  .dots { display: none; flex: none; align-items: center; justify-content: center; min-height: 34px; padding: 4px 12px 14px; border-top: 1px solid var(--fc-color-line-button); background: var(--fc-color-surface-well); }
  .dots span { display: flex; gap: 6px; }
  .dots i { display: block; width: 6px; height: 6px; border-radius: 3px; background: var(--fc-color-line-strong); }
  .dots i.on { width: 16px; background: var(--fc-color-accent-base); }
  .back { position: relative; display: none; flex: none; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--fc-color-text-muted); cursor: pointer; }
  .back .badge { position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--fc-radius-pill); background: var(--fc-color-accent-base); color: var(--fc-color-accent-on); font: 600 10px/16px var(--fc-font-family-mono); text-align: center; }
  .back .badge[hidden] { display: none; }
  .back:hover { background: var(--fc-color-surface-hover); }
  .back:focus-visible { outline: 2px solid var(--fc-color-accent-base); outline-offset: 2px; }
  @media (max-width: 972px) {
    .cell { min-height: 320px; }
  }
  /* A phone: one column, one panel at a time. The tree is the first panel; picking an agent shows
     its view, and the back button returns to the tree. */
  @media (max-width: 760px) {
    #layout { display: block; padding: 0; min-height: 100vh; }
    .cell { min-height: 100vh; height: 100vh; padding: 0; border: 0; border-radius: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    @supports (height: 100dvh) { .cell { min-height: 100dvh; height: 100dvh; } }
    .body { border-radius: 0; }
    .dots { display: flex; }
    #layout[data-panel="tree"] #col-right, #layout[data-panel="agent"] #col-left { display: none; }
    #col-right .head { display: flex; padding: 8px 12px 10px 6px; height: auto; border-bottom: 1px solid var(--fc-color-line-button); }
    .back { display: grid; }
    .tb, #layout[data-tree="hidden"] #show { display: none; }
    #layout[data-tree="hidden"][data-panel="tree"] #col-left { display: flex; }
  }
  /* a phone's tree panel: the sidebar view draws its own head there (the kernel's name and its marks) */
  @media (max-width: 520px) and (pointer: coarse) {
    #col-left .head { display: none; }
  }
</style>
</head>
<body>
<div id="layout" data-panel="tree">
  <section id="col-left" class="cell" aria-label="Agents">
    <div class="head"><span class="title" id="title"><span>team</span></span><button type="button" class="tb" id="hide" aria-label="Hide the tree" title="Hide the tree"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"></rect><path d="M6 3v10"></path></svg></button></div>
    <div class="body" id="body-left"></div>
    <div class="dots"><span role="img" aria-label="Panel 1 of 2: the team"><i class="on"></i><i></i></span></div>
  </section>
  <section id="col-right" class="cell" aria-label="View">
    <div class="head"><button type="button" class="back" id="back" aria-label="Back to the team"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg><span class="badge" id="back-badge" hidden></span></button><button type="button" class="tb" id="show" aria-label="Show the tree" title="Show the tree"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"></rect><path d="M6 3v10"></path></svg></button><span class="title" id="crumb"></span></div>
    <div class="body" id="body-right"></div>
    <div class="dots"><span role="img" aria-label="Panel 2 of 2: the agent"><i></i><i class="on"></i></span></div>
  </section>
</div>
<script>
  // THE LEFT CELL is the base's sidebar view (the agent `sidebar`, its `reflect`), the one tree the
  // canvas draws too. The relay that runs a view in a sandboxed iframe is the base's one module
  // (`view_relay.js`, served beside this page): the view reaches the team ONLY through it, gated by the
  // view's own `calls` (the leg's grants are the second gate). A click on an agent row opens it in the
  // right cell. Nothing from the kernel is put in as markup: the view is a srcdoc, the rest text.
  (function () {
    var SIDEBAR = 'sidebar', CELL = 'view_sidebar';
    // pure
    // The agents, other than `except`, with an open inquiry for the person (the data the sidebar's
    // "Waiting for you" lists: `user` `inquiries`, one row per open inquiry, each with its `asker`).
    function waitingCount(inq, except) {
      var askers = {};
      (Array.isArray(inq) ? inq : []).forEach(function (q) {
        if (q && typeof q.asker === 'string' && q.asker !== except) askers[q.asker] = true;
      });
      return Object.keys(askers).length;
    }
    // A question to the person opened or closed: the sidebar agent follows the kernel and publishes
    // `{type: 'inquiries_changed', open}` on its own id (`open` how many are open now). A watcher of
    // `sidebar` also gets a COPY of every call made to it (the sidebar view's `reflect`): only the
    // event carries a numeric `open`, and only the event counts.
    function inquiryEvent(ev) {
      return !!ev && typeof ev === 'object' && ev.type === 'inquiries_changed' && typeof ev.open === 'number';
    }
    // What the name card of an agent with no view of its own says, from its reflect; `up` is its parent's name.
    function cardOf(id, r, bundle, up) {
      var name = r && typeof r.display_name === 'string' && r.display_name ? r.display_name : id;
      var tag = r && typeof r.handler_module === 'string' ? r.handler_module : (typeof bundle === 'string' ? bundle : '');
      return { name: name, up: typeof up === 'string' ? up : '', tag: tag, note: 'This agent has no view of its own.' };
    }
    // The path to agent `id` in the kernel's tree (`reflect detail:full`'s `tree`): its ancestors below the
    // root, outermost first, then the agent, each {id, name}; [] when the tree does not hold it.
    function pathTo(tree, id) {
      function walk(n, up) {
        if (!n || typeof n.id !== 'string') return null;
        var here = up.concat([{ id: n.id, name: typeof n.display_name === 'string' && n.display_name ? n.display_name : n.id }]);
        if (n.id === id) return here;
        var kids = Array.isArray(n.children) ? n.children : [];
        for (var i = 0; i < kids.length; i++) { var p = walk(kids[i], here); if (p) return p; }
        return null;
      }
      var p = walk(tree, []);
      return p ? p.slice(1) : [];
    }
    // The title bar's breadcrumb for an agent: the AI agents above it (`chats` {id: true}), then its name.
    function crumbPath(path, chats) {
      return (Array.isArray(path) ? path : []).filter(function (n, i, all) { return i === all.length - 1 || !!(chats && chats[n.id]); })
        .map(function (n) { return n.name; });
    }
    // The path of names, outermost first: `chain` is [{name}], blanks dropped.
    function crumbOf(chain) {
      return (Array.isArray(chain) ? chain : []).map(function (c) { return c && typeof c.name === 'string' ? c.name : ''; })
        .filter(function (n) { return n !== ''; });
    }
    // end pure
    document.documentElement.setAttribute('data-ready', '1');
    // the views draw no title row of their own where this page's title bar already says it (the base views' contract)
    var HOST_HEAD = "document.documentElement.setAttribute('data-host-head', '');";

    // THE SKIN (fantastic#698): light or dark by the viewer's colour scheme (the page's own sheet
    // follows the same media query). Every view mounted here gets the skin's token block, and the new
    // one when the scheme changes; `VIEW_SKINS` is the base's blocks, put ahead of this script.
    var scheme = window.matchMedia('(prefers-color-scheme: dark)');
    function skinNow() { return VIEW_SKINS[scheme.matches ? 'dark' : 'light']; }
    var shownViews = [];
    function mountSkinned(relay, opts) {
      opts.skin = skinNow();
      var v = relay.mountView(opts), unmount = v.unmount;
      shownViews.push(v);
      v.unmount = function () { shownViews = shownViews.filter(function (x) { return x !== v; }); unmount(); };
      return v;
    }
    scheme.addEventListener('change', function () {
      var css = skinNow();
      shownViews.forEach(function (v) { v.skin(css); });
    });

    // The page's end of the relay: sends and watches go over the leg (shim.js).
    var transport = {
      send: function (target, payload) { return window.fantastic.send(target, payload); },
      watch: function (src, deliver) { return { off: window.fantastic.watch(src, deliver) }; }
    };
    var right = document.getElementById('body-right');
    var left = document.getElementById('body-left');
    var layout = document.getElementById('layout');

    // The panel a phone shows: the tree, or the opened agent. A wide page shows both and ignores it.
    function panel(which) { layout.setAttribute('data-panel', which); }
    document.getElementById('back').addEventListener('click', function () { panel('tree'); });
    // The tree hidden and shown again (the title bar's buttons; the sidebar's own `hide_tree` too).
    function tree(shown) { if (shown) layout.removeAttribute('data-tree'); else layout.setAttribute('data-tree', 'hidden'); }
    document.getElementById('hide').addEventListener('click', function () { tree(false); });
    document.getElementById('show').addEventListener('click', function () { tree(true); });

    // The back button's badge: how many other agents wait for the person (`user` `inquiries`, read as
    // the page leg). Asked when an agent opens, then again on each `inquiries_changed` the sidebar agent
    // publishes (the one agent the page watches; never on a copy of a call, never on a clock); a refusal
    // leaves it hidden.
    // One read at a time: an event that lands while a read is out reads once more when it is back.
    var badge = document.getElementById('back-badge');
    var waiting = { except: '', busy: false, again: false };
    function showWaiting(except) {
      waiting.except = except;
      if (waiting.busy) { waiting.again = true; return; }
      waiting.busy = true; waiting.again = false;
      var done = function () { waiting.busy = false; if (waiting.again) showWaiting(waiting.except); };
      window.fantastic.send('user', { type: 'inquiries' }).then(function (r) {
        var n = waitingCount(r && r.inquiries, waiting.except);
        badge.textContent = String(n);
        badge.hidden = n === 0;
        document.getElementById('back').setAttribute('aria-label',
          n === 0 ? 'Back to the team' : 'Back to the team, ' + n + ' waiting for you');
      }, function () { badge.hidden = true; }).then(done, done);
    }
    window.fantastic.watch(SIDEBAR, function (ev) {
      if (inquiryEvent(ev)) showWaiting(waiting.except);
    });

    // The title bar: the product word and the kernel's own name (the root's display_name).
    window.fantastic.send('kernel', { type: 'reflect' }).then(function (r) {
      var n = r && (r.display_name || r.id);
      if (typeof n !== 'string' || !n) return;
      var t = document.getElementById('title');
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = ' / ';
      t.appendChild(sep);
      t.appendChild(document.createTextNode(n));
    }, function () { /* the leg may not reflect the root: the title stays "team" */ });

    function viewOf(r) {
      var v = r && r.view;
      return v && v.kind === 'html' && typeof v.bytes === 'string' ? v : null;
    }

    // What the right cell draws for `r`, the reply of an agent's `reflect`: its html view, or the name card
    // of an agent with none.
    var TOOL = '<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3a3 3 0 0 0 3.2 3.9L6 13.6a1.4 1.4 0 0 1-2-2l6.7-6.7A3 3 0 0 0 9.5 3z"/></svg>';
    function draw(relay, id, r, bundle, up) {
      var v = viewOf(r);
      right.textContent = '';
      if (!v) {
        var c = cardOf(id, r, bundle, up), card = document.createElement('div');
        card.className = 'opened card';
        var gl = document.createElement('span');
        gl.className = 'gl';
        gl.innerHTML = TOOL; // a fixed glyph of this page, never kernel text
        card.appendChild(gl);
        if (c.up) { var u = document.createElement('span'); u.className = 'up'; u.textContent = c.up; card.appendChild(u); }
        [['name', c.name], ['tag', c.tag], ['note', c.note]].forEach(function (p) {
          if (!p[1]) return;
          var e = document.createElement('div');
          e.className = p[0];
          e.textContent = p[1];
          card.appendChild(e);
        });
        right.appendChild(card);
        return null;
      }
      return mountSkinned(relay, { mount: right, html: v.bytes, transport: transport, calls: v.calls || {}, cell: 'view_' + id, extra: HOST_HEAD });
    }

    // The kernel's tree and its AI agents, read once per opened agent (the title bar's path, the card's parent).
    function treeNow() {
      return Promise.all([
        window.fantastic.send('kernel', { type: 'reflect', detail: 'full' }).catch(function () { return null; }),
        window.fantastic.send('kernel', { type: 'reflect', handler_modules: ['ai_chat.tools'], tree: 'ids' }).catch(function () { return null; })
      ]).then(function (rs) {
        var chats = {};
        (rs[1] && Array.isArray(rs[1].tree) ? rs[1].tree : []).forEach(function (x) { if (typeof x === 'string') chats[x] = true; });
        return { tree: rs[0] && rs[0].tree && typeof rs[0].tree === 'object' ? rs[0].tree : null, chats: chats };
      });
    }

    // THE RIGHT CELL'S TITLE BAR: the opened agent's path, `lead / cluster ops / k-rollout` (the mock's
    // breadcrumb), the AI agents above it dimmed, the agent itself plain; for a file, its path's parts.
    // Read from the kernel's tree (a bundle agent's own reflect names no parent); a refusal leaves the name.
    var crumb = document.getElementById('crumb');
    function paintCrumb(names) {
      crumb.textContent = '';
      names.forEach(function (n, i) {
        var last = i === names.length - 1, e = document.createElement('span');
        e.textContent = n;
        if (!last) e.className = 'dim';
        crumb.appendChild(e);
        if (!last) { var sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = ' / '; crumb.appendChild(sep); }
      });
    }
    function crumbFor(id, path) {
      if (path) { paintCrumb(crumbOf(path.split('/').map(function (p) { return { name: p }; }))); return; }
      paintCrumb([id]);
      treeNow().then(function (t) {
        if (right.getAttribute('data-open') !== id || !t.tree) return;
        var names = crumbPath(pathTo(t.tree, id), t.chats);
        if (names.length) paintCrumb(crumbOf(names.map(function (n) { return { name: n }; })));
      });
    }

    // The handler module (bundle) of agent `id`, from the root's `list_agents`; '' when the leg may not read it.
    function bundleOf(id) {
      return window.fantastic.send('kernel', { type: 'list_agents' }).then(function (r) {
        var a = (r && Array.isArray(r.agents) ? r.agents : []).filter(function (x) { return x && x.id === id; })[0];
        return a && typeof a.handler_module === 'string' ? a.handler_module : '';
      }, function () { return ''; });
    }

    // Open the agent `id` (or, for a file, the view agent `via` made for it) in the right cell. The agent's own
    // `reflect` is asked first: the page leg's grants are the records' (the yaml declares each view's calls).
    // Only a refusal asks the dispatcher's `open` once (it grants the leg the chat of an agent made since) and
    // reflects again; the dispatcher may not exist, and a team whose records grant everything never needs it.
    function open(relay, id, via) {
      var shown = null;
      right.setAttribute('data-open', id);
      crumbFor(id, via ? id : '');
      panel('agent');
      showWaiting(id);
      right.textContent = '';
      var note = document.createElement('div');
      note.className = 'opened';
      note.textContent = id;
      right.appendChild(note);
      function mine() { return right.getAttribute('data-open') === id; }
      function refused(r) { return !r || (typeof r.error === 'string' && r.error !== ''); }
      var target = Promise.resolve(via ? via() : id);
      target.then(function (t) {
        var open = function () { return window.fantastic.send('dispatcher', { type: 'open', node: t }).catch(function () {}); };
        // a refusal is an error frame or a reply with an `error`: both are `null` here
        var reflect = function () { return window.fantastic.send(t, { type: 'reflect' }).catch(function () { return null; }); };
        // a file's view agent is new: the dispatcher grants the leg its reads before the first `reflect`
        if (via) return open().then(reflect);
        return reflect().then(function (r) { return refused(r) ? open().then(reflect) : r; });
      }).then(function (r) {
        if (!mine() || refused(r)) return; // the page leg may not reflect this agent: the bare id stays
        if (viewOf(r)) { shown = draw(relay, id, r); return; }
        // an agent with no view: the card names its parent (the kernel's tree) and its bundle; a reflect that
        // does not name the bundle (a bridge's) gets it from the kernel's own record (`list_agents`)
        return Promise.all([r && r.handler_module ? '' : bundleOf(id), treeNow()]).then(function (got) {
          var p = got[1].tree ? pathTo(got[1].tree, id) : [];
          if (mine()) shown = draw(relay, id, r, got[0], p.length > 1 ? p[p.length - 2].name : '');
        });
      }, function () { /* the bare id stays */ });
      return function () { if (shown) shown.unmount(); };
    }

    // A file row: the files agent makes (or reuses) the view agent of the path; that agent's `reflect` is the
    // file view. The row's id for the cell is the path.
    function openFile(relay, path) {
      return open(relay, path, function () {
        return window.fantastic.send('files', { type: 'open_view', kind: 'file', path: path }).then(function (r) {
          if (!r || typeof r.id !== 'string') throw new Error('no view for ' + path);
          return r.id;
        });
      });
    }

    import('./view_relay.js').then(function (relay) {
      return window.fantastic.send(SIDEBAR, { type: 'reflect' }).then(function (got) {
        var v = viewOf(got);
        if (!v) return; // no sidebar agent: no column
        var closeOpened = function () {};
        mountSkinned(relay, {
          mount: left, html: v.bytes, transport: transport, calls: v.calls || {}, cell: CELL, keep: relay.pageStore('team.sidebar'), extra: HOST_HEAD,
          // what the view says is the base's `hearSidebar`; the team page has no canvas to open a file on: a
          // row's `select` opens that agent, a file row's `select_file` that file, `hide_tree` hides the tree
          onMessage: function (m) {
            relay.hearSidebar(m, {
              select: function (id) { closeOpened(); closeOpened = open(relay, id); },
              selectPath: function (path) { closeOpened(); closeOpened = openFile(relay, path); },
              hide: function () { tree(false); }
            });
          }
        });
      });
    }).catch(function () { /* the connection to the team is down: the cell stays empty */ });
  })();
</script>
</body>
</html>
