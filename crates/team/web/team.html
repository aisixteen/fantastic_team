<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team</title>
<style>
  /* ---- Tokens. One accent; four state colours; a 4 px spacing rhythm; a 11/12/13/15 type scale. */
  :root {
    color-scheme: light dark;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 15px;
    --s1: 2px; --s2: 4px; --s3: 6px; --s4: 8px; --s5: 12px; --s6: 16px; --s7: 24px;
    --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
    --bar-h: 44px; --row-h: 26px;
    --bg: #f5f5f3; --surface: #ffffff; --sunken: #f0f0ed; --hover: rgba(24, 26, 32, 0.045);
    --line: #e4e4df; --line-strong: #d2d2cb; --guide: #dcdcd5;
    --text: #1b1c1f; --text-2: #575a61; --text-3: #8a8d94;
    --accent: #3b5bcf; --accent-hover: #3050c0; --accent-weak: #ebeffc; --accent-line: #c8d3f5; --on-accent: #ffffff;
    --ok: #2a7a4b; --ok-weak: #e5f3ea;
    --warn: #a35a07; --warn-weak: #fdf2de; --warn-line: #efd29d;
    --bad: #bd3328; --bad-weak: #fcebe8; --bad-line: #f1c4bd;
    --shadow-1: 0 1px 2px rgba(16, 18, 24, 0.05);
    --shadow-2: 0 10px 32px rgba(16, 18, 24, 0.18);
    --focus: 0 0 0 3px rgba(59, 91, 207, 0.28);
    --ease: cubic-bezier(0.2, 0.6, 0.2, 1); --t-fast: 120ms; --t-med: 200ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214; --surface: #17181b; --sunken: #1f2024; --hover: rgba(255, 255, 255, 0.05);
      --line: #28292e; --line-strong: #37393f; --guide: #2f3136;
      --text: #e7e8ea; --text-2: #a7aab1; --text-3: #6f737b;
      --accent: #8ba4ff; --accent-hover: #a2b6ff; --accent-weak: rgba(139, 164, 255, 0.13); --accent-line: rgba(139, 164, 255, 0.35); --on-accent: #0f1220;
      --ok: #6cc690; --ok-weak: rgba(108, 198, 144, 0.13);
      --warn: #efb45c; --warn-weak: rgba(239, 180, 92, 0.12); --warn-line: rgba(239, 180, 92, 0.34);
      --bad: #f27a6e; --bad-weak: rgba(242, 122, 110, 0.13); --bad-line: rgba(242, 122, 110, 0.36);
      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-2: 0 10px 32px rgba(0, 0, 0, 0.55);
      --focus: 0 0 0 3px rgba(139, 164, 255, 0.32);
    }
  }

  /* ---- Base */
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { font-family: var(--font); font-size: var(--fs-md); line-height: 1.45; color: var(--text); background: var(--bg); margin: 0; padding: 0; box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body > * { flex: none; }
  *, *::before, *::after { box-sizing: border-box; }
  h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.005em; }
  ::selection { background: var(--accent-line); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
  button { font: inherit; font-size: var(--fs-sm); font-weight: 500; line-height: 1; display: inline-flex; align-items: center; justify-content: center; gap: var(--s3); height: 28px; padding: 0 10px; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md); cursor: pointer; white-space: nowrap; transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  button:hover { background-color: var(--sunken); }
  button:active { background-color: var(--line); }
  button:disabled { opacity: 0.45; cursor: default; background-color: var(--surface); }
  button:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
  input { font: inherit; color: var(--text); }
  input:not([type="checkbox"]):not([type="file"]) { height: 30px; padding: 0 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md); min-width: 0; transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
  input:not([type="checkbox"]):not([type="file"]):focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
  input::placeholder { color: var(--text-3); }
  input[type="checkbox"] { accent-color: var(--accent); margin: 0; width: 14px; height: 14px; }

  /* ---- Top bar: Tree, the title, then the digests switch at the right. */
  .bar { position: relative; z-index: 30; display: flex; gap: var(--s4); align-items: center; height: var(--bar-h); padding: 0 var(--s5); background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar h2 { margin: 0 auto 0 var(--s1); font-size: var(--fs-lg); font-weight: 650; display: inline-flex; align-items: center; gap: var(--s4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bar h2::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); box-shadow: 4px 4px 0 -1px var(--accent-line); }
  .bar button { font: inherit; font-size: var(--fs-sm); padding: 0 10px 0 8px; }
  #collapse-tree { order: -1; border-color: transparent; background: transparent; color: var(--text-2); }
  #collapse-tree:hover { background: var(--hover); color: var(--text); }
  #collapse-tree::before { content: ""; width: 14px; height: 12px; border: 1.5px solid currentColor; border-radius: 3px; background: linear-gradient(to right, currentColor 0 4px, transparent 4px) no-repeat; background-size: 4px 100%; opacity: 0.9; }
  #collapse-tree[aria-expanded="false"]::before { background-size: 0 100%; }
  .cadencer { display: inline-flex; align-items: center; gap: var(--s4); font-size: var(--fs-sm); color: var(--text-2); cursor: pointer; user-select: none; white-space: nowrap; }
  .cadencer input[type="checkbox"] { appearance: none; -webkit-appearance: none; position: relative; width: 28px; height: 16px; border-radius: 999px; background: var(--line-strong); cursor: pointer; transition: background-color var(--t-med) var(--ease); }
  .cadencer input[type="checkbox"]::before { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform var(--t-med) var(--ease); }
  .cadencer input[type="checkbox"]:checked { background: var(--accent); }
  .cadencer input[type="checkbox"]:checked::before { transform: translateX(12px); }
  .cadencer input[type="checkbox"]:disabled { opacity: 0.5; cursor: default; }
  .cadencer input[type="checkbox"]:focus-visible { outline: none; box-shadow: var(--focus); }
  #cadencer-state { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32ch; }

  /* ---- Error banner across the top (empty: gone). */
  .error { color: var(--bad); }
  #error { display: flex; align-items: center; gap: var(--s4); padding: 7px var(--s6); font-size: var(--fs-sm); color: var(--bad); background: var(--bad-weak); border-bottom: 1px solid var(--bad-line); animation: drop-in var(--t-med) var(--ease); }
  #error::before { content: "!"; flex: none; display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--bad); color: var(--surface); font-size: 11px; font-weight: 700; }
  #error:empty { display: none; }

  /* ---- Two columns under the bar. */
  .app { height: 100vh; min-height: 400px; display: flex; flex-direction: column; }
  .app > * { flex: none; }
  #layout { display: flex; align-items: stretch; flex: 1 1 auto; min-height: 0; }
  #layout.collapsed #sidebar { display: none; }
  #sidebar { width: 280px; flex: none; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 1px; padding: var(--s4) var(--s3) var(--s5); background: var(--surface); border-right: 1px solid var(--line); scrollbar-width: thin; }
  #pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: var(--s5) var(--s6) var(--s6); }
  #pane[hidden] { display: none; }
  #layout:has(> #pane[hidden])::after { content: "Select an agent to open its chat"; flex: 1; display: grid; place-items: center; color: var(--text-3); font-size: var(--fs-sm); }
  #layout:has(> #pane[hidden]):not(:has(.item))::after { content: ""; }

  /* First load: skeleton rows until the first answer (the digest note fills in after it). */
  body:has(#cadencer-state:empty) #sidebar:empty::before { content: ""; display: block; height: 232px; margin: var(--s2) var(--s3); --sk: var(--sunken);
    background:
      linear-gradient(var(--sk) 0 0) 0 2px / 56px 8px no-repeat,
      linear-gradient(var(--sk) 0 0) 0 26px / 68% 10px no-repeat,
      linear-gradient(var(--sk) 0 0) 14px 52px / 54% 10px no-repeat,
      linear-gradient(var(--sk) 0 0) 28px 78px / 60% 10px no-repeat,
      linear-gradient(var(--sk) 0 0) 28px 104px / 46% 10px no-repeat,
      linear-gradient(var(--sk) 0 0) 14px 130px / 50% 10px no-repeat,
      linear-gradient(var(--sk) 0 0) 28px 156px / 58% 10px no-repeat,
      linear-gradient(var(--sk) 0 0) 0 192px / 44px 8px no-repeat,
      linear-gradient(var(--sk) 0 0) 0 216px / 40% 10px no-repeat;
    animation: pulse 1.4s ease-in-out infinite; }
  /* Loaded, and nothing to list. */
  body:not(:has(#cadencer-state:empty)) #sidebar:not(:has(.item))::before { content: "No agents yet\A Start the lead to begin."; white-space: pre-line; display: block; padding: var(--s7) var(--s5); text-align: center; color: var(--text-3); font-size: var(--fs-sm); line-height: 1.7; }
  body:has(#error:not(:empty)) #sidebar:not(:has(.item))::before { content: "The team is not answering\A The rows come back when it does."; }

  /* ---- Sidebar: section titles, rows. */
  .agents-title, .team-title, .group-title { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin: var(--s5) var(--s3) var(--s2); }
  .agents-title:first-child { margin-top: var(--s2); }
  .group-load { font-size: var(--fs-xs); color: var(--text-3); margin: 0 var(--s3) var(--s2); }
  .item { position: relative; display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; min-height: var(--row-h); padding: 2px var(--s3); border-radius: var(--r-md); cursor: pointer; color: var(--text); transition: background-color var(--t-fast) var(--ease); }
  .item:hover { background-color: var(--hover); }
  .item.selected, .service.selected, .agent.selected { background-color: var(--accent-weak); box-shadow: inset 2px 0 0 var(--accent); }
  .item .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .twisty { flex: none; display: inline-grid; place-items: center; width: 14px; height: 16px; border-radius: 3px; font-size: 0; line-height: 1; text-align: center; cursor: pointer; color: var(--text-3); transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
  .twisty::before { content: ""; width: 4px; height: 4px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translate(-1px, 0) rotate(-45deg); transition: transform var(--t-fast) var(--ease); }
  .twisty[aria-expanded="true"]::before { transform: translate(0, -1px) rotate(45deg); }
  .twisty:hover { background: var(--line); color: var(--text); }

  /* The agent tree: 8 px per level up to the server's cap of 4, a guide line per level. */
  .agent { flex-wrap: nowrap; white-space: nowrap; padding-left: 6px; background-repeat: no-repeat; background-position: 13px 0; background-image: repeating-linear-gradient(to right, var(--guide) 0 1px, transparent 1px 8px); background-size: 0 100%; }
  .agent > .name:first-child { margin-left: 20px; }
  .agent .name { flex: 0 1 auto; }
  .agent .task { flex: 0 4 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-xs); color: var(--text-3); font-family: var(--mono); }
  /* A stalled or failed row needs the room for its state: the role gives way. */
  .agent:has(> .mark.state-stalled) > .task, .agent:has(> .mark.state-failed) > .task { display: none; }
  .agent.lead { font-weight: 650; }
  .agent.lead .name { color: var(--text); }
  .agent.selected { background-color: var(--accent-weak); }
  .agent[data-indent="0"] { padding-left: 6px; }
  .agent[data-indent="1"] { padding-left: 14px; background-size: 8px 100%; }
  .agent[data-indent="2"] { padding-left: 22px; background-size: 16px 100%; }
  .agent[data-indent="3"] { padding-left: 30px; background-size: 24px 100%; }
  .agent[data-indent="4"] { padding-left: 38px; background-size: 32px 100%; }
  /* Deeper than the cap: the true depth sits in the last guide column. */
  .agent[data-indent="4"]:not([data-depth="4"])::after { content: attr(data-depth); position: absolute; left: 32px; top: 50%; transform: translateY(-50%); width: 11px; text-align: center; font: 600 9px/12px var(--mono); color: var(--text-3); background: var(--surface); border-radius: 2px; }
  .agent.selected[data-indent="4"]:not([data-depth="4"])::after { background: transparent; }
  .agent .mark { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px; height: 18px; font-size: var(--fs-xs); font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .agent .mark::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: 0.85; }
  .agent .mark.state-stalled, .agent .mark.state-failed, .agent .mark.state-done, .agent .mark.state-paused { padding: 0 7px 0 6px; border-radius: 999px; }
  .agent .mark.state-stalled { color: var(--warn); background: var(--warn-weak); }
  .agent .mark.state-stalled::before { background: var(--warn); }
  .agent .mark.state-failed { color: var(--bad); background: var(--bad-weak); }
  .agent .mark.state-failed::before { background: var(--bad); }
  .agent .mark.state-done { color: var(--ok); background: var(--ok-weak); }
  .agent .mark.state-done::before { background: var(--ok); }
  .agent .mark.state-paused { color: var(--text-2); background: var(--sunken); }
  .agent .mark.state-paused::before { background: var(--text-3); border-radius: 1px; }

  /* Services under "Team": a small square instead of a fold toggle. */
  .service { flex-wrap: nowrap; padding-left: 6px; color: var(--text-2); }
  .service::before { content: ""; flex: none; width: 7px; height: 7px; margin: 0 3.5px; border: 1.5px solid var(--text-3); border-radius: 2px; }
  .service.selected { color: var(--text); background-color: var(--accent-weak); }

  /* Workers and their subagents (the mode without roles). */
  .worker { font-size: 1em; padding-top: 4px; padding-bottom: 4px; }
  .worker .name { font-weight: 600; }
  .item.worker.state-stalled { background-color: var(--warn-weak); }
  .dot { width: 1em; flex: none; text-align: center; color: var(--accent); font-size: 10px; }
  .expander { color: var(--text-3); font-size: var(--fs-sm); padding-left: 22px; }
  .sub { font-size: var(--fs-sm); color: var(--text-2); padding-left: 28px; }
  .sub .name { font-weight: 400; }
  .sub .dot { color: var(--text-3); }
  .state-stalled { color: var(--warn); }
  .state-failed { color: var(--bad); }
  .state-done { color: var(--ok); }
  .state-paused { color: var(--text-2); }
  .task { color: var(--text-3); }
  .minutes, .pr { color: var(--text-3); font-size: var(--fs-xs); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .add-worker { display: flex; gap: var(--s2); flex-wrap: wrap; margin: 0 var(--s3) var(--s2); }
  .add-worker input { font: inherit; font-size: var(--fs-sm); min-width: 0; width: 7.5em; height: 26px !important; padding: 0 8px !important; }
  .add-worker button { font: inherit; font-size: var(--fs-sm); height: 26px; padding: 0 8px; }
  .controls { display: inline-flex; gap: var(--s2); margin-left: auto; flex-wrap: wrap; }
  .controls button { font: inherit; font-size: var(--fs-xs); height: 24px; min-width: 44px; padding: 0 8px; }

  /* Footer lines: what waits for you, then the load. Pinned to the bottom of the column. */
  .team-waiting { margin-top: auto; padding: var(--s4) var(--s3) 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); font-weight: 600; color: var(--text); }
  .team-waiting::before { content: ""; display: inline-block; width: 6px; height: 6px; margin: 0 7px 1px 1px; border-radius: 50%; background: var(--warn); }
  .team-load { margin-top: auto; padding: var(--s4) var(--s3) 0; border-top: 1px solid var(--line); font-size: var(--fs-xs); line-height: 1.6; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .team-waiting + .team-load { margin-top: 0; padding-top: var(--s2); border-top: 0; }
  #sidebar > :not(.team-waiting):has(+ .team-waiting), #sidebar > :not(.team-waiting):has(+ .team-load) { margin-bottom: var(--s5); }

  /* ---- The pane: the agent's view (the plan for the lead) above its chat. */
  .pane-head { display: flex; gap: var(--s3); align-items: center; flex: none; margin: 0 0 var(--s4); }
  .pane-head:not(:has(.canvas-btn)) { display: none; }
  .pane-head button { font: inherit; font-size: var(--fs-sm); height: 28px; padding: 0 10px; }
  .pane-head .canvas-btn { margin-left: auto; }
  .pane-head .canvas-btn::before { content: ""; width: 12px; height: 10px; border: 1.5px solid currentColor; border-radius: 2px; box-shadow: inset 0 2px 0 -0.5px currentColor; }
  .pane-back { display: none; }
  .pane-back::before { content: "\2039"; font-size: 16px; line-height: 0; margin-top: -2px; }
  #pane iframe.canvas-frame { flex: 1; width: 100%; height: 100%; min-height: 0; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1); animation: fade-in var(--t-med) var(--ease); }

  .agent-view { flex: none; max-height: 40%; overflow: auto; margin: 0 0 var(--s4); padding: 0 0 var(--s2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); font-size: var(--fs-sm); }
  .agent-view[hidden] { display: none; }
  .plan-head { position: sticky; top: 0; z-index: 1; padding: 9px var(--s5) 1px; background: var(--surface); font-size: var(--fs-md); font-weight: 600; color: var(--text); }
  .plan-tree { padding: 0 var(--s5) var(--s4); border-bottom: 1px solid var(--line); font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .plan-tasks { padding-top: var(--s1); }
  .plan-task { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) minmax(0, 10em) 6.5em; gap: var(--s5); align-items: center; padding: 3px var(--s5); min-height: 26px; overflow-wrap: anywhere; transition: background-color var(--t-fast) var(--ease); }
  .plan-task:hover { background-color: var(--hover); }
  .plan-task + .plan-task { box-shadow: inset 0 1px 0 var(--line); }
  .plan-task .id { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .plan-task .source { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan-task .holder { font-family: var(--mono); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan-task .status { justify-self: end; margin-left: auto; font-weight: 600; font-size: var(--fs-xs); line-height: 18px; padding: 0 8px; border-radius: 999px; color: var(--text-2); background: var(--sunken); white-space: nowrap; }
  .plan-task .status:empty { display: none; }
  .plan-task .status.state-done { color: var(--ok); background: var(--ok-weak); }
  .plan-task .status.state-failed { color: var(--bad); background: var(--bad-weak); }
  .plan-task .status.state-stalled { color: var(--warn); background: var(--warn-weak); }

  /* Cells: framed surfaces. The chat fills the height; its transcript scrolls inside. */
  .cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s5) var(--s6); margin: var(--s4) 0; }
  .cell.chat { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; margin: 0; padding: 0; overflow: hidden; box-shadow: var(--shadow-1); }
  .cell.chat[hidden], .agent-view[hidden] { display: none; }
  .cell.panel { flex: 1; min-height: 0; overflow: auto; margin: 0; box-shadow: var(--shadow-1); }
  .chat-head { display: flex; gap: var(--s4); align-items: baseline; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 10px var(--s6) 9px; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--text-3); }
  .chat-head strong { font-size: var(--fs-md); font-weight: 600; color: var(--text); }
  .chat-head > span:not(.stats) { font-family: var(--mono); font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; }
  .stats { margin-left: auto; padding-left: var(--s4); font-size: var(--fs-xs); font-family: var(--mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .transcript { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column; gap: var(--s4); padding: var(--s5) var(--s6) var(--s6); scrollbar-width: thin; }
  .transcript > * { flex: none; }

  .msg { margin: 0; padding: 7px 11px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: min(76ch, 88%); line-height: 1.5; animation: rise var(--t-med) var(--ease); }
  .msg.user { align-self: flex-end; background: var(--accent-weak); color: var(--text); border-bottom-right-radius: var(--r-sm); }
  .msg.assistant { align-self: flex-start; background: var(--sunken); border-bottom-left-radius: var(--r-sm); }
  .msg.not-sent { opacity: 0.5; text-decoration: line-through; }
  .msg.pending { opacity: 0.6; }
  .msg.thinking { align-self: flex-start; background: transparent; color: var(--text-3); font-size: var(--fs-sm); padding: 3px 10px; border: 1px dashed var(--line-strong); border-radius: var(--r-md); }
  .msg.thinking summary { cursor: pointer; font-style: italic; list-style: none; }
  .msg.thinking summary::-webkit-details-marker { display: none; }
  .msg.thinking summary::before { content: "\203A"; display: inline-block; width: 10px; font-style: normal; transition: transform var(--t-fast) var(--ease); }
  .msg.thinking[open] summary::before { transform: rotate(90deg); }
  .msg.thinking[open] { padding-bottom: var(--s3); }
  .thinking-body { padding-top: var(--s2); }
  /* While a turn runs (Send is disabled) the newest agent bubble carries a caret. */
  .cell.chat:has(.composer button[type="submit"]:disabled) .transcript > .msg.assistant:last-child::after { content: ""; display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px; border-radius: 1px; background: var(--accent); animation: blink 1.1s ease-in-out infinite; }

  .tool-block { align-self: flex-start; max-width: min(76ch, 88%); min-width: min(42ch, 88%); margin: 0; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); font-family: var(--mono); font-size: var(--fs-xs); overflow-wrap: anywhere; animation: rise var(--t-med) var(--ease); }
  .tool-block summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: var(--s4); padding: 5px 10px; color: var(--text-2); border-radius: var(--r-md); }
  .tool-block summary::-webkit-details-marker { display: none; }
  .tool-block summary:hover { background-color: var(--hover); }
  .tool-block summary::after { content: "\203A"; margin-left: auto; color: var(--text-3); font-family: var(--font); font-size: 14px; line-height: 1; transition: transform var(--t-fast) var(--ease); }
  .tool-block[open] summary::after { transform: rotate(90deg); }
  .tool-head { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-mark { order: -1; flex: none; display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; font-size: 10px; line-height: 1; color: var(--text-3); }
  .tool-block[data-state="pending"] .tool-mark { color: transparent; border: 1.5px solid var(--accent-line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  .tool-block[data-state="done"] .tool-mark { color: var(--ok); background: var(--ok-weak); font-weight: 700; }
  .tool-reply { white-space: pre-wrap; color: var(--text-2); padding: var(--s3) 10px var(--s4); border-top: 1px solid var(--line); max-height: 260px; overflow: auto; }
  .tool-reply:empty { display: none; }

  .msg.inquiry, .inquiry { align-self: flex-start; background: var(--warn-weak); border: 1px solid var(--warn-line); border-left: 3px solid var(--warn); border-radius: var(--r-md); padding: var(--s4) var(--s5) var(--s5); max-width: min(76ch, 92%); }
  .inq-text::before { content: "Question for you"; display: block; margin-bottom: 2px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--warn); }
  .inquiry .inq-controls { display: flex; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s4); align-items: center; white-space: normal; }
  .inquiry .inq-controls:empty { display: none; }
  .inquiry .inq-controls label { display: inline-flex; gap: var(--s3); align-items: center; font-size: var(--fs-sm); padding-right: var(--s4); cursor: pointer; }
  .inquiry .inq-controls input:not([type="checkbox"]) { flex: 1 1 16em; }
  .inquiry button { font: inherit; font-size: var(--fs-sm); height: 30px; padding: 0 12px; border-color: var(--warn-line); }
  .inquiry button:hover { border-color: var(--warn); }
  .inquiry .inq-error { color: var(--bad); margin-top: var(--s2); font-size: var(--fs-sm); }
  .inquiry .inq-error:empty { display: none; }
  .inq-done { margin-top: var(--s2); font-size: var(--fs-sm); color: var(--text-2); }

  .chat-card { align-self: stretch; flex: none; margin: 0; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); box-shadow: var(--shadow-1); animation: rise var(--t-med) var(--ease); }
  .chat-card .card-head { display: flex; gap: var(--s4); align-items: center; height: 28px; padding: 0 var(--s1) 0 10px; background: var(--sunken); border-bottom: 1px solid var(--line); font-size: var(--fs-xs); font-family: var(--mono); color: var(--text-2); }
  .chat-card .card-head::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .chat-card .card-head button { margin-left: auto; font: inherit; height: 22px; min-width: 22px; padding: 0 6px; border-color: transparent; background: transparent; color: var(--text-3); font-size: 14px; }
  .chat-card .card-head button:hover { background: var(--hover); color: var(--text); }
  .chat-card iframe { display: block; width: 100%; border: 0; background: var(--surface); }
  .chat-card .card-note { padding: var(--s5); color: var(--text-3); font-size: var(--fs-sm); }

  .chip { display: inline-flex; align-items: center; gap: var(--s2); margin-left: var(--s3); padding: 0 2px 0 8px; height: 22px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap; }
  .chip button { height: 18px; min-width: 18px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--text-3); }
  .chip button:hover { background: var(--line); color: var(--text); }
  .msg .chip { margin-left: var(--s3); vertical-align: 1px; }
  .composer .chip { align-self: center; margin-left: 0; }

  .composer { display: flex; gap: var(--s3); align-items: center; flex: none; padding: var(--s4) var(--s4) var(--s4) var(--s3); border-top: 1px solid var(--line); background: var(--surface); }
  .composer input { flex: 1; min-width: 0; font: inherit; height: 34px !important; padding: 0 12px !important; border-radius: var(--r-lg) !important; background: var(--bg) !important; }
  .composer input:focus-visible { background: var(--surface) !important; }
  .composer button { font: inherit; font-size: var(--fs-sm); height: 34px; padding: 0 14px; border-radius: var(--r-lg); }
  .composer > button:first-child { width: 34px; padding: 0; border-color: transparent; background: transparent; filter: grayscale(1); opacity: 0.7; font-size: 15px; }
  .composer > button:first-child:hover { background: var(--hover); opacity: 1; }
  .composer button[type="submit"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .composer button[type="submit"]:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .composer button[type="submit"]:disabled { background: var(--accent); }

  /* A service's panel: plain tables of text. */
  .panel-title { display: block; font-size: var(--fs-lg); font-weight: 600; margin: 0 0 var(--s2); }
  .panel-summary { color: var(--text-2); margin: 2px 0; font-size: var(--fs-sm); }
  .panel-section { margin: var(--s6) 0 var(--s3); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
  .panel-table { border-collapse: collapse; width: 100%; margin-bottom: var(--s4); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .panel-table th, .panel-table td { text-align: left; padding: 5px var(--s5) 5px 0; border-bottom: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; vertical-align: top; }
  .panel-table th { font-size: var(--fs-xs); font-weight: 600; color: var(--text-3); border-bottom-color: var(--line-strong); }
  .panel-table tr.panel-row:hover td { background: var(--hover); }

  /* ---- Packs: secondary, below the fold. */
  .packs-area { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 400px); gap: var(--s6); align-items: start; padding: var(--s7) var(--s6) 40px; border-top: 1px solid var(--line); }
  #packs { margin: 0; display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
  #packs h2, #packinstall h3 { font-size: var(--fs-lg); font-weight: 600; }
  #packs > label { display: inline-flex; gap: var(--s4); align-items: center; font-size: var(--fs-sm); color: var(--text-2); cursor: pointer; }
  #packs-note:empty, #packs-warnings:empty, #packs-updates:empty, #pack-result:empty { display: none; }
  #packs-note { font-size: var(--fs-sm); }
  #packs-warnings { font-size: var(--fs-sm); padding: var(--s3) 10px; background: var(--bad-weak); border: 1px solid var(--bad-line); border-radius: var(--r-md); }
  #packs .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--s4); }
  #packs .cards:empty { display: none; }
  #packs .card { display: flex; flex-direction: column; gap: 2px; padding: 10px var(--s5); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); cursor: pointer; min-width: 0; font-size: var(--fs-sm); color: var(--text-2); transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
  #packs .card:hover { border-color: var(--accent-line); box-shadow: var(--shadow-1); }
  #packs .card strong { font-size: var(--fs-md); color: var(--text); font-weight: 600; }
  #packs .card .task { font-size: var(--fs-xs); }
  #packs .card.revoked { color: var(--bad); border-color: var(--bad-line); }
  #packs .detail { padding: var(--s5) var(--s6); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); font-size: var(--fs-sm); }
  #packs .detail h3 { font-size: var(--fs-md); margin-bottom: var(--s2); }
  #packs .detail p { margin: var(--s2) 0; color: var(--text-2); }
  #packs .detail p.error { color: var(--bad); }
  #packs .detail button { margin: var(--s4) var(--s3) 0 0; }
  #packs-updates p { margin: var(--s2) 0; font-size: var(--fs-sm); color: var(--text-2); }
  #packs button { font: inherit; font-size: var(--fs-sm); height: 30px; padding: 0 12px; }
  #packinstall { margin: 0; padding: var(--s5) var(--s6) var(--s6); box-shadow: var(--shadow-1); }
  #packinstall .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: var(--s3); margin: var(--s4) 0 0; }
  #packinstall input { font: inherit; font-size: var(--fs-sm); min-width: 0; }
  #packinstall button { font: inherit; height: 30px; padding: 0 14px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #packinstall button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  #pack-result { margin-top: var(--s4); font-size: var(--fs-sm); color: var(--text-2); }
  #pack-result div { margin: 2px 0; overflow-wrap: anywhere; }

  /* ---- Motion (small, and none when asked). */
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: 0.15; } }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ---- Narrower desktops. */
  @media (max-width: 960px) {
    .plan-task { grid-template-columns: 4em minmax(0, 1fr) minmax(0, 7em) auto; gap: var(--s4); }
    .packs-area { grid-template-columns: minmax(0, 1fr); }
  }
  @media (pointer: coarse) {
    button { min-height: 32px; }
  }
  /* ---- Phone: the tree and the pane are two full-width snap panels; opening an agent
     slides the pane in, Back slides the tree back. */
  @media (max-width: 600px) {
    :root { --bar-h: 48px; }
    .bar { padding: 0 var(--s5); gap: var(--s4); }
    .cadencer { font-size: 0; gap: 0; }
    .cadencer::after { content: "Digests"; font-size: var(--fs-sm); margin-left: var(--s3); }
    #cadencer-state { max-width: 12ch; }
    #layout { gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
    #layout::-webkit-scrollbar { display: none; }
    #sidebar, #pane { width: 100vw; flex: none; scroll-snap-align: start; scroll-snap-stop: always; }
    #sidebar { border-right: 0; padding-bottom: var(--s6); }
    #layout:has(> #pane[hidden])::after { content: none; }
    #pane { padding: var(--s4); box-shadow: -1px 0 0 var(--line); }
    #layout.collapsed #sidebar { display: flex; }
    #collapse-tree { display: none; }
    .pane-head, .pane-head:not(:has(.canvas-btn)) { display: flex; margin-bottom: var(--s4); }
    .pane-back { display: inline-flex; }
    .sub { padding-left: 16px; }
    .item { min-height: 32px; }
    .chat-head { padding: var(--s4) var(--s5); }
    .transcript { padding: var(--s5) var(--s5) var(--s6); }
    .msg, .tool-block { max-width: 94%; }
    .composer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; padding: var(--s3) var(--s4) var(--s4); }
    .composer input { grid-column: 1 / -1; grid-row: 1; }
    .composer > button:first-child { grid-column: 1; grid-row: 2; }
    .composer .chip { grid-column: 2; grid-row: 2; justify-self: start; }
    .composer button[type="submit"] { grid-column: 3; grid-row: 2; }
    .composer button[type="submit"] + button { grid-column: 4; grid-row: 2; }
    .tool-block { min-width: 0; }
    .agent-view { max-height: 34%; }
    .plan-task { grid-template-columns: 3.6em minmax(0, 1fr) auto; grid-template-areas: "id src st" "id who st"; row-gap: 0; padding: var(--s2) var(--s5); }
    .plan-task .id { grid-area: id; align-self: start; padding-top: 2px; }
    .plan-task .source { grid-area: src; }
    .plan-task .holder { grid-area: who; }
    .plan-task .holder:empty { display: none; }
    .plan-task .status { grid-area: st; }
    .packs-area { padding: var(--s6) var(--s5) 32px; }
    #packinstall .row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #packinstall .row button { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="app">
<div class="bar"><h2 id="title">Team</h2>
  <label class="cadencer"><input type="checkbox" id="cadencer-switch" disabled> Digests (cadencer)</label>
  <span id="cadencer-state" class="task" aria-live="polite"></span>
  <button id="collapse-tree" type="button" aria-expanded="true" aria-label="Collapse the tree">Tree</button>
</div>
<div id="error" class="error"></div>
<div id="layout">
  <nav id="sidebar" aria-label="Workers and subagents"></nav>
  <section id="pane" hidden></section>
</div>
</div>
<div class="packs-area">
<section id="packs" aria-label="Packs">
  <h2>Packs</h2>
  <label><input type="checkbox" id="packs-optin"> Show updates and their permission changes</label>
  <div id="packs-note" class="task"></div>
  <div id="packs-warnings" class="error"></div>
  <div id="packs-cards" class="cards"></div>
  <div id="packs-detail" class="detail" hidden></div>
  <div id="packs-updates"></div>
</section>
<section id="packinstall" class="cell" aria-label="Pack install">
  <h3>Pack install</h3>
  <div class="row">
    <input id="pack-pack" placeholder="pack" aria-label="pack">
    <input id="pack-into" placeholder="into" aria-label="into">
    <input id="pack-worker" placeholder="worker" aria-label="worker">
    <button id="pack-install" type="button">Install</button>
  </div>
  <div id="pack-result" aria-live="polite"></div>
</section>
</div>
<script>
// Contract: `sidebar {expanded}` answers one flat list per group: each worker
// (kind worker), then its subagents expander (kind subagents, with count and
// expanded), then its subagents (kind subagent, with tool and status) only when
// that worker is expanded. `open {node}` for a worker or a subagent answers a
// chat (view chat, target the node), shown in the pane beside the sidebar (two columns; the sidebar stays
// visible). In roles mode the reply also has `agents` (the lead first, then its tree
// depth-first, each with indent, state and label) and `plan` {lead, fleet, tasks}: the
// lead's pane draws the plan above its chat and redraws it in place. A group with no
// AI driver also carries `load` {busy, idle, stalled}, shown as a plain line
// under its title; a group with a driver shows its AI's summary instead.
// In every mode the reply also has `services` [{id, kind, label}]: the team's own
// queue, board, github connector and dispatcher, listed under "Team". `open {node}` for
// one answers {view: panel, kind, target, model: {kind, title, summary: [text],
// sections: [{name, columns, rows}]}}; the pane draws it as tables of text and asks
// again every few seconds. Every cell goes in as text (textContent).
// `control {node, action, confirm?}` starts, pauses or stops a worker. A stop
// asks first (the reply's question); a refusal from the team is shown as an error.
// Also `hand_task {node, task}`, `add_worker {node: group, id, template}` and
// `remove_worker {node, confirm}` (asks first, like stop). A worker item carries
// `minutes` (on the task), `pr` (its number) and `stalled`; the reply carries
// `waiting` {prs, stalled}, drawn above the footer, and the team `load` may carry
// `digest_bytes_per_hour` and `driver_tokens_per_hour`.
// The full-screen chat streams the target agent itself, with the same verbs and
// events as fantastic's chat cell: `history` (paged, the newest rows drawn),
// `send {text, client_id}`, `stop`, and `watch` for the parts of this page's
// client (part_start, part_delta, part_end, part_abort), `status` and `done`.
// Text parts are bubbles; reasoning (`thinking`) parts are a collapsed block;
// a `status` with phase tool_calling is one tool block per call_id (the head
// verb(target), the reply once it has one); the done status carries the stats
// line (tok/s, context). After a turn the `user` agent's `inquiries` for this
// agent are drawn as cards with controls by kind (confirm, single, multi, text);
// an answer is `answer_inquiry {re, answer}`. A chosen text file travels inside
// the same `send` as text ("[attached: NAME]" and its content): no new field.
// On open, `status {client_id}` rebuilds a turn still running. A new
// open drops the watch and the drafts. Kernel values and streamed text go in as
// text only (textContent), never as markup. A worker row also shows the minutes
// since its task last moved and the number of its pull request.
// The pane fills the height beside the tree: the chat is a flex column whose transcript
// scrolls inside. An `embed` row of the chat's history is a card, drawn where the row sits:
// a sandboxed iframe of the host agent's `get_html`, which may call that agent only (the
// team grants the page's leg that agent's panel verbs). An `unembed` row removes it. When
// the `open` reply carries `canvas` {id, url}, a Canvas button swaps the chat for that
// canvas page in an iframe. Each agent row with children folds its subtree (remembered);
// the tree column folds as a whole; on a phone the list and the pane are two snap panels.
const expanded = new Set();   // workers whose subagents are shown
const seen = new Set();       // workers already checked against the remembered state
let lastReply = null;        // the newest sidebar reply: the agents and the plan are drawn from it
const PLAN_POLL_MS = 5000;   // the task registry emits no events: poll while a lead is shown
const PLAN_DEBOUNCE_MS = 500;
const PANEL_REFRESH_MS = 5000; // a service panel in the pane re-asks `open` this often
let panel = null;            // the service panel in the pane: {node, timer}

// Remembered per worker in this browser. A blocked or full store only costs the
// memory, never the page.
function keyOf(worker) { return 'fantastic.team.subagents.' + worker; }
function remembered(worker) {
  try { return localStorage.getItem(keyOf(worker)) === '1'; } catch (e) { return false; }
}
function remember(worker, on) {
  try {
    if (on) localStorage.setItem(keyOf(worker), '1');
    else localStorage.removeItem(keyOf(worker));
  } catch (e) { /* the expansion still holds for this page */ }
}

// Folded subtrees of the agent list and the folded tree column, remembered the same way.
const collapsedAgents = new Set();
const seenAgents = new Set();    // agents already checked against the remembered state
const TREE_KEY = 'fantastic.team.tree.collapsed';
function agentKeyOf(id) { return 'fantastic.team.agents.' + id; }
function agentCollapsed(id) {
  if (!seenAgents.has(id)) {
    seenAgents.add(id);
    try {
      if (localStorage.getItem(agentKeyOf(id)) === '1') collapsedAgents.add(id);
    } catch (e) { /* no memory: the fold only holds for this page */ }
  }
  return collapsedAgents.has(id);
}
function toggleAgent(id) {
  const on = !agentCollapsed(id);
  if (on) collapsedAgents.add(id);
  else collapsedAgents.delete(id);
  try {
    if (on) localStorage.setItem(agentKeyOf(id), '1');
    else localStorage.removeItem(agentKeyOf(id));
  } catch (e) { /* the fold still holds for this page */ }
  if (lastReply) renderSidebar(lastReply);
}
function setTreeCollapsed(on, keep) {
  const layout = document.getElementById('layout');
  if (on) layout.classList.add('collapsed');
  else layout.classList.remove('collapsed');
  const btn = document.getElementById('collapse-tree');
  btn.setAttribute('aria-expanded', on ? 'false' : 'true');
  if (!keep) return;
  try {
    if (on) localStorage.setItem(TREE_KEY, '1');
    else localStorage.removeItem(TREE_KEY);
  } catch (e) { /* the fold still holds for this page */ }
}

function showError(msg) {
  document.getElementById('error').textContent = msg || '';
}

// One request to the dispatcher agent through the html connector. Rejects,
// rather than throws, when the page has no connection.
function ask(payload) {
  if (typeof fantastic === 'undefined' || !fantastic || typeof fantastic.send !== 'function') {
    return Promise.reject(new Error('no connection to the team: fantastic is not loaded'));
  }
  return Promise.resolve(fantastic.send('dispatcher', payload));
}

// The same request to any agent the page may reach (a worker or a subagent for the chat).
function askNode(id, payload) {
  if (typeof fantastic === 'undefined' || !fantastic || typeof fantastic.send !== 'function') {
    return Promise.reject(new Error('no connection to the team: fantastic is not loaded'));
  }
  return Promise.resolve(fantastic.send(id, payload));
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
}

function num(v) {
  return typeof v === 'number' && isFinite(v) ? v : 0;
}

function stateClass(state) {
  const s = String(state || '');
  if (s.indexOf('stalled') === 0) return 'state-stalled';
  if (s === 'failed') return 'state-failed';
  if (s === 'done') return 'state-done';
  return '';
}

function workerRow(it) {
  const row = el('div', 'item worker');
  row.dataset.node = it.id;
  row.dataset.kind = 'worker';
  if (it.stalled) row.classList.add('state-stalled');
  row.appendChild(el('span', 'dot', it.busy ? '●' : '○'));
  row.appendChild(el('span', 'name', it.id));
  row.appendChild(el('span', stateClass(it.state), it.state));
  if (typeof it.minutes === 'number') row.appendChild(el('span', 'minutes', it.minutes + 'm'));
  if (typeof it.pr === 'number') row.appendChild(el('span', 'pr', '#' + it.pr));
  if (it.task) row.appendChild(el('span', 'task', it.task));
  if (typeof it.minutes === 'number') row.appendChild(el('span', 'minutes', it.minutes + 'm'));
  if (typeof it.pr === 'number') row.appendChild(el('span', 'pr', 'PR #' + it.pr));
  const controls = el('span', 'controls');
  [['start', 'Start'], ['pause', 'Pause'], ['stop', 'Stop'],
   ['hand_task', 'Hand task'], ['remove_worker', 'Remove']].forEach(function (a) {
    const action = a[0];
    const b = el('button', '', a[1]);
    b.type = 'button';
    b.dataset.control = action;
    b.dataset.node = it.id;
    controls.appendChild(b);
  });
  row.appendChild(controls);
  return row;
}

// The form at the top of a group: the new worker's id and the roles-registry tier
// template it is made from.
function addWorkerForm(group) {
  const form = el('form', 'add-worker');
  const id = el('input', '');
  id.type = 'text';
  id.placeholder = 'worker id';
  id.setAttribute('aria-label', 'New worker id');
  const tpl = el('input', '');
  tpl.type = 'text';
  tpl.placeholder = 'template';
  tpl.setAttribute('aria-label', 'Template');
  const go = el('button', '', 'Add worker');
  go.type = 'submit';
  form.appendChild(id);
  form.appendChild(tpl);
  form.appendChild(go);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const wid = id.value.trim();
    const t = tpl.value.trim();
    if (!wid || !t) { showError('add a worker: give its id and a template'); return; }
    control(group, 'add_worker', false, { id: wid, template: t });
  });
  return form;
}

function expanderRow(it) {
  const row = el('div', 'item expander');
  row.dataset.expander = it.worker;
  row.setAttribute('role', 'button');
  row.setAttribute('aria-expanded', it.expanded ? 'true' : 'false');
  row.appendChild(el('span', 'dot', it.expanded ? '▾' : '▸'));
  row.appendChild(el('span', '', 'subagents (' + it.count + ')'));
  return row;
}

function subRow(it) {
  const row = el('div', 'item sub');
  row.dataset.node = it.id;
  row.dataset.kind = 'subagent';
  row.appendChild(el('span', 'dot', '◇'));
  row.appendChild(el('span', 'name', it.id));
  row.appendChild(el('span', 'task', it.tool));
  row.appendChild(el('span', 'task', it.status));
  return row;
}

function itemRow(it) {
  if (it.kind === 'worker') return workerRow(it);
  if (it.kind === 'subagents') return expanderRow(it);
  return subRow(it);
}

// Remembered expansion is read once per worker, the first time it is listed.
function adoptRemembered(items) {
  let changed = false;
  items.forEach(function (it) {
    if (it.kind !== 'worker' || seen.has(it.id)) return;
    seen.add(it.id);
    if (remembered(it.id) && !expanded.has(it.id)) {
      expanded.add(it.id);
      changed = true;
    }
  });
  return changed;
}

// The lead and the agents under it (roles mode), one flat depth-first list. The lead
// is pinned first with the label "Lead"; the indent is capped by the server.
function agentRow(a) {
  const row = el('div', 'item agent' + (a.lead ? ' lead' : ''));
  const indent = Math.max(0, Math.min(4, num(a.indent)));
  row.dataset.node = a.id;
  row.dataset.kind = 'agent';
  row.dataset.indent = String(indent);
  row.dataset.depth = String(num(a.depth));
  if (a.has_children) {
    const folded = agentCollapsed(a.id);
    const tw = el('span', 'twisty', folded ? '\u25B8' : '\u25BE');
    tw.dataset.toggle = a.id;
    tw.setAttribute('role', 'button');
    tw.setAttribute('aria-expanded', folded ? 'false' : 'true');
    row.appendChild(tw);
  }
  row.appendChild(el('span', 'name', a.label || a.role || a.id));
  if (!a.lead && a.role && a.label !== a.role) row.appendChild(el('span', 'task', a.role));
  row.appendChild(el('span', 'mark ' + stateClass(a.state), a.state || 'active'));
  return row;
}

function renderAgents(nav, reply) {
  const list = reply && Array.isArray(reply.agents) ? reply.agents : [];
  if (!list.length) return;
  nav.appendChild(el('div', 'agents-title', 'Agents'));
  // A folded row hides every row below it that is deeper (the list is depth-first).
  let hideBelow = null;
  list.forEach(function (a) {
    const depth = num(a.depth);
    if (hideBelow !== null) {
      if (depth > hideBelow) return;
      hideBelow = null;
    }
    nav.appendChild(agentRow(a));
    if (a.has_children && agentCollapsed(a.id)) hideBelow = depth;
  });
}

function markSelected() {
  const sel = chat ? chat.node : (panel ? panel.node : null);
  document.getElementById('sidebar').querySelectorAll('[data-node]').forEach(function (r) {
    if (r.dataset.node === sel) r.classList.add('selected');
    else r.classList.remove('selected');
  });
}

// The team's own services under a "Team" heading: queue, board, github, dispatcher.
function serviceRow(svc) {
  const row = el('div', 'item service');
  row.dataset.node = svc.id;
  row.dataset.kind = 'service';
  row.dataset.service = String(svc.kind || '');
  row.appendChild(el('span', 'name', svc.label || svc.id));
  return row;
}

function renderServices(nav, reply) {
  const list = reply && Array.isArray(reply.services) ? reply.services : [];
  if (!list.length) return;
  nav.appendChild(el('div', 'team-title', 'Team'));
  list.forEach(function (svc) { if (svc && svc.id) nav.appendChild(serviceRow(svc)); });
}

function renderSidebar(reply) {
  lastReply = reply || null;
  const nav = document.getElementById('sidebar');
  nav.textContent = '';
  document.getElementById('title').textContent = (reply && reply.team) || 'Team';
  const groups = (reply && reply.groups) || [];
  const loose = (reply && reply.ungrouped) || [];
  let adopted = false;
  groups.concat([{ id: null, items: loose }]).forEach(function (g) {
    if (adoptRemembered(g.items || [])) adopted = true;
  });
  renderAgents(nav, reply);
  renderServices(nav, reply);
  groups.forEach(function (g) {
    nav.appendChild(el('div', 'group-title', 'Group: ' + g.id));
    nav.appendChild(addWorkerForm(g.id));
    if (g.load) {
      nav.appendChild(el('div', 'group-load',
        'busy ' + g.load.busy + ' · idle ' + g.load.idle + ' · stalled ' + g.load.stalled));
    }
    (g.items || []).forEach(function (it) { nav.appendChild(itemRow(it)); });
  });
  loose.forEach(function (it) { nav.appendChild(itemRow(it)); });
  if (reply && reply.waiting) {
    nav.appendChild(el('div', 'team-waiting',
      'waiting for you: ' + num(reply.waiting.prs) + ' PRs · ' + num(reply.waiting.stalled) + ' stalled'));
  }
  if (reply && reply.load) {
    let cost = '';
    if (typeof reply.load.digest_bytes_per_hour === 'number') {
      cost += ' · digests ' + num(reply.load.digest_bytes_per_hour) + ' B/h';
    }
    if (typeof reply.load.driver_tokens_per_hour === 'number') {
      cost += ' · driver ' + num(reply.load.driver_tokens_per_hour) + ' tok/h';
    }
    if (reply.fleet && typeof reply.fleet.running === 'number') {
      cost += ' · agents ' + reply.fleet.running + '/' + (reply.fleet.max === null ? '-' : reply.fleet.max);
    }
    nav.appendChild(el('div', 'team-load',
      'tasks: held ' + num(reply.load.tasks && reply.load.tasks.held) +
      ' · in review ' + num(reply.load.tasks && reply.load.tasks.in_review) +
      ' · done ' + num(reply.load.tasks && reply.load.tasks.done) +
      ' · blocked ' + num(reply.load.tasks && reply.load.tasks.blocked) +
      ' · queued ' + num(reply.load.tasks && reply.load.tasks.queued) +
      ' · done last hour ' + num(reply.load.done_last_hour) + cost));
  }
  markSelected();
  if (chat) drawAgentView(chat);
  if (adopted) loadSidebar();
}

async function loadSidebar() {
  try {
    const reply = await ask({ type: 'sidebar', expanded: Array.from(expanded) });
    showError('');
    renderSidebar(reply);
  } catch (err) {
    showError(String(err && err.message ? err.message : err));
  }
  loadCadencer();
}

// The cadencer's on/off switch. The state is the cadencer's own `settings.enabled`
// (persisted by its `set`), asked at page start and after each sidebar load, so a
// restart shows it. A team with no cadencer, or one that refuses `status`, leaves the
// control disabled.
async function loadCadencer() {
  let reply;
  try {
    reply = await askNode('cadencer', { type: 'status' });
  } catch (err) {
    reply = { error: String(err && err.message ? err.message : err) };
  }
  const box = document.getElementById('cadencer-switch');
  const note = document.getElementById('cadencer-state');
  const s = reply && !reply.error ? reply.settings : null;
  if (!s || typeof s.enabled !== 'boolean') {
    box.disabled = true;
    note.textContent = 'no cadencer';
    return;
  }
  box.disabled = false;
  box.checked = s.enabled;
  note.textContent = s.enabled ? 'on' : 'off';
}

// A click sends `set {enabled}` and reloads the state. A refusal is shown as an error
// and the box goes back to what it was.
async function switchCadencer() {
  const box = document.getElementById('cadencer-switch');
  const want = box.checked;
  let reply;
  try {
    reply = await askNode('cadencer', { type: 'set', enabled: want });
  } catch (err) {
    reply = { error: String(err && err.message ? err.message : err) };
  }
  if (!reply || reply.error) {
    box.checked = !want;
    showError(reply && reply.error ? String(reply.error) : 'the cadencer did not answer');
    return;
  }
  showError('');
  await loadCadencer();
}
document.getElementById('cadencer-switch').addEventListener('change', switchCadencer);

// Start, pause, stop, hand a task to, add or remove a worker. A stop and a
// remove ask first: the team's question is shown with window.confirm, and only a
// yes sends it again with confirm. `extra` carries the action's own fields (task,
// id, template). A refusal is shown as an error; the sidebar reloads either way.
async function control(node, action, confirm, extra) {
  let reply;
  try {
    reply = await ask(Object.assign({}, extra || {}, { type: 'control', node: node, action: action, confirm: !!confirm }));
  } catch (err) {
    showError(String(err && err.message ? err.message : err));
    return;
  }
  if (reply && reply.question) {
    if (!window.confirm(reply.question)) return;
    return control(node, action, true, extra);
  }
  await loadSidebar();
  if (reply && reply.error) showError(reply.error);
}

// Hand a worker a task: the text is asked for here, and the team sends it on.
function handTask(node) {
  const task = window.prompt('Task for ' + node + ':');
  if (task == null || !task.trim()) return;
  control(node, 'hand_task', false, { task: task.trim() });
}

function toggleWorker(worker) {
  if (expanded.has(worker)) {
    expanded.delete(worker);
    remember(worker, false);
  } else {
    expanded.add(worker);
    remember(worker, true);
  }
  loadSidebar();
}

// The chat's identity on the stream: one per page, so a part is drawn only for
// the turns this page sent (the agent's other clients are read as history).
const chatClient = 'team_' + Math.random().toString(36).slice(2, 10);
const HISTORY_KEEP = 300;   // the newest history rows drawn
const HISTORY_PAGES = 20;   // pages followed when loading them
const MAX_ATTACH = 200000; // the largest text file attached to a message, in bytes
const INQUIRY_DELAY = 250;  // ms after a turn before the agent's open questions are read
let chat = null;            // the open chat: { node, transcript, input, send, stop, drafts, tools, inquiries, attached, stats, off, busy }

function bubble(role, text) {
  return el('div', 'msg ' + role, text == null ? '' : text);
}

function scrollChat(c) {
  c.transcript.scrollTop = c.transcript.scrollHeight;
}

// The plan the lead's pane shows, drawn in place: one row per task, kept by its id, so
// a new sidebar reply changes the text of the rows and never rebuilds them.
function drawPlan(c, plan) {
  const view = c.view;
  if (!c.planBox) {
    view.textContent = '';
    c.planHead = el('div', 'plan-head', '');
    c.planTree = el('div', 'plan-tree task', '');
    c.planList = el('div', 'plan-tasks', '');
    c.planRows = new Map();
    view.appendChild(c.planHead);
    view.appendChild(c.planTree);
    view.appendChild(c.planList);
    c.planBox = true;
  }
  const fleet = plan && plan.fleet && typeof plan.fleet.running === 'number'
    ? ' · agents ' + plan.fleet.running + '/' + (plan.fleet.max === null ? '-' : plan.fleet.max) : '';
  const tasks = plan && Array.isArray(plan.tasks) ? plan.tasks : [];
  c.planHead.textContent = 'Plan: ' + tasks.length + ' task' + (tasks.length === 1 ? '' : 's') + fleet;
  const agents = lastReply && Array.isArray(lastReply.agents) ? lastReply.agents : [];
  const count = function (st) { return agents.filter(function (a) { return a.state === st; }).length; };
  c.planTree.textContent = 'tree: ' + agents.length + ' agents · active ' + count('active') +
    ' · paused ' + count('paused') + ' · done ' + count('done');
  const keep = new Set();
  tasks.forEach(function (t) {
    const id = String(t.id);
    keep.add(id);
    let row = c.planRows.get(id);
    if (!row) {
      row = el('div', 'plan-task', '');
      row.dataset.task = id;
      row.appendChild(el('span', 'id', ''));
      row.appendChild(el('span', 'source task', ''));
      row.appendChild(el('span', 'holder task', ''));
      row.appendChild(el('span', 'status', ''));
      c.planRows.set(id, row);
      c.planList.appendChild(row);
    }
    row.children[0].textContent = id;
    row.children[1].textContent = String(t.source == null ? '' : t.source);
    row.children[2].textContent = String(t.holder == null ? '' : t.holder);
    row.children[3].textContent = String(t.status == null ? '' : t.status);
    row.children[3].className = 'status ' + stateClass(t.status);
  });
  Array.from(c.planRows.keys()).forEach(function (id) {
    if (!keep.has(id)) { c.planRows.get(id).remove(); c.planRows.delete(id); }
  });
}

function isLead(node) {
  const list = lastReply && Array.isArray(lastReply.agents) ? lastReply.agents : [];
  return list.some(function (a) { return a.id === node && a.lead; });
}

// The top region of the pane. The lead shows the plan; any other agent has no view of
// its own yet and shows the generic one: the chat alone, with a one-line header.
function drawAgentView(c) {
  if (!c.view) return;
  if (isLead(c.node)) {
    c.view.hidden = false;
    drawPlan(c, lastReply.plan || {});
    startLive(c);
  } else {
    if (c.planBox) { c.view.textContent = ''; c.planBox = false; c.planRows = null; }
    c.view.hidden = true;
    stopLive(c);
  }
}

// While the lead's pane is open the plan stays current: the lead's own status and done
// events reload the sidebar (debounced), and a poll does too, since the task registry
// emits no events.
function startLive(c) {
  if (c.live2) return;
  c.live2 = { off: null, wait: null, poll: null };
  const reload = function () {
    if (chat !== c || !c.live2) return;
    loadSidebar();
  };
  if (typeof fantastic !== 'undefined' && fantastic && typeof fantastic.watch === 'function') {
    c.live2.off = fantastic.watch(c.node, function (ev) {
      if (chat !== c || !c.live2 || !ev || (ev.type !== 'status' && ev.type !== 'done')) return;
      if (c.live2.wait != null) clearTimeout(c.live2.wait);
      c.live2.wait = setTimeout(function () { if (c.live2) c.live2.wait = null; reload(); }, PLAN_DEBOUNCE_MS);
    });
  }
  const tick = function () {
    if (chat !== c || !c.live2) return;
    reload();
    c.live2.poll = setTimeout(tick, PLAN_POLL_MS);
  };
  c.live2.poll = setTimeout(tick, PLAN_POLL_MS);
}

function stopLive(c) {
  stopPanel();
  const l = c.live2;
  if (!l) return;
  c.live2 = null;
  if (typeof l.off === 'function') {
    try { l.off(); } catch (e) { /* the watch is gone already */ }
  }
  if (l.wait != null) clearTimeout(l.wait);
  if (l.poll != null) clearTimeout(l.poll);
}

// The strip at the top of the pane. On a phone its Back button brings the list back into
// view (the list and the pane are two panels side by side); elsewhere it is not shown.
function paneHead() {
  const head = el('div', 'pane-head');
  const back = el('button', 'pane-back', 'Back');
  back.type = 'button';
  back.addEventListener('click', showList);
  head.appendChild(back);
  return head;
}

// Bring the pane (or the list) into view; a no-op where the page does not scroll sideways.
function revealPane() {
  const pane = document.getElementById('pane');
  if (pane && typeof pane.scrollIntoView === 'function') pane.scrollIntoView({ inline: 'start', block: 'nearest' });
}
function showList() {
  const list = document.getElementById('sidebar');
  if (list && typeof list.scrollIntoView === 'function') list.scrollIntoView({ inline: 'start', block: 'nearest' });
}

// The Canvas button swaps the chat for the agent's canvas page in an iframe, and back.
function toggleCanvas(c) {
  if (chat !== c || !c.canvas) return;
  const pane = document.getElementById('pane');
  if (c.frame) {
    c.frame.remove();
    c.frame = null;
    c.box.hidden = false;
    c.canvasBtn.textContent = 'Canvas';
    drawAgentView(c);
    return;
  }
  const f = el('iframe', 'canvas-frame');
  f.src = c.canvas.url;
  f.setAttribute('title', 'Canvas');
  f.setAttribute('width', '100%');
  f.setAttribute('height', '100%');
  c.box.hidden = true;
  c.view.hidden = true;
  pane.appendChild(f);
  c.frame = f;
  c.canvasBtn.textContent = 'Chat';
}

// The chat for one agent: the pane is the second column beside the sidebar. A top
// region holds the agent's view (the plan for the lead), then the chat box holds the
// agent's chat cell label, the transcript and the composer. A new
// open drops any chat still open first, so its stream is never drawn twice.
function showChat(reply, node) {
  dropChat();
  const pane = document.getElementById('pane');
  pane.textContent = '';
  const head = paneHead();
  const canvas = reply.canvas && typeof reply.canvas.url === 'string' ? reply.canvas : null;
  let canvasBtn = null;
  if (canvas) {
    canvasBtn = el('button', 'canvas-btn', 'Canvas');
    canvasBtn.type = 'button';
    head.appendChild(canvasBtn);
  }
  pane.appendChild(head);
  const view = el('div', 'agent-view');
  view.id = 'agent-view';
  view.hidden = true;
  pane.appendChild(view);
  const cell = reply.cell || {};
  const box = el('div', 'cell chat');
  const title = el('div', 'chat-head');
  title.appendChild(el('strong', '', cell.label || 'Chat'));
  title.appendChild(el('span', '', (cell.kind || 'chat') + ' → ' + (cell.target || node)));
  const stats = el('span', 'stats');
  title.appendChild(stats);
  box.appendChild(title);
  const transcript = el('div', 'transcript');
  transcript.setAttribute('aria-live', 'polite');
  box.appendChild(transcript);
  const form = el('form', 'composer');
  const input = el('input', '');
  input.type = 'text';
  input.placeholder = 'Message ' + node;
  input.setAttribute('aria-label', 'Message');
  input.autocomplete = 'off';
  const send = el('button', '', 'Send');
  send.type = 'submit';
  const stop = el('button', '', 'Stop');
  stop.type = 'button';
  const attach = el('button', '', '\uD83D\uDCCE');
  attach.type = 'button';
  attach.title = 'Attach a text file';
  attach.setAttribute('aria-label', 'Attach a text file');
  const file = el('input', '');
  file.type = 'file';
  file.hidden = true;
  const chip = el('span', 'chip');
  chip.hidden = true;
  form.appendChild(attach);
  form.appendChild(file);
  form.appendChild(chip);
  form.appendChild(input);
  form.appendChild(send);
  form.appendChild(stop);
  box.appendChild(form);
  pane.appendChild(box);
  pane.hidden = false;
  const c = {
    view: view, planBox: false, live2: null,
    node: node, transcript: transcript, input: input, send: send, stop: stop,
    drafts: new Map(), tools: new Map(), inquiries: new Set(), attached: null,
    stats: stats, chip: chip, file: file, timer: null, live: false,
    off: null, busy: false,
    box: box, cards: new Map(), canvas: canvas, canvasBtn: canvasBtn, frame: null
  };
  chat = c;
  if (canvasBtn) canvasBtn.addEventListener('click', function () { toggleCanvas(c); });
  revealPane();
  drawAgentView(c);
  markSelected();
  form.addEventListener('submit', function (e) { e.preventDefault(); sendChat(); });
  stop.addEventListener('click', stopChat);
  attach.addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () { chooseFile(c); });
  // Watch first, so no part that starts while the history loads is missed.
  c.off = watchNode(c);
  loadHistory(c).then(function () { return replayStatus(c); });
  loadInquiries(c);
}

// Leave the chat: unwatch, and forget its drafts. Safe when no chat is open.
function dropChat() {
  stopPanel();
  const c = chat;
  if (!c) return;
  chat = null;
  stopLive(c);
  if (typeof c.off === 'function') {
    try { c.off(); } catch (e) { /* the watch is gone already */ }
  }
  disposeCards(c);
  c.drafts.clear();
  c.tools.clear();
  c.inquiries.clear();
  c.attached = null;
  if (c.timer != null) clearTimeout(c.timer);
  c.timer = null;
}

// The panel of one team service in the pane: the title, the summary lines and each
// section as a table. Every value is text. It asks `open` again every few seconds for the
// same node and ignores an answer that arrives after another node was chosen.
function drawPanel(model) {
  const pane = document.getElementById('pane');
  pane.textContent = '';
  pane.appendChild(paneHead());
  const box = el('div', 'cell panel');
  const m = model && typeof model === 'object' ? model : {};
  box.appendChild(el('strong', 'panel-title', m.title || 'Panel'));
  (Array.isArray(m.summary) ? m.summary : []).forEach(function (line) {
    box.appendChild(el('div', 'panel-summary', line));
  });
  (Array.isArray(m.sections) ? m.sections : []).forEach(function (sec) {
    box.appendChild(el('h3', 'panel-section', sec && sec.name));
    const table = el('table', 'panel-table');
    const head = el('tr', 'panel-head');
    (Array.isArray(sec && sec.columns) ? sec.columns : []).forEach(function (col) {
      head.appendChild(el('th', '', col));
    });
    table.appendChild(head);
    (Array.isArray(sec && sec.rows) ? sec.rows : []).forEach(function (r) {
      const tr = el('tr', 'panel-row');
      (Array.isArray(r) ? r : []).forEach(function (cell) { tr.appendChild(el('td', '', cell)); });
      table.appendChild(tr);
    });
    box.appendChild(table);
  });
  pane.appendChild(box);
  pane.hidden = false;
}

function showPanel(reply, node) {
  dropChat();
  const p = { node: node, timer: null };
  panel = p;
  drawPanel(reply.model);
  markSelected();
  revealPane();
  const tick = function () {
    p.timer = null;
    if (panel !== p) return;
    ask({ type: 'open', node: node }).then(function (r) {
      if (panel !== p) return;
      if (r && !r.error && r.view === 'panel') drawPanel(r.model);
    }, function () { /* keep the last view; the next tick tries again */ }).then(function () {
      if (panel === p) p.timer = setTimeout(tick, PANEL_REFRESH_MS);
    });
  };
  p.timer = setTimeout(tick, PANEL_REFRESH_MS);
}

function stopPanel() {
  const p = panel;
  if (!p) return;
  panel = null;
  if (p.timer != null) clearTimeout(p.timer);
  p.timer = null;
}

function watchNode(c) {
  if (typeof fantastic === 'undefined' || !fantastic || typeof fantastic.watch !== 'function') {
    showError('no connection to the team: fantastic is not loaded');
    return null;
  }
  return fantastic.watch(c.node, function (ev) { if (chat === c) onChatEvent(c, ev); });
}

// The rows of a chat are read page by page, oldest first; the newest are drawn
// above anything that streamed in while they loaded. Notice rows are the agent's
// own turns to its model, not chat, and are left out.
async function readRows(c) {
  let rows = [];
  let args = { type: 'history' };
  try {
    for (let page = 0; page < HISTORY_PAGES; page++) {
      const r = await askNode(c.node, args);
      if (chat !== c) return null;
      if (!r || r.error) {
        showError(r && r.error ? String(r.error) : 'the history was not answered');
        break;
      }
      rows = rows.concat(Array.isArray(r.rows) ? r.rows : []);
      if (rows.length > HISTORY_KEEP) rows = rows.slice(rows.length - HISTORY_KEEP);
      if (typeof r.next !== 'number') break;
      args = { type: 'history', after: r.next };
    }
  } catch (err) {
    if (chat === c) showError(String(err && err.message ? err.message : err));
    return null;
  }
  return chat === c ? rows : null;
}

async function loadHistory(c) {
  const rows = await readRows(c);
  if (!rows) return;
  // A card sits where its embed row sits (the last one of an agent still on show).
  const at = new Map();
  rows.forEach(function (m, i) {
    if (!m || typeof m.head !== 'string' || m.head === '') return;
    if (m.kind === 'embed') at.set(m.head, i);
    else if (m.kind === 'unembed') at.delete(m.head);
  });
  const frag = document.createDocumentFragment();
  rows.forEach(function (m, i) {
    if (!m || m.kind === 'notice') return;
    if (m.kind === 'embed' || m.kind === 'unembed') {
      if (m.kind === 'embed' && at.get(m.head) === i && !c.cards.has(m.head)) frag.appendChild(cardEl(c, m.head));
      return;
    }
    frag.appendChild(bubble(m.role === 'user' ? 'user' : 'assistant', m.head));
  });
  c.transcript.prepend(frag);
  scrollChat(c);
}

// ---- chat cards: an `embed {id}` row of the history is the panel of that agent, drawn
// in the chat where the row sits. Pure parts first.
const CARD_MIN = 120;        // the shortest a card gets, in px
const CARD_MAX = 1200;       // the tallest (fantastic's CHAT_CARD_MAX_HEIGHT); more scrolls inside
const CARD_START = 200;      // until the panel reports its height

// The agent ids on show, oldest first: an embed adds its agent once, an unembed removes it.
// A row without a string id is ignored. The same rule as ai_core's embed::cards.
function cardsOf(rows) {
  const out = [];
  (Array.isArray(rows) ? rows : []).forEach(function (m) {
    if (!m || (m.kind !== 'embed' && m.kind !== 'unembed')) return;
    if (typeof m.head !== 'string' || m.head === '') return;
    const at = out.indexOf(m.head);
    if (at >= 0) out.splice(at, 1);
    if (m.kind === 'embed') out.push(m.head);
  });
  return out;
}

// The height of a card around a panel that measured `measured` px.
function cardBox(measured) {
  if (typeof measured !== 'number' || !isFinite(measured)) return CARD_START;
  return Math.min(Math.max(Math.ceil(measured), CARD_MIN), CARD_MAX);
}

// What a card's iframe loads (web/card_connector.js, served as card.js on the same port):
// `fantastic.send` and `fantastic.watch` by postMessage, and the height the panel wants.
const CARD_CONNECTOR = '<' + 'script src="/team_page/file/card.js"></' + 'script>';

// One card: a header (the agent id, an X that hides it in this page only) and the body.
function cardEl(c, id) {
  const k = { id: id, el: el('div', 'chat-card'), body: null, frame: null, offs: new Map() };
  k.el.dataset.agent = id;
  const head = el('div', 'card-head');
  head.appendChild(el('span', 'name', id));
  const x = el('button', '', '\u00d7');
  x.type = 'button';
  x.title = 'Hide this card';
  x.setAttribute('aria-label', 'Hide the card of ' + id);
  x.addEventListener('click', function () { k.el.hidden = true; });
  head.appendChild(x);
  k.body = el('div', 'card-note', 'loading\u2026');
  k.el.appendChild(head);
  k.el.appendChild(k.body);
  c.cards.set(id, k);
  fillCard(c, k);
  return k.el;
}

// The host's own `get_html` is the card's panel; a host that is gone says so.
async function fillCard(c, k) {
  let r;
  try {
    r = await askNode(k.id, { type: 'get_html' });
  } catch (err) {
    r = { error: String(err && err.message ? err.message : err) };
  }
  if (chat !== c || c.cards.get(k.id) !== k) return;
  if (!r || r.error || typeof r.html !== 'string') {
    const err = r && r.error ? String(r.error) : '';
    const gone = (r && r.reason === 'not_found') || /not[ _]found|no such agent|unknown agent/i.test(err);
    k.body.textContent = gone ? 'deleted' : (err || 'no panel');
    return;
  }
  const f = el('iframe', '');
  f.setAttribute('sandbox', 'allow-scripts');
  f.setAttribute('title', k.id);
  f.setAttribute('height', String(cardBox(CARD_START)));
  f.srcdoc = r.html + CARD_CONNECTOR;
  k.body.remove();
  k.body = null;
  k.el.appendChild(f);
  k.frame = f;
}

function postToCard(k, msg) {
  try {
    if (k.frame && k.frame.contentWindow) k.frame.contentWindow.postMessage(msg, '*');
  } catch (e) { /* the card is gone */ }
}

// A card's panel asks the page for `send` / `watch`: only for its own host agent; the
// team's grant on the leg (the panel's verbs and watch) is what the host lets through.
function onCardMessage(e) {
  const c = chat;
  const m = e && e.data;
  if (!c || !c.cards || !m || typeof m !== 'object') return;
  let k = null;
  c.cards.forEach(function (x) { if (x.frame && x.frame.contentWindow === e.source) k = x; });
  if (!k) return;
  if (m.t === 'size') {
    k.frame.setAttribute('height', String(cardBox(Number(m.h))));
  } else if (m.t === 'send') {
    if (m.id !== k.id || !m.payload || typeof m.payload.type !== 'string') {
      postToCard(k, { t: 'reply', n: m.n, error: 'a card may only call its own agent' });
      return;
    }
    askNode(k.id, m.payload).then(
      function (r) { postToCard(k, { t: 'reply', n: m.n, reply: r }); },
      function (err) { postToCard(k, { t: 'reply', n: m.n, error: String(err && err.message ? err.message : err) }); });
  } else if (m.t === 'watch') {
    if (m.id !== k.id || typeof fantastic === 'undefined' || !fantastic || typeof fantastic.watch !== 'function') return;
    k.offs.set(m.n, fantastic.watch(k.id, function (ev) { postToCard(k, { t: 'event', n: m.n, ev: ev }); }));
  } else if (m.t === 'unwatch') {
    const off = k.offs.get(m.n);
    k.offs.delete(m.n);
    if (typeof off === 'function') off();
  }
}
window.addEventListener('message', onCardMessage);

function dropCard(c, k) {
  k.offs.forEach(function (off) { try { if (typeof off === 'function') off(); } catch (e) { /* gone */ } });
  k.offs.clear();
  k.el.remove();
  c.cards.delete(k.id);
}

function disposeCards(c) {
  if (!c.cards) return;
  Array.from(c.cards.values()).forEach(function (k) { dropCard(c, k); });
}

// After a turn the history is read again: a new embed gets its card (after `open` made
// the host callable by this page), an unembedded one loses it.
async function syncCards(c) {
  const rows = await readRows(c);
  if (!rows || chat !== c) return;
  const live = cardsOf(rows);
  Array.from(c.cards.values()).forEach(function (k) {
    if (live.indexOf(k.id) < 0) dropCard(c, k);
  });
  const fresh = live.filter(function (id) { return !c.cards.has(id); });
  if (!fresh.length) return;
  try { await ask({ type: 'open', node: c.node }); } catch (err) { /* the cards say what failed */ }
  if (chat !== c) return;
  fresh.forEach(function (id) { c.transcript.appendChild(cardEl(c, id)); });
  scrollChat(c);
}

// A part or a done belongs to this page's turn: the same client, and the agent
// it came from when it names one.
function ownEvent(c, ev) {
  return ev.client_id === chatClient && (!ev.source || ev.source === c.node);
}

// The stream: one draft per stream_id. A delta only grows its draft; the part's
// end settles it; an abort marks it as not sent. A `thinking` part is a collapsed
// block, a `call` part is not drawn (the tool block of its status covers it).
// `done` ends the turn, re-enables Send and looks for the agent's open questions.
function onChatEvent(c, ev) {
  if (!ev || typeof ev !== 'object') return;
  if (ev.type === 'done') {
    if ((!ev.client_id || ev.client_id === chatClient) && (!ev.source || ev.source === c.node)) {
      finishTurn(c);
      scheduleInquiries(c);
      syncCards(c);
    }
    return;
  }
  if (!ownEvent(c, ev)) return;
  if (ev.type === 'status') { onStatus(c, ev); return; }
  const id = String(ev.stream_id);
  if (ev.type === 'part_start') {
    if (ev.kind === 'text') {
      const node = bubble('assistant', '');
      c.transcript.appendChild(node);
      c.drafts.set(id, { el: node, target: node, text: '', kind: 'text' });
    } else if (ev.kind === 'thinking') {
      const box = el('details', 'msg thinking');
      box.appendChild(el('summary', '', 'thinking'));
      const body = el('div', 'thinking-body');
      box.appendChild(body);
      c.transcript.appendChild(box);
      c.drafts.set(id, { el: box, target: body, text: '', kind: 'thinking', summary: box.children[0], t0: Date.now() });
    } else {
      return;
    }
    c.live = true;
    scrollChat(c);
  } else if (ev.type === 'part_delta') {
    const d = c.drafts.get(id);
    if (!d) return;
    d.text += ev.text == null ? '' : String(ev.text);
    d.target.textContent = d.text;
    scrollChat(c);
  } else if (ev.type === 'part_end') {
    const d = c.drafts.get(id);
    if (!d) return;
    c.drafts.delete(id);
    if (d.kind === 'thinking') {
      if (d.text.trim() === '') { d.el.remove(); return; }
      d.summary.textContent = 'thought for ' + Math.max(0, Math.round((Date.now() - d.t0) / 1000)) + 's';
    }
    if (ev.ok === false) d.el.classList.add('not-sent');
  } else if (ev.type === 'part_abort') {
    const d = c.drafts.get(id);
    if (!d) return;
    c.drafts.delete(id);
    d.el.classList.add('not-sent');
  }
}

// A status event: a tool call is one block; the done status carries the stats.
function onStatus(c, ev) {
  const d = ev.detail && typeof ev.detail === 'object' ? ev.detail : {};
  if (ev.phase === 'tool_calling' && d.tool) {
    c.live = true;
    toolBlock(c, d.tool);
  } else if (ev.phase === 'done') {
    showStats(c, d);
    scheduleInquiries(c);
  }
}

function previewText(v) {
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v); } catch (e) { return String(v); }
}

// One block per call_id: pending while the call runs, done once its reply preview
// is there. The reply is text in a collapsed details body.
function toolBlock(c, tool) {
  if (!tool || typeof tool !== 'object') return null;
  const key = tool.call_id != null ? String(tool.call_id) : null;
  let b = key != null ? c.tools.get(key) : null;
  if (!b) {
    const box = el('details', 'tool-block');
    const sum = el('summary', '');
    const head = el('span', 'tool-head');
    const mark = el('span', 'tool-mark');
    sum.appendChild(head);
    sum.appendChild(mark);
    const reply = el('div', 'tool-reply');
    box.appendChild(sum);
    box.appendChild(reply);
