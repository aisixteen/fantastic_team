<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg">
<title>Team</title>
<style>
  /* No colour, font or radius is written here: the day skin's tokens (--fc-color-*, --fc-font-family-*,
     --fc-radius-*, --fc-shadow-*) are the base views' one block, served ahead of this sheet as page.css. */
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--fc-color-page-bg); }
  body { margin: 0; min-height: 100vh; background: transparent; color: var(--fc-color-text-primary); font: 13px/1.45 var(--fc-font-family-sans); -webkit-font-smoothing: antialiased; }

  /* Two cells side by side; when they no longer fit (a phone) they stack into one column. */
  #layout { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; padding: 12px; min-height: 100vh; }
  .cell { min-width: 0; min-height: calc(100vh - 24px); display: flex; flex-direction: column; padding: 0 6px 6px; border: 1px solid var(--fc-color-line-button); border-radius: 16px; background: var(--fc-color-surface-raised); box-shadow: var(--fc-shadow-bubble); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #col-left { flex: 1 1 376px; }
  #col-right { flex: 3 1 560px; }
  .head { flex: none; display: flex; align-items: center; height: 32px; padding: 0 6px; font: 600 11px/1 var(--fc-font-family-mono); letter-spacing: .5px; text-transform: uppercase; color: var(--fc-color-text-muted); }
  .body { flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; }
  /* The base sidebar view fills the left cell; the opened agent's view fills the right one. */
  .body { position: relative; }
  .body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  .opened { padding: 12px; font: 13px/1.45 var(--fc-font-family-sans); }
  .card { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 16px; }
  .card .name { font-size: 15px; font-weight: 600; color: var(--fc-color-text-primary); overflow-wrap: anywhere; }
  .card .tag { padding: 0 8px; border-radius: var(--fc-radius-chip); background: var(--fc-color-surface-button); box-shadow: inset 0 0 0 1px var(--fc-color-line-faint); font: 11px/20px var(--fc-font-family-mono); color: var(--fc-color-text-muted); }
  .card .note { color: var(--fc-color-text-muted); }
  .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title .sep { opacity: .55; }
  .title .dim { opacity: .55; }
  .dots { display: none; flex: none; align-items: center; justify-content: center; min-height: 34px; padding: 4px 12px 14px; border-top: 1px solid var(--fc-color-line-button); background: var(--fc-color-surface-well); }
  .dots span { display: flex; gap: 6px; }
  .dots i { display: block; width: 6px; height: 6px; border-radius: 3px; background: var(--fc-color-line-strong); }
  .dots i.on { width: 16px; background: var(--fc-color-accent-base); }
  .back { position: relative; display: none; flex: none; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--fc-color-text-muted); cursor: pointer; }
  .back .badge { position: absolute; top: 4px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--fc-radius-pill); background: var(--fc-color-accent-base); color: var(--fc-color-accent-on); font: 600 10px/16px var(--fc-font-family-mono); text-align: center; }
  .back .badge[hidden] { display: none; }
  .back:hover { background: var(--fc-color-surface-hover); }
  .back:focus-visible { outline: 2px solid var(--fc-color-accent-base); outline-offset: 2px; }
  @media (max-width: 972px) {
    .cell { min-height: 320px; }
  }
  /* A phone: one column, one panel at a time. The tree is the first panel; picking an agent shows
     its view, and the back button returns to the tree. */
  @media (max-width: 760px) {
    #layout { display: block; padding: 0; min-height: 100vh; }
    .cell { min-height: 100vh; height: 100vh; padding: 0; border: 0; border-radius: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    @supports (height: 100dvh) { .cell { min-height: 100dvh; height: 100dvh; } }
    .body { border-radius: 0; }
    .dots { display: flex; }
    #layout[data-panel="tree"] #col-right, #layout[data-panel="agent"] #col-left { display: none; }
    #col-right .head { display: flex; padding: 8px 12px 10px 6px; height: auto; border-bottom: 1px solid var(--fc-color-line-button); }
    .back { display: grid; }
  }
</style>
</head>
<body>
<div id="layout" data-panel="tree">
  <section id="col-left" class="cell" aria-label="Agents">
    <div class="head"><span class="title" id="title"><span>team</span></span></div>
    <div class="body" id="body-left"></div>
    <div class="dots"><span role="img" aria-label="Panel 1 of 2: the team"><i class="on"></i><i></i></span></div>
  </section>
  <section id="col-right" class="cell" aria-label="View">
    <div class="head"><button type="button" class="back" id="back" aria-label="Back to the team"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg><span class="badge" id="back-badge" hidden></span></button><span class="title" id="crumb"></span></div>
    <div class="body" id="body-right"></div>
    <div class="dots"><span role="img" aria-label="Panel 2 of 2: the agent"><i></i><i class="on"></i></span></div>
  </section>
</div>
<script>
  // THE LEFT CELL is the base's sidebar view (the agent `sidebar`, its `reflect`), the one tree the
  // canvas draws too. The relay that runs a view in a sandboxed iframe is the base's one module
  // (`view_relay.js`, served beside this page): the view reaches the team ONLY through it, gated by the
  // view's own `calls` (the leg's grants are the second gate). A click on an agent row opens it in the
  // right cell. Nothing from the kernel is put in as markup: the view is a srcdoc, the rest text.
  (function () {
    var SIDEBAR = 'sidebar', CELL = 'view_sidebar';
    // pure
    // The agents, other than `except`, with an open inquiry for the person (the data the sidebar's
    // "Waiting for you" lists: `user` `inquiries`, one row per open inquiry, each with its `asker`).
    function waitingCount(inq, except) {
      var askers = {};
      (Array.isArray(inq) ? inq : []).forEach(function (q) {
        if (q && typeof q.asker === 'string' && q.asker !== except) askers[q.asker] = true;
      });
      return Object.keys(askers).length;
    }
    // An inquiry to the person opened or closed: the event `user` publishes on its own id
    // (`{type, re, asker, holder: 'user'}`). A watcher of `user` also gets a COPY of every call
    // made to it (this page's own `inquiries` read, another client's `answer_inquiry {re}`): only
    // the event names its holder and carries a numeric `re` beside it, and only the event counts.
    function inquiryEvent(ev) {
      return !!ev && typeof ev === 'object' && (ev.type === 'inquiry_opened' || ev.type === 'inquiry_closed') &&
        ev.holder === 'user' && typeof ev.re === 'number';
    }
    // What the name card of an agent with no view of its own says, from its reflect.
    function cardOf(id, r, bundle) {
      var name = r && typeof r.display_name === 'string' && r.display_name ? r.display_name : id;
      var tag = r && typeof r.handler_module === 'string' ? r.handler_module : (typeof bundle === 'string' ? bundle : '');
      return { name: name, tag: tag, note: 'This agent has no view of its own.' };
    }
    // end pure
    document.documentElement.setAttribute('data-ready', '1');

    // The page's end of the relay: sends and watches go over the leg (shim.js).
    var transport = {
      send: function (target, payload) { return window.fantastic.send(target, payload); },
      watch: function (src, deliver) { return { off: window.fantastic.watch(src, deliver) }; }
    };
    var right = document.getElementById('body-right');
    var left = document.getElementById('body-left');
    var layout = document.getElementById('layout');

    // The panel a phone shows: the tree, or the opened agent. A wide page shows both and ignores it.
    function panel(which) { layout.setAttribute('data-panel', which); }
    document.getElementById('back').addEventListener('click', function () { panel('tree'); });

    // The back button's badge: how many other agents wait for the person (`user` `inquiries`, read as
    // the page leg). Asked when an agent opens, then again on each inquiry the person's `user` publishes
    // as opened or closed (never on a copy of a call, never on a clock); a refusal leaves it hidden.
    // One read at a time: an event that lands while a read is out reads once more when it is back.
    var badge = document.getElementById('back-badge');
    var waiting = { except: '', busy: false, again: false };
    function showWaiting(except) {
      waiting.except = except;
      if (waiting.busy) { waiting.again = true; return; }
      waiting.busy = true; waiting.again = false;
      var done = function () { waiting.busy = false; if (waiting.again) showWaiting(waiting.except); };
      window.fantastic.send('user', { type: 'inquiries' }).then(function (r) {
        var n = waitingCount(r && r.inquiries, waiting.except);
        badge.textContent = String(n);
        badge.hidden = n === 0;
        document.getElementById('back').setAttribute('aria-label',
          n === 0 ? 'Back to the team' : 'Back to the team, ' + n + ' waiting for you');
      }, function () { badge.hidden = true; }).then(done, done);
    }
    window.fantastic.watch('user', function (ev) {
      if (inquiryEvent(ev)) showWaiting(waiting.except);
    });

    // The title bar: the product word and the kernel's own name (the root's display_name).
    window.fantastic.send('kernel', { type: 'reflect' }).then(function (r) {
      var n = r && (r.display_name || r.id);
      if (typeof n !== 'string' || !n) return;
      var t = document.getElementById('title');
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = ' / ';
      t.appendChild(sep);
      t.appendChild(document.createTextNode(n));
    }, function () { /* the leg may not reflect the root: the title stays "team" */ });

    function viewOf(r) {
      var v = r && r.view;
      return v && v.kind === 'html' && typeof v.bytes === 'string' ? v : null;
    }

    // What the right cell draws for `r`, the reply of an agent's `reflect`: its html view, or the name card
    // of an agent with none.
    function draw(relay, id, r, bundle) {
      var v = viewOf(r);
      right.textContent = '';
      if (!v) {
        var c = cardOf(id, r, bundle), card = document.createElement('div');
        card.className = 'opened card';
        [['name', c.name], ['tag', c.tag], ['note', c.note]].forEach(function (p) {
          if (!p[1]) return;
          var e = document.createElement('div');
          e.className = p[0];
          e.textContent = p[1];
          card.appendChild(e);
        });
        right.appendChild(card);
        return null;
      }
      return relay.mountView({ mount: right, html: v.bytes, transport: transport, calls: v.calls || {}, cell: 'view_' + id });
    }

    // The handler module (bundle) of agent `id`, from the root's `list_agents`; '' when the leg may not read it.
    function bundleOf(id) {
      return window.fantastic.send('kernel', { type: 'list_agents' }).then(function (r) {
        var a = (r && Array.isArray(r.agents) ? r.agents : []).filter(function (x) { return x && x.id === id; })[0];
        return a && typeof a.handler_module === 'string' ? a.handler_module : '';
      }, function () { return ''; });
    }

    // Open the agent `id` (or, for a file, the view agent `via` made for it) in the right cell. The agent's own
    // `reflect` is asked first: the page leg's grants are the records' (the yaml declares each view's calls).
    // Only a refusal asks the dispatcher's `open` once (it grants the leg the chat of an agent made since) and
    // reflects again; the dispatcher may not exist, and a team whose records grant everything never needs it.
    function open(relay, id, via) {
      var shown = null;
      right.setAttribute('data-open', id);
      panel('agent');
      showWaiting(id);
      right.textContent = '';
      var note = document.createElement('div');
      note.className = 'opened';
      note.textContent = id;
      right.appendChild(note);
      function mine() { return right.getAttribute('data-open') === id; }
      function refused(r) { return !r || (typeof r.error === 'string' && r.error !== ''); }
      var target = Promise.resolve(via ? via() : id);
      target.then(function (t) {
        var open = function () { return window.fantastic.send('dispatcher', { type: 'open', node: t }).catch(function () {}); };
        // a refusal is an error frame or a reply with an `error`: both are `null` here
        var reflect = function () { return window.fantastic.send(t, { type: 'reflect' }).catch(function () { return null; }); };
        // a file's view agent is new: the dispatcher grants the leg its reads before the first `reflect`
        if (via) return open().then(reflect);
        return reflect().then(function (r) { return refused(r) ? open().then(reflect) : r; });
      }).then(function (r) {
        if (!mine() || refused(r)) return; // the page leg may not reflect this agent: the bare id stays
        if (viewOf(r) || (r && r.handler_module)) { shown = draw(relay, id, r); return; }
        // an agent with no view whose reflect does not name its bundle (a bridge's): the card gets the bundle
        // from the kernel's own record of the agent (`list_agents`, the leg's read of the root)
        return bundleOf(id).then(function (b) { if (mine()) shown = draw(relay, id, r, b); });
      }, function () { /* the bare id stays */ });
      return function () { if (shown) shown.unmount(); };
    }

    // A file row: the files agent makes (or reuses) the view agent of the path; that agent's `reflect` is the
    // file view. The row's id for the cell is the path.
    function openFile(relay, path) {
      return open(relay, path, function () {
        return window.fantastic.send('files', { type: 'open_view', kind: 'file', path: path }).then(function (r) {
          if (!r || typeof r.id !== 'string') throw new Error('no view for ' + path);
          return r.id;
        });
      });
    }

    import('./view_relay.js').then(function (relay) {
      return window.fantastic.send(SIDEBAR, { type: 'reflect' }).then(function (got) {
        var v = viewOf(got);
        if (!v) return; // no sidebar agent: no column
        var closeOpened = function () {};
        relay.mountView({
          mount: left, html: v.bytes, transport: transport, calls: v.calls || {}, cell: CELL, keep: relay.pageStore('team.sidebar'),
          // what the view says is the base's `hearSidebar`; the team page has no canvas to open a file on and
          // its cell does not hide: a row's `select` opens that agent, a file row's `select_file` that file
          onMessage: function (m) {
            relay.hearSidebar(m, {
              select: function (id) { closeOpened(); closeOpened = open(relay, id); },
              selectPath: function (path) { closeOpened(); closeOpened = openFile(relay, path); }
            });
          }
        });
      });
    }).catch(function () { /* the connection to the team is down: the cell stays empty */ });
  })();
  // THE RIGHT CELL'S TITLE BAR: the opened agent's path, `lead / cluster ops / k-rollout` (the mock's
  // breadcrumb): the ancestors dimmed, the agent itself plain. It follows the right cell's `data-open`
  // and reads each ancestor's `reflect` (display_name, parent_id) as the page leg; a refusal ends the path.
  (function () {
    // pure
    // The path of names from the ancestors down to the agent: `chain` is [{name}] outermost first.
    function crumbOf(chain) {
      return (Array.isArray(chain) ? chain : []).map(function (c) { return c && typeof c.name === 'string' ? c.name : ''; })
        .filter(function (n) { return n !== ''; });
    }
    // end pure
    var right = document.getElementById('body-right'), crumb = document.getElementById('crumb');
    function paint(names) {
      crumb.textContent = '';
      names.forEach(function (n, i) {
        var last = i === names.length - 1, e = document.createElement('span');
        e.textContent = n + (last ? '' : ' / ');
        if (!last) e.className = 'dim';
        crumb.appendChild(e);
      });
    }
    function walk(id, chain, seen) {
      return window.fantastic.send(id, { type: 'reflect' }).then(function (r) {
        var name = r && (r.display_name || r.id);
        chain.unshift({ name: typeof name === 'string' && name ? name : id });
        var up = r && typeof r.parent_id === 'string' ? r.parent_id : '';
        if (up && up !== 'kernel' && up !== id && !seen[up] && chain.length < 6) { seen[up] = true; return walk(up, chain, seen); }
        return chain;
      }, function () { if (chain.length === 0) chain.unshift({ name: id }); return chain; });
    }
    new MutationObserver(function () {
      var id = right.getAttribute('data-open');
      if (!id) { paint([]); return; }
      paint([id]);
      var seen = {}; seen[id] = true;
      walk(id, [], seen).then(function (chain) {
        if (right.getAttribute('data-open') === id) paint(crumbOf(chain));
      });
    }).observe(right, { attributes: true, attributeFilter: ['data-open'] });
  })();
</script>
</body>
</html>
