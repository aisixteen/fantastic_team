<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg">
<title>Team</title>
<style>
  /* Day tokens (the design's light block). Panels stay glassy over the page ground. */
  :root {
    --fc-bg: #EDEDED;
    --fc-page: radial-gradient(circle at 1px 1px, rgb(0 0 0 / .14) 1px, transparent 1.6px) 0 0 / 22px 22px,
      radial-gradient(70% 55% at 12% -5%, #fff 0, transparent 70%),
      radial-gradient(55% 60% at 105% 105%, rgb(0 0 0 / .16) 0, transparent 70%),
      #EDEDED;
    --fc-panel: rgb(255 255 255 / .58);
    --fc-line: rgb(0 0 0 / .10);
    --fc-text: #0B0B0B;
    --fc-head: rgb(0 0 0 / .70);
    --fc-shadow-bezel: 0 10px 30px rgb(0 0 0 / .10), 0 1px 2px rgb(0 0 0 / .06);
    --fc-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --fc-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--fc-bg); }
  body { margin: 0; min-height: 100vh; background: var(--fc-page); color: var(--fc-text); font: 13px/1.45 var(--fc-sans); -webkit-font-smoothing: antialiased; }

  /* Two cells side by side; when they no longer fit (a phone) they stack into one column. */
  #layout { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; padding: 12px; min-height: 100vh; }
  .cell { min-width: 0; min-height: calc(100vh - 24px); display: flex; flex-direction: column; padding: 0 6px 6px; border: 1px solid var(--fc-line); border-radius: 16px; background: var(--fc-panel); box-shadow: var(--fc-shadow-bezel); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #col-left { flex: 1 1 376px; }
  #col-right { flex: 3 1 560px; }
  .head { flex: none; display: flex; align-items: center; height: 32px; padding: 0 6px; font: 600 11px/1 var(--fc-mono); letter-spacing: .5px; text-transform: uppercase; color: var(--fc-head); }
  .body { flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; }
  /* The base sidebar view fills the left cell; the opened agent's view fills the right one. */
  .body { position: relative; }
  .body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  .opened { padding: 12px; font: 13px/1.45 var(--fc-sans); }
  @media (max-width: 972px) {
    .cell { min-height: 320px; }
  }
</style>
</head>
<body>
<div id="layout">
  <section id="col-left" class="cell" aria-label="Agents">
    <div class="head">Agents</div>
    <div class="body" id="body-left"></div>
  </section>
  <section id="col-right" class="cell" aria-label="View">
    <div class="head">View</div>
    <div class="body" id="body-right"></div>
  </section>
</div>
<script>
  // THE LEFT CELL is the base's sidebar view (the agent `sidebar`, its `reflect`), the one tree the
  // canvas draws too. The relay that runs a view in a sandboxed iframe is the base's one module
  // (`view_relay.js`, served beside this page): the view reaches the team ONLY through it, gated by the
  // view's own `calls` (the leg's grants are the second gate). A click on an agent row opens it in the
  // right cell. Nothing from the kernel is put in as markup: the view is a srcdoc, the rest text.
  (function () {
    var SIDEBAR = 'sidebar', CELL = 'view_sidebar';
    document.documentElement.setAttribute('data-ready', '1');

    // The page's end of the relay: sends and watches go over the leg (shim.js).
    var transport = {
      send: function (target, payload) { return window.fantastic.send(target, payload); },
      watch: function (src, deliver) { return { off: window.fantastic.watch(src, deliver) }; }
    };
    var right = document.getElementById('body-right');
    var left = document.getElementById('body-left');

    function viewOf(r) {
      var v = r && r.view;
      return v && v.kind === 'html' && typeof v.bytes === 'string' ? v : null;
    }

    function open(relay, id) {
      var shown = null;
      right.setAttribute('data-open', id);
      right.textContent = '';
      var note = document.createElement('div');
      note.className = 'opened';
      note.textContent = id;
      right.appendChild(note);
      // the dispatcher's `open` grants the leg the chat's calls on an agent of the team (the view's own
      // list); a refusal just means the page has no more than it had
      window.fantastic.send('dispatcher', { type: 'open', node: id }).catch(function () {}).then(function () {
        return window.fantastic.send(id, { type: 'reflect' });
      }).then(function (r) {
        var v = viewOf(r);
        if (right.getAttribute('data-open') !== id || !v) return;
        right.textContent = '';
        shown = relay.mountView({ mount: right, html: v.bytes, transport: transport, calls: v.calls || {}, cell: 'view_' + id });
      }, function () { /* the page leg may not reflect this agent: the row's name stays */ });
      return function () { if (shown) shown.unmount(); };
    }

    import('./view_relay.js').then(function (relay) {
      return window.fantastic.send(SIDEBAR, { type: 'reflect' }).then(function (got) {
        var v = viewOf(got);
        if (!v) return; // no sidebar agent: no column
        var closeOpened = function () {};
        relay.mountView({
          mount: left, html: v.bytes, transport: transport, calls: v.calls || {}, cell: CELL, keep: relay.pageStore('team.sidebar'),
          // what the view says is the base's `hearSidebar`; the team page has no canvas to open a file on and
          // its cell does not hide, so a row's `select` is the one thing it hears
          onMessage: function (m) {
            relay.hearSidebar(m, { select: function (id) { closeOpened(); closeOpened = open(relay, id); } });
          }
        });
      });
    }).catch(function () { /* the connection to the team is down: the cell stays empty */ });
  })();
</script>
</body>
</html>
