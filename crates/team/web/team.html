    c.transcript.appendChild(box);
    b = { el: box, head: head, mark: mark, reply: reply };
    if (key != null) c.tools.set(key, b);
  }
  b.head.textContent = String(tool.verb == null ? '' : tool.verb) + '(' + String(tool.target == null ? '' : tool.target) + ') ';
  const done = tool.reply_preview != null;
  b.el.dataset.state = done ? 'done' : 'pending';
  b.mark.textContent = done ? '\u2713' : '\u2026';
  if (done) b.reply.textContent = previewText(tool.reply_preview);
  scrollChat(c);
  return b;
}

function kfmt(n, est) {
  const v = n >= 1000 ? Math.round(n / 1000) + 'k' : String(Math.round(n));
  return (est ? '~' : '') + v;
}

// The stats line in the chat header, from the done status's detail: tokens per
// second, and the prompt against the context window. `~` marks an estimate.
function showStats(c, d) {
  if (!c.stats || !d || typeof d !== 'object') return;
  const parts = [];
  if (typeof d.completion_tokens === 'number' && typeof d.gen_seconds === 'number' && d.gen_seconds > 0) {
    parts.push((d.completion_tokens_estimated === true ? '~' : '') + Math.round(d.completion_tokens / d.gen_seconds) + ' tok/s');
  }
  if (typeof d.prompt_tokens === 'number' && typeof d.context_window === 'number') {
    parts.push(kfmt(d.prompt_tokens, d.prompt_tokens_estimated === true) + ' / ' +
      kfmt(d.context_window, d.context_window_estimated === true) + ' ctx');
  }
  if (parts.length) c.stats.textContent = parts.join(' \u00b7 ');
}

// The agent's open questions for the person, read once on open and after a turn
// (debounced). Each unseen one is drawn once, as a card with its own controls.
function scheduleInquiries(c) {
  if (c.timer != null) clearTimeout(c.timer);
  c.timer = setTimeout(function () { c.timer = null; loadInquiries(c); }, INQUIRY_DELAY);
}

async function loadInquiries(c) {
  let r;
  try {
    r = await askNode('user', { type: 'inquiries', asker: c.node });
  } catch (err) {
    return;
  }
  if (chat !== c || !r || r.error || !Array.isArray(r.inquiries)) return;
  r.inquiries.forEach(function (q) {
    if (!q || q.re == null || c.inquiries.has(q.re)) return;
    c.inquiries.add(q.re);
    c.transcript.appendChild(inquiryCard(c, q));
  });
  scrollChat(c);
}

function optionOf(o) {
  if (o && typeof o === 'object') {
    const v = o.value != null ? o.value : o.label;
    return { value: v, label: String(o.label != null ? o.label : v) };
  }
  return { value: o, label: String(o) };
}

function inquiryCard(c, q) {
  const card = el('div', 'msg inquiry');
  card.dataset.re = String(q.re);
  card.appendChild(el('div', 'inq-text', q.text));
  const controls = el('div', 'inq-controls');
  const err = el('div', 'inq-error');
  const widgets = [];
  function lock(on) { widgets.forEach(function (w) { w.disabled = on; }); }
  async function answer(value, label) {
    lock(true);
    err.textContent = '';
    let r;
    try {
      r = await askNode('user', { type: 'answer_inquiry', re: q.re, answer: value });
    } catch (e) {
      r = { error: String(e && e.message ? e.message : e) };
    }
    if (!r || r.error) {
      lock(false);
      err.textContent = r && r.error ? String(r.error) : 'the answer was not sent';
      return;
    }
    controls.remove();
    err.textContent = '';
    card.appendChild(el('div', 'inq-done', 'you answered: ' + label));
  }
  function button(label, onclick) {
    const b = el('button', '', label);
    b.type = 'button';
    b.addEventListener('click', onclick);
    widgets.push(b);
    controls.appendChild(b);
    return b;
  }
  const kind = String(q.kind || 'text');
  const opts = Array.isArray(q.options) ? q.options.map(optionOf) : [];
  if (kind === 'confirm') {
    button('Yes', function () { answer(true, 'Yes'); });
    button('No', function () { answer(false, 'No'); });
  } else if (kind === 'single') {
    opts.forEach(function (o) { button(o.label, function () { answer(o.value, o.label); }); });
  } else if (kind === 'multi') {
    const boxes = opts.map(function (o) {
      const lab = el('label', '');
      const cb = el('input', '');
      cb.type = 'checkbox';
      lab.appendChild(cb);
      lab.appendChild(el('span', '', o.label));
      widgets.push(cb);
      controls.appendChild(lab);
      return { cb: cb, o: o };
    });
    button('Answer', function () {
      const picked = boxes.filter(function (x) { return x.cb.checked; }).map(function (x) { return x.o; });
      answer(picked.map(function (o) { return o.value; }), picked.map(function (o) { return o.label; }).join(', '));
    });
  } else {
    const input = el('input', '');
    input.type = 'text';
    input.setAttribute('aria-label', 'Answer');
    widgets.push(input);
    controls.appendChild(input);
    button('Answer', function () { answer(input.value, input.value); });
  }
  card.appendChild(controls);
  card.appendChild(err);
  return card;
}

// A text file is chosen into the composer as a chip; it travels in the next send.
function chooseFile(c) {
  const f = c.file.files && c.file.files[0];
  if (!f) return;
  const reset = function () { try { c.file.value = ''; } catch (e) { /* the pick is kept in c.attached */ } };
  if (typeof f.size === 'number' && f.size > MAX_ATTACH) {
    showError('"' + f.name + '" is larger than ' + MAX_ATTACH + ' bytes: not attached');
    reset();
    return;
  }
  const reader = new FileReader();
  reader.onload = function () {
    if (chat !== c) return;
    const text = String(reader.result == null ? '' : reader.result);
    if (text.length > MAX_ATTACH || text.indexOf('\u0000') >= 0) {
      showError('"' + f.name + '" is not a text file within ' + MAX_ATTACH + ' bytes: not attached');
      return;
    }
    showError('');
    c.attached = { name: String(f.name), content: text };
    drawChip(c);
  };
  reader.onerror = function () { showError('"' + f.name + '" could not be read: not attached'); };
  reader.readAsText(f);
  reset();
}

function drawChip(c) {
  c.chip.textContent = '';
  c.chip.hidden = !c.attached;
  if (!c.attached) return;
  c.chip.appendChild(el('span', '', c.attached.name));
  const x = el('button', '', '\u00d7');
  x.type = 'button';
  x.setAttribute('aria-label', 'Remove the attachment');
  x.addEventListener('click', function () { c.attached = null; drawChip(c); });
  c.chip.appendChild(x);
}

// A turn still running when the chat opens (or a page reload): the agent's own
// `status` for this client rebuilds the question, the text so far, the last tool
// call and the queued lines, and keeps Send off until the turn's done. Nothing is
// drawn when the reply is an error or the turn is not this page's, or when the
// stream already drew something.
async function replayStatus(c) {
  let r;
  try {
    r = await askNode(c.node, { type: 'status', client_id: chatClient });
  } catch (err) {
    return;
  }
  if (chat !== c || !r || r.error) return;
  const cur = r.current;
  if (cur && typeof cur === 'object' && cur.is_mine === true && !c.live) {
    if (cur.text) c.transcript.appendChild(bubble('user', cur.text));
    if (cur.text_so_far) c.transcript.appendChild(bubble('assistant', cur.text_so_far));
    if (cur.last_tool) toolBlock(c, cur.last_tool);
    c.busy = true;
    c.send.disabled = true;
  }
  (Array.isArray(r.mine_pending) ? r.mine_pending : []).forEach(function (p) {
    if (!p || !p.text) return;
    const line = bubble('user', p.text);
    line.classList.add('pending');
    c.transcript.appendChild(line);
  });
  scrollChat(c);
}

function finishTurn(c) {
  c.busy = false;
  c.send.disabled = false;
}

// Send a turn. The user's line is shown at once, marked pending; an error reply
// or a rejected call removes it and says why in the error line. It is never shown
// as sent when it was not.
async function sendChat() {
  const c = chat;
  if (!c || c.busy) return;
  const typed = c.input.value.trim();
  const att = c.attached;
  if (!typed && !att) return;
  c.input.value = '';
  c.attached = null;
  drawChip(c);
  c.busy = true;
  c.send.disabled = true;
  const text = att ? (typed ? typed + '\n\n' : '') + '[attached: ' + att.name + ']\n' + att.content : typed;
  const line = bubble('user', typed);
  if (att) line.appendChild(el('span', 'chip', att.name));
  line.classList.add('pending');
  c.transcript.appendChild(line);
  scrollChat(c);
  let reply;
  try {
    reply = await askNode(c.node, { type: 'send', text: text, client_id: chatClient });
  } catch (err) {
    reply = { error: String(err && err.message ? err.message : err) };
  }
  if (chat !== c) return;
  if (!reply || reply.error) {
    line.remove();
    finishTurn(c);
    const why = reply && reply.error ? String(reply.error) : 'the message was not sent';
    showError(reply && reply.hint ? why + ' — ' + String(reply.hint) : why);
    return;
  }
  line.classList.remove('pending');
}

async function stopChat() {
  const c = chat;
  if (!c) return;
  try {
    const r = await askNode(c.node, { type: 'stop' });
    if (r && r.error) showError(String(r.error));
  } catch (err) {
    showError(String(err && err.message ? err.message : err));
  }
}

async function openNode(node) {
  let reply;
  try {
    reply = await ask({ type: 'open', node: node });
  } catch (err) {
    showError(String(err && err.message ? err.message : err));
    return;
  }
  if (reply && !reply.error && reply.view === 'panel') {
    showError('');
    showPanel(reply, node);
    return;
  }
  if (!reply || reply.error || reply.view !== 'chat') {
    showError(reply && reply.error ? reply.error : 'cannot open ' + node);
    return;
  }
  showError('');
  showChat(reply, node);
}

document.getElementById('sidebar').addEventListener('click', function (e) {
  const ctl = e.target && e.target.closest ? e.target.closest('[data-control]') : null;
  if (ctl) {
    if (ctl.dataset.control === 'hand_task') handTask(ctl.dataset.node);
    else control(ctl.dataset.node, ctl.dataset.control, false);
    return;
  }
  const tog = e.target && e.target.closest ? e.target.closest('[data-toggle]') : null;
  if (tog) { toggleAgent(tog.dataset.toggle); return; }
  const exp = e.target && e.target.closest ? e.target.closest('[data-expander]') : null;
  if (exp) { toggleWorker(exp.dataset.expander); return; }
  const node = e.target && e.target.closest ? e.target.closest('[data-node]') : null;
  if (node) openNode(node.dataset.node);
});

// Pack install: `install {pack, into, worker}` on the pack agent. With a worker the
// pack's evals run and the reply carries evals.pass_rate, evals.total_time_s,
// evals.total_cost, evals.text, enable.allowed and enable.reason. All of it goes
// in as text.
function packLine(box, text) { box.appendChild(el('div', '', text)); }

function showPackResult(r) {
  const box = document.getElementById('pack-result');
  box.textContent = '';
  if (!r) { packLine(box, 'no reply'); return; }
  if (r.error) packLine(box, String(r.error));
  const ev = r.evals;
  if (ev && typeof ev === 'object') {
    if (ev.skipped) packLine(box, String(ev.skipped));
    if (ev.error) packLine(box, String(ev.error));
    if (typeof ev.pass_rate === 'number') {
      packLine(box, 'Pass rate: ' + Math.round(ev.pass_rate * 100) + '%');
      packLine(box, 'Time: ' + num(ev.total_time_s).toFixed(1) + ' s');
      packLine(box, 'Cost: ' + (ev.total_cost == null ? 'n/a' : String(ev.total_cost)));
    }
    if (ev.text) packLine(box, String(ev.text));
  }
  if (r.enable && typeof r.enable === 'object') {
    packLine(box, (r.enable.allowed ? 'Enable allowed: ' : 'Enable blocked: ') + String(r.enable.reason || ''));
  }
  if (r.path) packLine(box, 'Installed at ' + String(r.path));
}

async function installPack() {
  const val = function (id) { return document.getElementById(id).value.trim(); };
  const payload = { type: 'install', pack: val('pack-pack'), into: val('pack-into'), worker: val('pack-worker') };
  if (!payload.worker) delete payload.worker;
  try {
    showPackResult(await askNode('pack', payload));
  } catch (err) {
    showError(String(err && err.message ? err.message : err));
  }
}

document.getElementById('pack-install').addEventListener('click', installPack);

// Packs panel. It draws the `browser` view-model of the pack_listing agent
// ({cards, selected?, opt_in, updates, warnings, note?}) and holds no logic of
// its own: selecting a card or flipping the opt-in asks `browser` again, and
// the buttons send the existing verbs (`show`, `updates`, `fetch` to
// pack_listing; `install` and `eval` to pack). Values go in as text only.
let packsSelected = null;

function listLine(label, items) {
  const p = el('p', '', label + ': ' + (items && items.length ? items.join(', ') : 'none'));
  return p;
}

function packAction(agent, payload) {
  askNode(agent, payload).then(function (r) {
    document.getElementById('packs-note').textContent =
      r && r.error ? String(r.error) : JSON.stringify(r).slice(0, 400);
  }).catch(function (err) {
    showError(String(err && err.message ? err.message : err));
  });
}

function drawPacks(vm) {
  document.getElementById('packs-note').textContent = vm.note || '';
  document.getElementById('packs-warnings').textContent = (vm.warnings || []).join(' ');
  document.getElementById('packs-optin').checked = !!vm.opt_in;
  const cards = document.getElementById('packs-cards');
  cards.textContent = '';
  (vm.cards || []).forEach(function (c) {
    const card = el('div', 'card' + (c.revoked ? ' revoked' : ''));
    card.dataset.pack = c.name;
    card.appendChild(el('strong', '', c.name + ' ' + c.version));
    card.appendChild(el('div', '', c.summary || ''));
    card.appendChild(el('div', 'task', (c.installed ? 'installed ' : '') + (c.revoked ? 'revoked' : '')));
    cards.appendChild(card);
  });
  const detail = document.getElementById('packs-detail');
  detail.textContent = '';
  detail.hidden = !vm.selected;
  if (vm.selected) {
    const s = vm.selected;
    const preview = s.permission_preview || {};
    detail.appendChild(el('h3', '', s.name + ' ' + s.version));
    detail.appendChild(listLine('Ports', preview.ports));
    detail.appendChild(listLine('Permissions', preview.grants));
    const decision = s.install_decision || {};
    detail.appendChild(el('p', decision.allow ? '' : 'error',
      decision.allow ? 'Install allowed' : 'Install refused: ' + (decision.reason || '')));
    const show = el('button', '', 'Show');
    show.type = 'button';
    show.dataset.act = 'show';
    const fetchBtn = el('button', '', 'Fetch');
    fetchBtn.type = 'button';
    fetchBtn.dataset.act = 'fetch';
    const install = el('button', '', 'Install');
    install.type = 'button';
    install.dataset.act = 'install';
    const evalBtn = el('button', '', 'Eval');
    evalBtn.type = 'button';
    evalBtn.dataset.act = 'eval';
    [show, fetchBtn, install, evalBtn].forEach(function (b) { detail.appendChild(b); });
  }
  const ups = document.getElementById('packs-updates');
  ups.textContent = '';
  (vm.updates || []).forEach(function (u) {
    const d = u.permission_diff || {};
    ups.appendChild(el('p', '', u.name + ' ' + u.installed_version + ' to ' + u.new_version +
      ' adds ports ' + ((d.added_ports || []).join(', ') || 'none') +
      ', grants ' + ((d.added_grants || []).join(', ') || 'none') +
      '; removes ports ' + ((d.removed_ports || []).join(', ') || 'none') +
      ', grants ' + ((d.removed_grants || []).join(', ') || 'none')));
  });
}

async function loadPacks() {
  try {
    const optIn = document.getElementById('packs-optin').checked;
    const vm = await askNode('pack_listing', { type: 'browser', selected: packsSelected, opt_in: optIn });
    if (vm && vm.error) { document.getElementById('packs-note').textContent = String(vm.error); return; }
    drawPacks(vm || {});
  } catch (err) {
    document.getElementById('packs-note').textContent = String(err && err.message ? err.message : err);
  }
}

document.getElementById('packs-optin').addEventListener('change', loadPacks);
document.getElementById('packs-cards').addEventListener('click', function (e) {
  const card = e.target && e.target.closest ? e.target.closest('[data-pack]') : null;
  if (card) { packsSelected = card.dataset.pack; loadPacks(); }
});
document.getElementById('packs-detail').addEventListener('click', function (e) {
  const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b || !packsSelected) return;
  if (b.dataset.act === 'show') packAction('pack_listing', { type: 'show', name: packsSelected });
  else if (b.dataset.act === 'fetch') {
    const hash = window.prompt('Pinned hash of ' + packsSelected + ':');
    const stage = hash ? window.prompt('Stage folder:') : null;
    if (hash && stage) packAction('pack_listing', { type: 'fetch', name: packsSelected, hash: hash, stage: stage });
  } else if (b.dataset.act === 'install') {
    const pack = window.prompt('Pack folder to install:');
    const into = pack ? window.prompt('Templates folder:') : null;
    if (pack && into) packAction('pack', { type: 'install', pack: pack, into: into });
  } else if (b.dataset.act === 'eval') {
    const pack = window.prompt('Pack folder:');
    const worker = pack ? window.prompt('Worker agent id:') : null;
    if (pack && worker) packAction('pack', { type: 'eval', pack: pack, worker: worker });
  }
});

document.getElementById('collapse-tree').addEventListener('click', function () {
  setTreeCollapsed(!document.getElementById('layout').classList.contains('collapsed'), true);
});
try {
  if (localStorage.getItem(TREE_KEY) === '1') setTreeCollapsed(true, false);
} catch (e) { /* not remembered */ }

loadSidebar();
loadPacks();
</script>
</body>
