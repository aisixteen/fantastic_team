<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.svg">
<title>Team</title>
<style>
  /* Day tokens (the design's light block). Panels stay glassy over the page ground. */
  :root {
    --fc-bg: #EDEDED;
    --fc-page: radial-gradient(circle at 1px 1px, rgb(0 0 0 / .14) 1px, transparent 1.6px) 0 0 / 22px 22px,
      radial-gradient(70% 55% at 12% -5%, #fff 0, transparent 70%),
      radial-gradient(55% 60% at 105% 105%, rgb(0 0 0 / .16) 0, transparent 70%),
      #EDEDED;
    --fc-panel: rgb(255 255 255 / .58);
    --fc-line: rgb(0 0 0 / .10);
    --fc-text: #0B0B0B;
    --fc-head: rgb(0 0 0 / .70);
    --fc-shadow-bezel: 0 10px 30px rgb(0 0 0 / .10), 0 1px 2px rgb(0 0 0 / .06);
    --fc-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --fc-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--fc-bg); }
  body { margin: 0; min-height: 100vh; background: var(--fc-page); color: var(--fc-text); font: 13px/1.45 var(--fc-sans); -webkit-font-smoothing: antialiased; }

  /* Two cells side by side; when they no longer fit (a phone) they stack into one column. */
  #layout { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; padding: 12px; min-height: 100vh; }
  .cell { min-width: 0; min-height: calc(100vh - 24px); display: flex; flex-direction: column; padding: 0 6px 6px; border: 1px solid var(--fc-line); border-radius: 16px; background: var(--fc-panel); box-shadow: var(--fc-shadow-bezel); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  #col-left { flex: 1 1 376px; }
  #col-right { flex: 3 1 560px; }
  .head { flex: none; display: flex; align-items: center; height: 32px; padding: 0 6px; font: 600 11px/1 var(--fc-mono); letter-spacing: .5px; text-transform: uppercase; color: var(--fc-head); }
  .body { flex: 1; min-height: 0; border-radius: 10px; overflow: hidden; }
  @media (max-width: 972px) {
    .cell { min-height: 320px; }
  }
</style>
</head>
<body>
<div id="layout">
  <section id="col-left" class="cell" aria-label="Agents">
    <div class="head">Agents</div>
    <div class="body" id="body-left"></div>
  </section>
  <section id="col-right" class="cell" aria-label="View">
    <div class="head">View</div>
    <div class="body" id="body-right"></div>
  </section>
</div>
<script>
  // Both columns are empty for now; the page only marks itself ready. The connection to the
  // team (window.fantastic, from shim.js) is there for the columns to use later.
  document.documentElement.setAttribute('data-ready', '1');
</script>
</body>
</html>
