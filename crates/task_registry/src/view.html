<style>
/* The registry's own parts only: the tokens and the shared parts (head, chip, pill, section,
   kpi, table, bar, kv, code) come from the team's shared view look (team_agent_view). */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:14px 24px;border-bottom:1px solid var(--fc-color-line-button)}
.avatar{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:var(--fc-radius-panel);background:var(--fc-color-surface-well);color:var(--fc-color-text-muted)}
.avatar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.titles{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:1px}
.titles .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hero .name{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.hav{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--fc-color-surface-selected);color:var(--fc-color-text-muted)}
.hav svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tag{font:11px/18px var(--fc-font-family-mono);padding:0 7px;border-radius:var(--fc-radius-control);color:var(--fc-color-text-muted);background:var(--fc-color-surface-well)}
.pg{max-width:1040px;margin:0 auto;padding:16px 24px 24px}
.tasks .tr{--c:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);min-height:38px}
.gh{display:flex;align-items:center;gap:8px;padding:9px 14px 7px;border-top:1px solid var(--fc-color-line-button);background:var(--fc-color-surface-well)}
.gh u{display:block;width:8px;height:8px;border-radius:3px;text-decoration:none}
.gh b{font-size:12px;font-weight:600}
.gh span{font-size:12px;color:var(--fc-color-text-subtle)}
.more{width:100%;min-height:38px;padding:0 14px;border-top:1px solid var(--fc-color-line-button);font-size:12px;color:var(--fc-color-text-subtle)}
.more:hover{background:var(--fc-color-surface-hover)}
.pill[data-state=blocked]{color:var(--fc-color-status-warn);background:var(--fc-color-status-warn-surface);box-shadow:inset 0 0 0 1px var(--fc-color-status-warn-line)}
.pill[data-state=failed]{color:var(--fc-color-status-error);background:color-mix(in srgb,var(--fc-color-status-error) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fc-color-status-error) 45%,transparent)}
.pill[data-state=paused]{color:var(--fc-color-text-muted);background:transparent;box-shadow:inset 0 0 0 1px var(--fc-color-line-strong)}
.pill[data-state=waiting]{color:var(--fc-color-text-subtle);background:transparent;box-shadow:inset 0 0 0 1px var(--fc-color-line-strong)}
.pill[data-state=done]{color:var(--fc-color-status-ok);background:transparent}
.fld select{border:0;background:transparent;font:inherit;color:inherit;padding:0;max-width:220px}
select:focus-visible{outline:2px solid var(--fc-color-accent-base);outline-offset:2px}
.vt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 80px;gap:10px;padding:4px 0;border-top:1px solid var(--fc-color-line-button);font-size:12px}
.vt.th{font:600 10px/1.4 var(--fc-font-family-mono);letter-spacing:.5px;text-transform:uppercase;color:var(--fc-color-text-subtle);border-top:0}
.kv dd,pre{overflow-wrap:anywhere}
</style>
<header class="hero">
<span class="avatar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5l1.2 1.2L6.2 3.5M3 9.5l1.2 1.2l2-2.2M8.5 4.5h5M8.5 9.5h5M8.5 13h5"/></svg></span>
<div class="titles"><div class="line"><h1 class="name" id="name"></h1><span class="tag">tool</span></div><div class="sub" id="sub"></div></div>
<span class="chip" id="chip-n" hidden></span><span class="chip warn" id="chip-blocked" hidden></span>
</header>
<div class="pg">
<div class="kpis">
<div class="kpi"><span>tasks</span><b id="k-tasks">0</b><small id="k-tasks-s"></small></div>
<div class="kpi"><span>holders</span><b id="k-holders">0</b><small id="k-holders-s"></small></div>
</div>
<section class="sec" aria-label="By status"><div class="sh"><h2>By status</h2><span class="gap"></span><span class="via">list</span></div>
<div class="in" id="status-in"></div></section>
<div class="row2">
<label class="fld"><small>status</small><select id="f-status" aria-label="Only tasks in this state"></select></label>
<label class="fld"><small>holder</small><select id="f-holder" aria-label="Only this holder's tasks"></select></label>
</div>
<section class="sec" aria-label="Tasks"><div class="sh"><h2>Tasks</h2><span class="gap"></span><span class="via">list</span></div>
<div class="tbl tasks" id="tbl" role="table" aria-label="Tasks by status"></div>
<div class="empty" id="note" hidden></div></section>
<section class="sec" id="detail" aria-label="Task" hidden><div class="sh"><h2 id="d-id"></h2><span class="pill" id="d-state"></span><span class="gap"></span><span class="via">get</span></div>
<div class="in"><dl class="kv"><dt>tracker</dt><dd class="m" id="d-source"></dd><dt>holder</dt><dd class="m" id="d-holder"></dd></dl>
<div id="d-versions" hidden><div class="sub">versions</div><div id="d-vt"></div></div></div></section>
<section class="sec" id="hist" aria-label="History" hidden><div class="sh"><h2>History</h2><span class="gap"></span><span class="via">history</span></div>
<div class="in" id="h-in"></div></section>
</div>
<script>
{{helpers}}
// pure
var STATES = ["waiting", "running", "blocked", "done", "failed", "paused"];
var GROUP_ORDER = ["blocked", "failed", "running", "paused", "waiting", "done"];
var LEGEND_ORDER = ["done", "running", "blocked", "failed", "paused", "waiting"];
var LABELS = { waiting: "Waiting", running: "Running", blocked: "Blocked", done: "Done", failed: "Failed", paused: "Paused" };
// the swatch of a state: a skin token, never a colour
var SWATCH = {
  done: "var(--fc-color-status-ok)", running: "var(--fc-color-accent-base)", blocked: "var(--fc-color-status-warn)",
  failed: "var(--fc-color-status-error)", paused: "var(--fc-color-text-subtle)", waiting: "var(--fc-color-line-strong)"
};
var DONE_SHOWN = 3;
function oneLine(t) { return String(t == null ? "" : t).replace(/\s+/g, " ").trim(); }
function stateOf(t) { var s = t && typeof t.status === "string" ? t.status : ""; return STATES.indexOf(s) >= 0 ? s : "waiting"; }
function isSubtree(h) { return !!h && typeof h === "object" && typeof h.subtree === "string"; }
// a holder as text: an agent id, "subtree <root>", or "nobody"
function holderText(h) {
  if (typeof h === "string" && h !== "") return h;
  if (isSubtree(h)) return "subtree " + h.subtree;
  return "nobody";
}
// the same holder as a filter key (two tasks with one holder share it)
function holderKey(h) { return typeof h === "string" ? "a:" + h : isSubtree(h) ? "s:" + h.subtree : ""; }
function taskList(reply) { return reply && Array.isArray(reply.tasks) ? reply.tasks.filter(function (t) { return t && typeof t.id === "string"; }) : []; }
// counts per state, plus total and held (= running, the plan's rule)
function countsOf(tasks) {
  var c = { total: tasks.length, held: 0 };
  STATES.forEach(function (s) { c[s] = 0; });
  tasks.forEach(function (t) { c[stateOf(t)] += 1; });
  c.held = c.running;
  return c;
}
// distinct holders: agents and subtrees
function holdersOf(tasks) {
  var seen = {}, agents = 0, subtrees = 0;
  tasks.forEach(function (t) {
    var k = holderKey(t.holder);
    if (!k || seen[k]) return;
    seen[k] = true;
    if (k.charAt(0) === "a") agents += 1; else subtrees += 1;
  });
  return { total: agents + subtrees, agents: agents, subtrees: subtrees };
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
// "22 tasks · 6 held · 1 blocked"
function subline(c) { return plural(c.total, "task", "tasks") + " · " + c.held + " held · " + c.blocked + " blocked"; }
// "6 held · 3 waiting · 1 blocked"
function kpiTasks(c) { return c.held + " held · " + c.waiting + " waiting · " + c.blocked + " blocked"; }
// "5 agents · 1 subtree"
function kpiHolders(h) { return plural(h.agents, "agent", "agents") + " · " + plural(h.subtrees, "subtree", "subtrees"); }
// the status bar and legend: the states that have tasks, in the mock's order, as the shared bar's parts {key, n, label, color}
function legendRows(c) {
  return LEGEND_ORDER.filter(function (s) { return c[s] > 0; }).map(function (s) { return { key: s, n: c[s], label: LABELS[s].toLowerCase(), color: SWATCH[s] }; });
}
// the list verb's own filters, applied here: `status` a state or "", `holder` a holder key or ""
function filterTasks(tasks, status, holder) {
  return tasks.filter(function (t) { return (!status || stateOf(t) === status) && (!holder || holderKey(t.holder) === holder); });
}
// the holder filter's choices, sorted by text
function holderOptions(tasks) {
  var seen = {}, out = [];
  tasks.forEach(function (t) {
    var k = holderKey(t.holder);
    if (!k || seen[k]) return;
    seen[k] = true; out.push({ key: k, text: holderText(t.holder) });
  });
  return out.sort(function (a, b) { return a.text < b.text ? -1 : a.text > b.text ? 1 : 0; });
}
// the table rows: a group head per state that has tasks (mock order), its items, and the done tasks past DONE_SHOWN folded behind "N more done"
function groupedRows(tasks, moreOpen) {
  var out = [];
  GROUP_ORDER.forEach(function (s) {
    var items = tasks.filter(function (t) { return stateOf(t) === s; });
    if (!items.length) return;
    out.push({ kind: "head", state: s, label: LABELS[s], n: items.length, color: SWATCH[s] });
    var shown = s === "done" && !moreOpen ? items.slice(0, DONE_SHOWN) : items;
    shown.forEach(function (t) { out.push({ kind: "item", id: t.id, state: s, holder: holderText(t.holder), nobody: holderText(t.holder) === "nobody" }); });
    if (shown.length < items.length) out.push({ kind: "more", n: items.length - shown.length });
  });
  return out;
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }
// "HH:MM" on the viewer's day, else the date before it; "" for no time
function clockText(ts, now) {
  if (typeof ts !== "number" || !isFinite(ts)) return "";
  var d = new Date(ts * 1000), n = new Date(now * 1000);
  var hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  var same = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  return same ? hm : d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + hm;
}
// the reassign history: each step as texts
function historyRows(entry, now) {
  var h = entry && Array.isArray(entry.history) ? entry.history : [];
  return h.filter(function (x) { return x && typeof x === "object"; }).map(function (x) {
    return { from: holderText(x.from), to: holderText(x.to), by: typeof x.by === "string" && x.by ? x.by : "", at: clockText(x.at, now) };
  });
}
// the last report: its caption and its result as text (a string as it is, anything else as JSON)
function reportOf(entry, now) {
  var r = entry && entry.report && typeof entry.report === "object" ? entry.report : null;
  if (!r) return null;
  var who = typeof r.from === "string" && r.from ? r.from : "nobody";
  var state = typeof r.state === "string" && STATES.indexOf(r.state) >= 0 ? r.state : "";
  var cap = "Last report from " + who;
  var at = clockText(r.at, now);
  if (at) cap += ", " + at;
  if (state) cap += ", state: " + state;
  var text = r.result == null ? "" : typeof r.result === "string" ? r.result : JSON.stringify(r.result, null, 2);
  return { caption: cap, text: text };
}
// the versions a task carries: only well-formed rows
function versionRows(entry) {
  var v = entry && Array.isArray(entry.versions) ? entry.versions : [];
  return v.filter(function (x) { return x && typeof x === "object"; }).map(function (x) {
    return { repo: oneLine(x.repo), branch: oneLine(x.branch), commit: oneLine(x.commit).slice(0, 12) };
  });
}
// a refusal's text, or "" for a good reply
function errorText(reply) {
  if (!reply || typeof reply !== "object") return "no answer";
  return typeof reply.error === "string" && reply.error ? reply.error : "";
}
// end pure

var ME = "{{agent}}";
var st = { tasks: [], status: "", holder: "", moreOpen: false, selected: "", entry: null, error: "", busy: false };
var $ = function (id) { return document.getElementById(id); };
function now() { return Date.now() / 1000; }

function paintHead(c) {
  $("name").textContent = ME;
  $("sub").textContent = subline(c);
  var n = $("chip-n"); n.hidden = false; n.textContent = plural(c.total, "task", "tasks");
  var b = $("chip-blocked"); b.hidden = c.blocked === 0; b.textContent = c.blocked + " blocked";
}
function paintKpis(c) {
  var hs = holdersOf(st.tasks);
  $("k-tasks").textContent = String(c.total); $("k-tasks-s").textContent = kpiTasks(c);
  $("k-holders").textContent = String(hs.total); $("k-holders-s").textContent = kpiHolders(hs);
}
function paintLegend(c) {
  var rows = legendRows(c), host = $("status-in");
  host.textContent = "";
  put(host, bar(rows), legend(rows));
}
function fillSelect(sel, options, value) {
  var key = JSON.stringify(options);
  if (sel.getAttribute("data-options") !== key) {
    sel.setAttribute("data-options", key);
    sel.textContent = "";
    var any = h("option", null, "any"); any.value = ""; sel.appendChild(any);
    options.forEach(function (o) { var op = h("option", null, o.text); op.value = o.key; sel.appendChild(op); });
  }
  sel.value = options.some(function (o) { return o.key === value; }) ? value : "";
}
function paintFilters() {
  fillSelect($("f-status"), STATES.map(function (s) { return { key: s, text: s }; }), st.status);
  fillSelect($("f-holder"), holderOptions(st.tasks), st.holder);
  st.status = $("f-status").value; st.holder = $("f-holder").value;
}
// the holder's small avatar, the mock's robot head as a glyph on the token colours
function avatarOf() {
  var a = h("span", "hav");
  var ns = "http://www.w3.org/2000/svg", v = document.createElementNS(ns, "svg"), d = document.createElementNS(ns, "path");
  v.setAttribute("viewBox", "0 0 16 16"); v.setAttribute("aria-hidden", "true");
  d.setAttribute("d", "M4 5.5h8a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1zM8 5.5V3.5M6 8.5v.5M10 8.5v.5");
  v.appendChild(d); a.appendChild(v);
  return a;
}
function statePill(state) { var p = pillOf(state); p.setAttribute("data-state", state); return p; }
function paintTable() {
  var host = $("tbl"); host.textContent = "";
  var shown = filterTasks(st.tasks, st.status, st.holder);
  var th = h("div", "tr th"); th.setAttribute("role", "row");
  ["issue", "holder", "status"].forEach(function (c) { var s = h("span", null, c); s.setAttribute("role", "columnheader"); th.appendChild(s); });
  host.appendChild(th);
  groupedRows(shown, st.moreOpen).forEach(function (r) {
    if (r.kind === "head") {
      var g = h("div", "gh"); g.setAttribute("role", "row");
      var u = h("u"); u.style.background = r.color;
      put(g, u, h("b", null, r.label), h("span", null, r.n));
      host.appendChild(g);
    } else if (r.kind === "item") {
      var b = h("button", "tr" + (st.selected === r.id ? " on" : "")); b.type = "button"; b.setAttribute("role", "row"); b.title = r.id;
      var id = h("span", "m ell", r.id); id.setAttribute("role", "cell");
      var who = h("span", "who"), wn = h("span", "m ell" + (r.nobody ? " dim" : ""), r.holder); who.setAttribute("role", "cell");
      if (!r.nobody) who.appendChild(avatarOf());
      who.appendChild(wn);
      var s = h("span"); s.setAttribute("role", "cell"); s.appendChild(statePill(r.state));
      put(b, id, who, s);
      b.addEventListener("click", function () { select(r.id); });
      host.appendChild(b);
    } else {
      var m = h("button", "more", r.n + " more done"); m.type = "button";
      m.addEventListener("click", function () { st.moreOpen = true; paintTable(); });
      host.appendChild(m);
    }
  });
  var note = $("note");
  if (st.error) { note.hidden = false; note.className = "err"; note.textContent = st.error; }
  else if (!st.tasks.length) { note.hidden = false; note.className = "empty"; note.textContent = "no tasks yet"; }
  else if (!shown.length) { note.hidden = false; note.className = "empty"; note.textContent = "no task matches the filters"; }
  else note.hidden = true;
}
function paintDetail() {
  var e = st.entry, t = now();
  $("detail").hidden = !e; $("hist").hidden = !e;
  if (!e) return;
  $("d-id").textContent = e.id; var p = $("d-state"); p.textContent = stateOf(e); p.setAttribute("data-state", stateOf(e));
  $("d-source").textContent = oneLine(e.source) || "-";
  $("d-holder").textContent = holderText(e.holder);
  var vs = versionRows(e), vt = $("d-vt"); vt.textContent = ""; $("d-versions").hidden = !vs.length;
  if (vs.length) {
    var th = h("div", "vt th"); ["repo", "branch", "commit"].forEach(function (c) { th.appendChild(h("span", null, c)); }); vt.appendChild(th);
    vs.forEach(function (v) { vt.appendChild(put(h("div", "vt"), h("span", "m ell", v.repo), h("span", "m ell", v.branch), h("span", "m", v.commit))); });
  }
  var hist = $("h-in"); hist.textContent = "";
  var steps = historyRows(e, t);
  steps.forEach(function (s) {
    var when = (s.by ? "by " + s.by : "") + (s.by && s.at ? " · " : "") + s.at;
    hist.appendChild(put(h("div", "row2"), h("span", "dot"), h("span", "m", s.from), h("span", "dim", "to"), h("span", "m", s.to), h("span", "dim", when)));
  });
  var rep = reportOf(e, t);
  if (rep) {
    hist.appendChild(h("div", "sub", rep.caption));
    if (rep.text) hist.appendChild(put(h("div", "code"), h("pre", null, rep.text)));
  }
  if (!steps.length && !rep) hist.appendChild(h("div", "empty", "nothing yet"));
}
function paint() {
  var c = countsOf(st.tasks);
  paintHead(c); paintKpis(c); paintLegend(c); paintFilters(); paintTable(); paintDetail();
}
function select(id) {
  st.selected = id; paintTable();
  return call(ME, { type: "get", id: id }).then(function (r) {
    if (st.selected !== id) return;
    st.entry = errorText(r) ? null : r; paintDetail();
  });
}
function refresh() {
  if (st.busy) return; st.busy = true;
  call(ME, { type: "list" }).then(function (r) {
    st.error = errorText(r); st.tasks = st.error ? [] : taskList(r);
    if (st.selected && !st.tasks.some(function (t) { return t.id === st.selected; })) { st.selected = ""; st.entry = null; }
    paint();
    return st.selected ? select(st.selected) : null;
  }).then(function () { st.busy = false; }, function () { st.busy = false; });
}
$("f-status").addEventListener("change", function () { st.status = $("f-status").value; paintTable(); });
$("f-holder").addEventListener("change", function () { st.holder = $("f-holder").value; paintTable(); });
paint();
refresh();
setInterval(refresh, 5000);
</script>
