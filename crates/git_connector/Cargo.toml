[package]
name = "team-git-connector"
description = "The git connector agent: worktrees, commits and pushes of work branches to one remote, SSH or HTTPS."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "team_git_connector"
path = "src/lib.rs"

[dependencies]
fantastic-bundle.workspace = true
fantastic-kernel.workspace = true
fantastic-ai-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
tokio.workspace = true

[dev-dependencies]
fantastic-kernel = { workspace = true, features = ["test-support"] }
fantastic-credential-store = { workspace = true, features = ["test-support"] }
fantastic-ram-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
base64.workspace = true
tokio.workspace = true
