# The provider_anthropic record plus every chat of this fleet on its `callable_by`.
id: provider
handler_module: anthropic_backend.tools
endpoint: "{{model_endpoint}}"
caching: {{caching}}
models: {{models}}
memory_store_id: provider_store
credentials:
  store: credentials
  ref: "model/{{model_host}}"
can_call:
  "$self": "*"
  provider_store: "*"
  credentials: [get]
callable_by:
  "$self": "*"
  "$parent": [complete, watch, models, set_default_model]
  ops: [complete, watch]
  k_rollout: [complete, watch]
  k_scale: [complete, watch]
  mkt: [complete, watch]
  m_ads: [complete, watch]
