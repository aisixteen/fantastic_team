id: worker_exec
handler_module: exec_bridge.tools
ingress_rule: allow_all_ingress
cwd: "{{work}}/repo"
allowed: [".*"]
inherit_env: [PATH, LANG, TMPDIR]
env:
  HOME: "{{work}}/sandbox"
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_TERMINAL_PROMPT: "0"
  PYTHONDONTWRITEBYTECODE: "1"
can_call:
  "$self": "*"
callable_by:
  "$self": "*"
