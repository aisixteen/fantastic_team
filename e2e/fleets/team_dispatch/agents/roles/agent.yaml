id: roles
handler_module: agentic_resources.tools
tiers:
  lead_t:
    handler_module: anthropic_backend.tools
    model: scripted-model
    endpoint: "{{model_endpoint}}"
    credentials:
      store: credentials
      ref: "model/{{model_host}}"
    memory_store_id: memory
    context_window: 100000
    max_tokens: 4000
can_call:
  "$self": "*"
  memory: "*"
callable_by:
  "$self": "*"
  "$parent": "*"
  lead: [roles, role, spawn, get_count, fleet]
  dispatcher: [get_count]
