id: credentials
handler_module: credential_store.tools
backend: env
refs:
  "model/{{model_host}}":
    host: "{{model_host}}"
    env:
      api_key: E2E_MODEL_KEY
  github/app:
    host: "{{forge_host}}"
    env:
      token: E2E_GH_TOKEN
can_call:
  "$self": "*"
callable_by:
  "$self": "*"
  github: "*"
