id: lead
handler_module: anthropic_backend.tools
model: "{{model_name}}"
endpoint: "{{model_endpoint}}"
credentials:
  store: credentials
  ref: "model/{{model_host}}"
memory_store_id: memory
context_window: 100000
max_tokens: 4000
can_call:
  "$self": "*"
  "$subtree": "*"
  memory: "*"
  credentials: "*"
  worker_exec: "*"
  worker_files: "*"
  queue: "*"
callable_by:
  "$self": "*"
  "$parent": "*"
  cadencer: [send]
