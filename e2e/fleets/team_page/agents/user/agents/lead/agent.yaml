id: lead
handler_module: ai_chat.tools
provider_id: provider
max_tokens: {{max_tokens}}
no_repeat_ngram_size: {{no_repeat_ngram_size}}
repetition_penalty: {{repetition_penalty}}
model: "{{model_name}}"
memory_store_id: memory
can_call:
  "$self": "*"
  provider: [complete, watch]
  "$subtree": "*"
  memory: "*"
  credentials: "*"
  worker_exec: "*"
  worker_files: "*"
callable_by:
  "$self": "*"
  "$parent": "*"
  cadencer: [send]
