id: lead
handler_module: ai_chat.tools
provider_id: provider
max_tokens: {{max_tokens}}
no_repeat_ngram_size: {{no_repeat_ngram_size}}
repetition_penalty: {{repetition_penalty}}
temperature: {{temperature}}
stop: {{stop}}
memory_store_id: memory
model: "{{model_name}}"
post_system_prompt: {{check_ins}}
can_call:
  "$self": "*"
  memory: "*"
  provider: [complete, watch]
  w1: "*"
  w2: "*"
  "$subtree": [schedule, unschedule, list, pause, resume, tick_now, history]
  kernel_state: [create_agent, delete_agent]
callable_by:
  "$self": "*"
  "$parent": "*"
  "$subtree": [send]
