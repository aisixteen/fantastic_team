id: credentials
handler_module: credential_store.tools
backend: env
refs:
  "model/{{model_host}}":
    host: "{{model_host}}"
    env:
      api_key: E2E_MODEL_KEY
  github/app:
    host: "{{forge_host}}"
    env:
      app_id: E2E_APP_ID
      private_key: E2E_APP_PEM
can_call:
  "$self": "*"
callable_by:
  "$self": "*"
  github: "*"
  lead: "*"
