# One lead on the scripted model, listed in a group so the page may chat with it.
# Double-brace names are filled by the launcher; no model, host or key is named here.
templates:
  lead_t:
    handler_module: anthropic_backend.tools
    model: scripted-model
    endpoint: "{{model_endpoint}}"
    credentials:
      store: credentials
      ref: "model/{{model_host}}"
    can_call: [worker_exec, worker_files, queue]
    extra:
      context_window: 100000
      max_tokens: 4000
first_agent:
  id: lead
  template: lead_t
groups:
  team:
    members: [lead]
queue:
  id: queue
credentials:
  id: credentials
  backend: env
  refs:
    "model/{{model_host}}":
      host: "{{model_host}}"
      env:
        api_key: E2E_MODEL_KEY
