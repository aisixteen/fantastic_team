# The team of the e2e: one lead on the scripted model, the git and github
# connectors against the fake forge, the puller, and the queue folder.
# Double-brace names are filled by the launcher; no model, host or key is named here.
templates:
  lead_t:
    handler_module: anthropic_backend.tools
    model: scripted-model
    endpoint: "{{model_endpoint}}"
    credentials:
      store: credentials
      ref: "model/{{model_host}}"
    can_call: [worker_exec, worker_files, queue, git, github]
    extra:
      context_window: 100000
      max_tokens: 4000
first_agent:
  id: lead
  template: lead_t
connectors:
  git:
    kind: team_git.tools
    record:
      repo_dir: "{{run_dir}}/clone"
      workspace_root: "{{run_dir}}/work/wt"
      remote: "{{forge_url}}/acme/widgets.git"
      default_branch: main
      author_name: Team Bot
      author_email: team-bot@example.invalid
      directive: Workers may make a worktree and commit. Never the default branch, never a force.
  github:
    kind: team_github.tools
    record:
      app:
        credentials:
          store: credentials
          ref: github/app
      repos: [acme/widgets]
      api_url: "{{forge_url}}"
      git: git
      directive: Push a work branch and open a draft pull request.
  queue_files:
    kind: file_bridge.tools
    record:
      root: "{{run_dir}}/work/tasks"
      allow: ["."]
  puller:
    kind: team_puller.tools
    record:
      repos: [acme/widgets]
      maintainer: maintainer-login
      app: "team-bot[bot]"
      github: github
      store: queue_files
queue:
  id: queue
credentials:
  id: credentials
  backend: env
  refs:
    "model/{{model_host}}":
      host: "{{model_host}}"
      env:
        api_key: E2E_MODEL_KEY
    github/app:
      host: "{{forge_host}}"
      env:
        app_id: E2E_APP_ID
        private_key: E2E_APP_PEM
groups:
  g:
    driver: lead
    members: [w1, w2]
board:
  repos: [acme/widgets]
  github: github
