# The team of the packs e2e: one lead on the scripted model and the credential store.
# No connector, queue, puller or git: the pack agents (pack, pack_listing, files, user) are
# planned under the lead by every team. Double-brace names are filled by the launcher.
templates:
  lead_t:
    handler_module: anthropic_backend.tools
    model: scripted-model
    endpoint: "{{model_endpoint}}"
    credentials:
      store: credentials
      ref: "model/{{model_host}}"
    can_call: [worker_exec, worker_files]
    extra:
      context_window: 100000
      max_tokens: 4000
first_agent:
  id: lead
  template: lead_t
queue:
  id: queue
credentials:
  id: credentials
  backend: env
  refs:
    "model/{{model_host}}":
      host: "{{model_host}}"
      env:
        api_key: E2E_MODEL_KEY
