# The `sublead` role: a meta bundle over the AI agent (`ai_chat.tools`): grants and a directive only.
# No provider and no model here: they are the chat's own fields (`provider_id`, `model`), set at spawn.
base: ai_chat.tools
sentence: Does the task it is given and reports to its parent with a message.
record:
  can_call:
    $self: '*'
    $subtree: [schedule, unschedule, list, pause, resume, tick_now, history]
    roles:
    - roles
    - role
    - spawn
    - get_count
    - fleet
    worker_exec: '*'
    kernel:
    - delete_agent
    kernel_state:
    - create_agent
    - delete_agent
  callable_by:
    $subtree: [send]
  post_system_prompt: |
    You are a sub-lead. Do the task you are given and send your parent a message when you are done.
