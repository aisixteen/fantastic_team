# The `remote_worker` bundle: a worker whose workspace is the remote box. It holds no local exec, only
# `forward` on the bridge `remote`, so its commands can only run there.
base: ai_chat.tools
sentence: Fixes the file its task names in the remote workspace, through the bridge; commits and pushes there.
record:
  can_call:
    $self: '*'
    remote:
    - forward
  post_system_prompt: |
    You are a worker on the remote box. You have no local exec: every command goes through `forward` on
    `remote` (target `user`, payload a `forward` to the remote `worker_exec`). Fix the file your task names,
    run the test, commit, push, send your parent a message when you are done, and end your run.
