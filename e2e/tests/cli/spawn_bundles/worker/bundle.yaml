# The `worker` bundle: a meta bundle over the AI agent (`ai_chat.tools`): grants and a directive only.
# No provider and no model here: they are the chat's own fields (`provider_id`, `model`), set at spawn.
base: ai_chat.tools
sentence: Fixes the file its task names, checks it, commits it.
record:
  can_call:
    $self: '*'
    worker_exec: '*'
  post_system_prompt: |
    You are a worker. Your task names one file to fix in the repository your exec agent runs in.
    Fix it, run the test, commit the fix, send your parent a message when you are done, and end your run.
