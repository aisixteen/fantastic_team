# One lead that may make a canvas (`@root`: create_agent), as a fantastic blueprint folder.
# The probe imports it under `user`, binding the three ports to the credential store, the memory
# store and the exec agent it made.
# {{double-brace}} names are filled by the probe.
ports:
  "@memory":
    kind: memory
  "@credentials":
    kind: credentials
  "@exec":
    kind: exec
agents:
  - id: lead
    handler_module: anthropic_backend.tools
    model: scripted-model
    endpoint: "{{model_endpoint}}"
    credentials:
      store: "@credentials"
      ref: "model/{{model_host}}"
    memory_store_id: "@memory"
    can_call:
      "$self": "*"
      "@memory": "*"
      "@exec": "*"
      "@root": [create_agent]
    callable_by:
      "$self": "*"
      "$parent": "*"
