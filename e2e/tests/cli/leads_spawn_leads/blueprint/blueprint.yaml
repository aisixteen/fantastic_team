# A lead with a roles registry (fantastic's `agentic_resources`) under it. The cards
# `roles/sublead.md` and `roles/worker.md` are not in the blueprint (a card is code to an import):
# the probe copies `roles/` next to the kernel, where `role_dirs` reads it. The lead holds
# everything the sublead card grants (a card may only grant what its spawner holds). The tier has
# no `credentials`: the scripted server needs no key, and a spawned agent is not on the credential
# store's `callable_by`.
ports:
  "@memory":
    kind: memory
  "@credentials":
    kind: credentials
  "@exec":
    kind: exec
agents:
  - id: lead
    handler_module: anthropic_backend.tools
    model: scripted-model
    endpoint: "{{model_endpoint}}"
    credentials:
      store: "@credentials"
      ref: "model/{{model_host}}"
    memory_store_id: "@memory"
    can_call:
      "$self": "*"
      "$subtree": "*"
      "@memory": "*"
      "@exec": "*"
      "@root": [delete_agent]
      roles: [roles, role, spawn, get_count, fleet]
    callable_by:
      "$self": "*"
      "$parent": "*"
    agents:
      - id: roles
        handler_module: agentic_resources.tools
        role_dirs: [roles]
        limits:
          total: 4
        tiers:
          small:
            handler_module: anthropic_backend.tools
            model: scripted-model
            endpoint: "{{model_endpoint}}"
            memory_store_id: memory
        can_call:
          "@memory": "*"
        callable_by:
          "$self": "*"
          "$parent": "*"
