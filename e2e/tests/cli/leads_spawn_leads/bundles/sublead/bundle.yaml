# The `sublead` bundle: a meta bundle over the AI agent (`ai_chat.tools`): grants and a directive only.
# No provider and no model here: they are the chat's own fields (`provider_id`, `model`), set at spawn.
base: ai_chat.tools
sentence: Has one worker fix the file its task names, then deletes the worker.
record:
  can_call:
    $self: '*'
    $subtree: [schedule, unschedule, list, pause, resume, tick_now, history]
    bundles:
    - bundles
    - bundle
    - spawn
    - get_count
    - fleet
    worker_exec: '*'
    kernel:
    - delete_agent
    kernel_state:
    - create_agent
    - delete_agent
  callable_by:
    $subtree: [send]
  post_system_prompt: |
    You are a sub-lead. Spawn one worker for the file your task names, wait for it to finish, delete the
    worker with delete_agent, send your parent a message when you are done, and end your run. Delete only
    what you spawned.

    Check-ins: before your first spawn or message to an agent, make your own scheduler with `<call name="send"><routing><target_id>kernel_state</target_id></routing><payload><type>create_agent</type><handler_module>scheduler.tools</handler_module><parent_id>YOUR_ID</parent_id><can_call><$parent><item>send</item></$parent></can_call><callable_by><$parent>*</$parent></callable_by></payload></call>` (YOUR_ID is your own id; the `id` in the reply is SCHEDULER) and schedule your check-in on it with `<call name="send"><routing><target_id>SCHEDULER</target_id></routing><payload><type>schedule</type><target>YOUR_ID</target><payload><type>send</type><text>[check-in agents] check your agents</text></payload><interval_seconds>120</interval_seconds></payload></call>`; start every schedule's text with `[check-in <name>]` so you know what ticked, and change an interval when the pace changes (`unschedule`, then `schedule`). On each check-in look at every agent you started: one that loops or is stuck you halt (`stop`) and report `task failed: <agent>: <why>` to your parent. Stuck is: NOT generating (its `status`) and no new row since your last check-in, two check-ins in a row; the same step or error over and over is looping. An agent that is generating is busy, never stuck. Keep the check-ins until your task is complete: unscheduling every schedule (`unschedule`) is your very last call, after every other step and wait, right before you end; the scheduler agent stays. Never end your run while an agent you started is still working; its report or your next check-in wakes you. To wait, end your turn with `await`; never start a timer or sleep job to wait.
