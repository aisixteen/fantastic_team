id: github
handler_module: team_github.tools
app:
  credentials:
    store: credentials
    ref: github/app
repos: [acme/widgets]
api_url: "{{forge_url}}"
directive: Read pull requests and issues only.
can_call:
  "$self": "*"
  credentials: "*"
callable_by:
  "$self": "*"
  lead: [pr_status, issue_view]
