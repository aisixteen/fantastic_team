# The one-store e2e: a lead on the scripted model starts a worker through the roles
# registry, with a total limit of 3. The tiers are the keys the role cards name
# (strong, small, issue_keeper). The worker tiers are inert (a RAM store), so no
# worker calls the model and the one script stays the lead's.
# The github connector and the board are here because the project_lead card
# grants them. Double-brace names are filled by the launcher.
templates:
  strong:
    handler_module: anthropic_backend.tools
    model: scripted-model
    endpoint: "{{model_endpoint}}"
    credentials:
      store: credentials
      ref: "model/{{model_host}}"
    can_call: [worker_exec, worker_files, queue]
    extra:
      context_window: 100000
      max_tokens: 4000
  small:
    handler_module: ram_store.tools
    model: inert
    endpoint: "{{model_endpoint}}"
    can_call: [worker_exec, worker_files, queue]
  issue_keeper:
    handler_module: ram_store.tools
    model: inert
    endpoint: "{{model_endpoint}}"
    can_call: [queue]
first_agent:
  id: lead
  template: strong
connectors:
  git:
    kind: team_git.tools
    record:
      repo_dir: "{{run_dir}}/clone"
      workspace_root: "{{run_dir}}/work/wt"
      remote: "{{forge_url}}/acme/widgets.git"
      default_branch: main
      author_name: Team Bot
      author_email: team-bot@example.invalid
      directive: Workers may make a worktree and commit. Never the default branch, never a force.
  github:
    kind: team_github.tools
    record:
      app:
        credentials:
          store: credentials
          ref: github/app
      repos: [acme/widgets]
      api_url: "{{forge_url}}"
      git: git
      directive: Push a work branch and open a draft pull request.
queue:
  id: queue
board:
  repos: [acme/widgets]
  github: github
roles:
  id: roles
  dirs: [roles]
  limits:
    total: 3
credentials:
  id: credentials
  backend: env
  refs:
    "model/{{model_host}}":
      host: "{{model_host}}"
      env:
        api_key: E2E_MODEL_KEY
    github/app:
      host: "{{forge_host}}"
      env:
        app_id: E2E_APP_ID
        private_key: E2E_APP_PEM
