# The team of the e2e: one lead on a real model (the anthropic plug), as a fantastic blueprint folder.
# `helpers/stock.py` makes the agents a blueprint cannot hold (the credential store, the worker's
# exec and files, the queue, the git and github connectors against the fake forge, the puller),
# imports this folder under `user` and binds each port to the agent of that name:
#   @memory=memory @credentials=credentials @exec=worker_exec @files=worker_files
#   @queue=queue @git=git @github=github
# {{double-brace}} names are filled by the launcher; no model, host or key is named here.
ports:
  "@memory":
    kind: memory
  "@credentials":
    kind: credentials
  "@exec":
    kind: exec
  "@files":
    kind: files
  "@queue":
    kind: connector
  "@git":
    kind: connector
  "@github":
    kind: connector
agents:
  - id: lead
    handler_module: anthropic_backend.tools
    model: "{{model_name}}"
    endpoint: "{{model_endpoint}}"
    credentials:
      store: "@credentials"
      ref: "model/{{model_host}}"
    memory_store_id: "@memory"
    context_window: 100000
    max_tokens: 4000
    can_call:
      "$self": "*"
      "$subtree": "*"
      "@memory": "*"
      "@exec": "*"
      "@files": "*"
      "@queue": "*"
      "@git": "*"
      "@github": "*"
    callable_by:
      "$self": "*"
      "$parent": "*"
