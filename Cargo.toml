[workspace]
resolver = "2"
members = ["crates/shift", "crates/git_connector"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/aisixteen/fantastic_shift"

[workspace.dependencies]
# fantastic, followed by BRANCH; Cargo.lock pins the exact commit. Update all fantastic crates at once with
# scripts/update-fantastic.sh (or `cargo update -p fantastic-kernel`). The branch is the fantastic-host PR
# (aisixteen/fantastic#250) until it merges; then it becomes "main" — one word, in all three lines.
fantastic-kernel = { git = "https://github.com/aisixteen/fantastic", branch = "fix/248-fantastic-host-haiku" }
fantastic-host = { git = "https://github.com/aisixteen/fantastic", branch = "fix/248-fantastic-host-haiku" }
fantastic-bundle = { git = "https://github.com/aisixteen/fantastic", branch = "fix/248-fantastic-host-haiku" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
fantastic-ai-core = { git = "https://github.com/aisixteen/fantastic", branch = "fix/248-fantastic-host-haiku" }
fantastic-credential-store = { git = "https://github.com/aisixteen/fantastic", branch = "fix/248-fantastic-host-haiku" }
fantastic-ram-store = { git = "https://github.com/aisixteen/fantastic", branch = "fix/248-fantastic-host-haiku" }
async-trait = "0.1"
tempfile = "3"
base64 = "0.22"
